# ============================================================================
# The RENDERED tier — run the proof INSIDE the converter network.
# ----------------------------------------------------------------------------
# `src/**/__rendered__/` proves ruling #117(e): the attestation footer as
# LIBREOFFICE actually paints it, on a genuinely multi-page document. It needs a
# route to the gotenberg sidecar.
#
# ⚠️ THE OBVIOUS APPROACH — PUBLISHING GOTENBERG'S PORT — IS WRONG HERE, AND IT
# FAILS SILENTLY, WHICH IS WHY THIS COMMENT EXISTS. The `converter` network is
# `internal: true` ON PURPOSE: "the filled DOCX crosses to a service with no
# route off the host" (docx-preview/convert.ts). Docker will not publish a port
# for a container attached only to an internal network — `docker compose config`
# shows the mapping, the container starts healthy, and `docker ps` shows no
# published port. Nothing errors. Adding a second, non-internal network to
# gotenberg WOULD make the publish work, and would hand a document converter
# outbound internet access — undoing the isolation this stack is built on.
#
# So the test comes to the sidecar instead of the sidecar coming to the test.
# `rendered-tests` joins `converter`, reaches `http://gotenberg:3000` by service
# name — the SAME address the application itself uses — and the network stays
# internal.
#
# Run it:
#   docker compose -f docker-compose.qa.yml -f docker-compose.qa.rendered.yml \
#     run --rm --build rendered-tests
# ============================================================================
services:
  rendered-tests:
    # ⚠️ PINNED TO THE SAME DIGEST THE APP BUILDS FROM (Dockerfile's NODE_BASE).
    # A floating `node:22` here would mean the proof and the product ran on
    # different runtimes, and the first time that mattered would be the first
    # time it disagreed.
    image: node@sha256:8ea2348b068a9544dae7317b4f3aafcdc032df1647bb7d768a05a5cad1a7683f

    # ⚠️ NEVER STARTED BY `up`. Without a profile this would be brought up by
    # every `docker compose up` in the QA stack and sit there having run the
    # suite once. It is a one-shot, invoked by `run`.
    profiles: ["rendered"]

    networks:
      - converter

    working_dir: /repo/apps/transcribe-md

    # ⚠️ READ-ONLY, AND BOTH HALVES OF THAT ARE DELIBERATE.
    #
    # 1. THE DEPLOY SURFACE. This mounts the working tree. A container writing
    #    into it — vitest's default cache is `node_modules/.vite` — leaves files
    #    owned by whatever uid the container ran as. The unattended loop cannot
    #    chown or delete them (`rm` and `shred` are denied to it), so a test run
    #    would dirty the tree permanently and block the next relight.
    # 2. UID PORTABILITY. Pinning `user:` to a host uid breaks on a GitHub
    #    runner, whose checkout is owned by 1001, not 1000. Read-only sidesteps
    #    the question rather than guessing an answer per environment.
    #
    # `cacheDir` and `HOME` are redirected to the container's own tmpfs in
    # vitest.rendered.config.ts and below, so nothing needs to write here.
    volumes:
      - .:/repo:ro

    tmpfs:
      - /tmp:rw,size=256m

    environment:
      # The in-network address. Identical to what the application resolves.
      GOTENBERG_URL: http://gotenberg:3000
      CI: "true"
      # npm/node want a writable HOME; the read-only mount would deny theirs.
      HOME: /tmp

    depends_on:
      gotenberg:
        condition: service_healthy

    # ⚠️ PRECONDITION: the bind-mounted tree must already carry `node_modules`.
    # In `e2e.yml` that is guaranteed — `npm ci` runs at the repo root in the
    # step immediately above this one.
    #
    # ⚠️ THE BINARY IS INVOKED BY EXPLICIT PATH, NOT THROUGH `npx`, AND THAT IS
    # A MEASURED DECISION RATHER THAN A STYLE ONE. With `node_modules` absent,
    # `npx vitest` goes to the REGISTRY — and this container has no route out —
    # so the run dies on
    #   `npm error EAI_AGAIN ... getaddrinfo registry.npmjs.org`
    # which reads as a fault in the CONVERTER rather than as "the deps are not
    # here". Observed running this from a fresh `git worktree`, which checks out
    # tracked files only.
    #
    # ⚠️ AND `npx --no-install` DOES NOT FIX IT — measured, same error. That flag
    # is a no-op on this npm; the modern spelling is `--no`. An explicit path
    # depends on no flag semantics at all: if the file is not there the container
    # says so immediately, and nothing reaches for the network either way.
    #
    # vitest is hoisted to the ROOT of the workspace, not into the app.
    command:
      - /repo/node_modules/.bin/vitest
      - run
      - --config
      - vitest.rendered.config.ts
