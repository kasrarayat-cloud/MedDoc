# =============================================================================
# QuillMD host-nginx vhost — STAGED 2026-06-03 (site-down recovery)
# Install target: /etc/nginx/sites-available/quillmd
#                 ln -s ../sites-available/quillmd /etc/nginx/sites-enabled/quillmd
#
# Architecture (matches the existing leathererp vhost pattern):
#   CloudFlare grey-cloud (DNS-only, A → 147.189.172.8)
#     → host nginx  (TLS termination, Let's Encrypt)
#       → QuillMD Caddy on 127.0.0.1:8443  (per-host routing + MODE B headers)
#         → app containers (transcribe-md:3011 / marketing:3010 / meddoc-pro:3000)
#
# SHARED BOX: specific server_names + NO default_server → cannot hijack
# dealhunter / dealmason / leathererp traffic. Do NOT add `default_server`.
# =============================================================================

map $http_upgrade $connection_upgrade_qmd {
    default upgrade;
    ''      close;
}

# --- HTTP :80 — ACME HTTP-01 challenge + 301→HTTPS, quillmd names ONLY -------
server {
    listen 80;
    listen [::]:80;
    server_name quillmd.com www.quillmd.com app.quillmd.com admin.quillmd.com pro.quillmd.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS :443 — all quillmd names → QuillMD Caddy (127.0.0.1:8443) ---------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl;
    server_name quillmd.com www.quillmd.com app.quillmd.com admin.quillmd.com pro.quillmd.com;

    # Single SAN cert covering all five names (see certbot command in the runbook).
    ssl_certificate     /etc/letsencrypt/live/quillmd.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quillmd.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 200m;   # audio uploads / long transcription posts

    location / {
        proxy_pass            https://127.0.0.1:8443;
        proxy_ssl_server_name on;
        proxy_ssl_name        $host;   # SNI so Caddy selects the right site
        proxy_ssl_verify      off;     # Caddy serves its internal cert on 8443; trust anchored at this hop
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto https;
        proxy_set_header      Upgrade           $http_upgrade;
        proxy_set_header      Connection        $connection_upgrade_qmd;
        proxy_read_timeout    300s;
    }
}

