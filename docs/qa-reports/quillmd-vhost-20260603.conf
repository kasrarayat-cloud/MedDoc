#      install quillmd.conf but COMMENT OUT the entire :443 server block,
#      then:  nginx -t && nginx -s reload
#      mkdir -p /var/www/certbot
#
# 2. Issue the LE cert (dockerized — no host install needed):
#      docker run --rm \
#        -v /etc/letsencrypt:/etc/letsencrypt \
#        -v /var/www/certbot:/var/www/certbot \
#        certbot/certbot certonly --webroot -w /var/www/certbot \
#        -d quillmd.com -d www.quillmd.com -d app.quillmd.com \
#        -d admin.quillmd.com -d pro.quillmd.com \
#        --agree-tos -m support@ashtechgroup.com --no-eff-email
#      (HTTP-01 reaches the origin because quillmd is grey-cloud → 147.189.172.8.)
#
# 3. Uncomment the :443 block, then:  nginx -t && nginx -s reload
#
# 4. Verify (publicly-trusted now, NO -k):
#      curl -sS -w 'HTTP=%{http_code}\n' https://app.quillmd.com/api/health
#      → expect 200 + {"checks":{"postgres":{"ok":true}...}} + version T-M19.1
#
# 5. Cert renewal: add a cron/systemd-timer that runs the certbot container with
#    `renew` + `nginx -s reload` in deploy hook. (QuillMD Caddy no longer renews
#    these — it is portless behind nginx.)
# =============================================================================
