# ============================================================================
# Real-document preview QA override — runs the isolated QA stack against an
# image built with NEXT_PUBLIC_DOC_PREVIEW=true (and the settings simple row it
# depends on for the row half). Build-time flags cannot be flipped at runtime,
# so the flag-ON surface needs its own image.
#
#   docker compose -f docker-compose.qa.yml -f docker-compose.qa.docpreview.yml \
#     up -d --wait transcribe-md
#
# Production is untouched: separate project / network / volumes.
# ============================================================================
services:
  transcribe-md:
    image: meddoc-pro-transcribe-md:doc-preview
