<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <style>
    :root {
      --bg: #0b0f19;
      --surface: #111827;
      --border: #1f2937;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --accent: #8b5cf6;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      margin: 0;
      padding: 32px;
      background: var(--bg);
      color: var(--text);
      line-height: 1.4;
    }
    header.top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }
    header.top h1 { font-size: 18px; margin: 0; letter-spacing: -0.01em; }
    header.top .summary { color: var(--muted); font-size: 14px; }
    header.top .summary strong { color: var(--text); }
    .filters {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      font-size: 13px;
    }
    .filters button {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 5px 12px;
      cursor: pointer;
    }
    .filters button[aria-pressed="true"] {
      background: var(--accent);
      border-color: var(--accent);
    }
    section.suite {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 16px;
      overflow: hidden;
    }
    section.suite.err { border-color: #dc262666; }
    section.suite > header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding: 14px 18px;
      background: rgba(255,255,255,0.02);
      border-bottom: 1px solid var(--border);
    }
    section.suite h2 {
      font-size: 14px;
      font-weight: 600;
      margin: 0;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: var(--text);
    }
    section.suite .summary { color: var(--muted); font-size: 12px; font-family: ui-monospace, monospace; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td {
      text-align: left;
      padding: 8px 18px;
      border-top: 1px solid var(--border);
    }
    thead th {
      font-weight: 500;
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-top: none;
    }
    td.name { color: var(--text); }
    td.num { color: var(--muted); font-family: ui-monospace, monospace; font-size: 12px; width: 80px; }
    td.details { color: var(--muted); font-family: ui-monospace, monospace; font-size: 12px; }
    .pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-family: ui-monospace, monospace;
      font-size: 11px;
      letter-spacing: 0.05em;
      font-weight: 500;
    }
    footer { color: var(--muted); font-size: 12px; text-align: center; margin-top: 32px; }
  </style>
</head>
<body>
  <header class="top">
    <h1>{{TITLE}}</h1>
    <span class="summary">{{SUMMARY}}</span>
  </header>

  <div class="filters" role="toolbar" aria-label="Filter by status">
    <button data-filter="all" aria-pressed="true">All</button>
    <button data-filter="fail" aria-pressed="false">Fail only</button>
    <button data-filter="pass" aria-pressed="false">Pass only</button>
  </div>

  {{SUITES_HTML}}

  <footer>
    Generated by tests/automated/run-all.sh · click a row's <em>Details</em> cell to copy it.
  </footer>

  <script>
    // Filter rows by status. Matches the PILL text content so markup
    // changes in the renderer don't silently break the filter.
    const buttons = document.querySelectorAll('.filters button');
    buttons.forEach((b) => b.addEventListener('click', () => {
      buttons.forEach((x) => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
      const filter = b.dataset.filter;
      document.querySelectorAll('tbody tr').forEach((tr) => {
        const pill = tr.querySelector('.pill');
        if (!pill) return;
        const status = pill.textContent.trim().toLowerCase();
        tr.style.display =
          filter === 'all' || filter === status ? '' : 'none';
      });
    }));

    // Click-to-copy on the details column (mostly useful for error
    // messages you want to paste into an issue).
    document.querySelectorAll('td.details').forEach((td) => {
      td.style.cursor = 'pointer';
      td.title = 'Click to copy';
      td.addEventListener('click', async () => {
        if (!td.textContent) return;
        await navigator.clipboard.writeText(td.textContent);
        const original = td.textContent;
        td.textContent = 'copied';
        setTimeout(() => { td.textContent = original; }, 700);
      });
    });
  </script>
</body>
</html>
