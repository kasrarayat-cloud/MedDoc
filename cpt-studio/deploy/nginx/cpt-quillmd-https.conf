# CPT Studio — @@DOMAIN@@ — HTTP stage: ACME HTTP-01 challenge and redirect only.
# Installed by cpt-studio/ops/install.py --phase http-vhost as a NEW file,
# /etc/nginx/sites-available/quillmd-cpt (+ sites-enabled symlink). The quillmd
# vhost is never edited: other tools pin its sha256.
# One specific server_name and NO default_server, so every unmatched host keeps
# landing where it lands today. The application is never served over plain HTTP.
server {
    listen 80;
    listen [::]:80;
    server_name @@DOMAIN@@;
    if ($host != @@DOMAIN@@) { return 444; }
    access_log off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://@@DOMAIN@@$request_uri;
    }
}

# HTTPS stage: one server block for the two hosts CPT Studio serves, @@DOMAIN@@
# and admin.quillmd.com - the operator console's own host (owner direction
# 2026-11-23, DECISIONS D396) - with one certificate, the cpt-studio lineage,
# and one upstream, so the blue/green switch moves both. Installed by --phase
# ingress, which removes admin.quillmd.com from the quillmd vhost's :443 line in
# the same reload (ops/INSTALL.md: the coupling invariant); the note above that
# the quillmd vhost is never edited predates that move and stays as it was, in
# the HTTP stage every renewal reads. admin.quillmd.com's :80 - its HTTP-01
# challenge - stays the quillmd vhost's. The block above is kept byte-identical
# so renewals keep working. Login-protected synthetic demonstration only.
#
# Release 1 (RELEASE-1-SPEC A1-A4, B6): the front door's limits, its access log
# without query strings, nothing spooled to disk, the TLS policy and both
# session cookie names. The http-level definitions below sit between the HTTP
# stage and the 443 block (this file is included inside nginx's http {}); every
# zone, map variable, log format and named location is cpt_*, so nothing clashes
# with a co-tenant's file on this shared nginx. This file is published before the
# blue/green switch, so all of it works with the previous revision's web too.
#
# A1: the installer's probes and the release walk come from this host itself
# (loopback, or its public address), and a local process can reach the web's
# loopback port directly anyway: they are not counted.
geo $cpt_exempt {
    default 0;
    127.0.0.1 1;
    ::1 1;
    147.189.172.8 1;
}
# Every limit counts a client: an IPv4 address as it is, an IPv6 one by its /64
# - one household or office network, which a single client can fill with
# addresses (refutation, edge lens C-15). nginx writes $remote_addr in RFC 5952
# form (lower case, no leading zeros, the longest run of two or more zero groups
# written ::), so the /64 is its first four groups, read off each way :: can
# fall among them; the IPv6 listener is ipv6only, so no IPv4-mapped address
# arrives there (one is read as its IPv4 address anyway).
map $remote_addr $cpt_client {
    "~^[0-9.]+$" $remote_addr;
    "~^::ffff:([0-9.]+)$" $1;
    "~^([0-9a-f]+:[0-9a-f]+:[0-9a-f]+:[0-9a-f]+):" $1;
    "~^([0-9a-f]+):([0-9a-f]+):([0-9a-f]+)::" "$1:$2:$3:0";
    "~^([0-9a-f]+):([0-9a-f]+)::" "$1:$2:0:0";
    "~^([0-9a-f]+)::([0-9a-f]+):[0-9a-f]+:[0-9a-f]+:[0-9a-f]+:[0-9a-f]+$" "$1:0:0:$2";
    "~^([0-9a-f]+)::" "$1:0:0:0";
    "~^::([0-9a-f]+):([0-9a-f]+):[0-9a-f]+:[0-9a-f]+:[0-9a-f]+:[0-9a-f]+$" "0:0:$1:$2";
    "~^::([0-9a-f]+):[0-9a-f]+:[0-9a-f]+:[0-9a-f]+:[0-9a-f]+$" "0:0:0:$1";
    "~^::" "0:0:0:0";
    default $remote_addr;
}
# Each key is that client, or empty - and nginx counts no request whose key is
# empty. The path is $uri (never the query string), and an id matches
# [0-9a-f-]+ only, so no pattern runs on a crafted path.
map "$cpt_exempt:$request_method $uri" $cpt_all_key {
    "~^0:" $cpt_client;
    default "";
}
map "$cpt_exempt:$request_method $uri" $cpt_signin_key {
    "0:POST /login/" $cpt_client;
    default "";
}
map "$cpt_exempt:$request_method $uri" $cpt_write_key {
    # Release 2 (R2-27): the documents' search is a read sent as a POST, so its
    # words stay out of every address and log. It counts in cpt_all alone, so an
    # office searching at once never spends the write zone its decisions and
    # answers need. In an nginx map an exact key wins over every expression.
    "0:POST /api/encounters/search" "";
    "~^0:POST /(api|ops)/" $cpt_client;
    default "";
}
map "$cpt_exempt:$request_method $uri" $cpt_upload_key {
    "0:POST /api/encounters" $cpt_client;
    default "";
}
map "$cpt_exempt:$request_method $uri" $cpt_export_key {
    "~^0:POST /api/encounters/[0-9a-f-]+/reports$" $cpt_client;
    default "";
}
map "$cpt_exempt:$request_method $uri" $cpt_bytes_key {
    "~^0:[A-Z]+ /(api/encounters/[0-9a-f-]+/(original|bundle)|api/reports/[0-9a-f-]+/download|ops/encounters/[0-9a-f-]+/original)$" $cpt_client;
    default "";
}
map $cpt_exempt $cpt_conn_key {
    0 $cpt_client;
    default "";
}
# A3 (refutation, edge lens C-15, and its follow-up): nginx reserves a request
# body's buffer at the length the client declares and keeps it until the body
# has been read, so a slow sender holds that much. Each route takes the body it
# needs (the locations below): the upload 20m; a coding review's answers 1m (50
# answers of 2,000 characters at 4 bytes each is 400 KB); every other request
# 64k - sign-in, account, second factor, the JSON API's posts and the console,
# whose largest body (a decision's acknowledgement and note, or a console note)
# is under 25 KB. A larger declared length is refused 413 before any of it is
# read. So only an upload or answers can declare more than 64 KiB, and such a
# body counts 4 at once per client and 40 at once in all: under 40 x 20 MiB =
# 800 MiB however many clients send. A body of 64 KiB or less counts per client
# only, 40 at once (the sign-in burst's 40 pass): under 2.5 MiB a client, with
# no global cap, so slow uploads can never keep anyone from signing in. A body
# whose length is not declared - an HTTP/2 stream, by a method the 411 rule
# below lets through - is cut off at 64 KiB read (the proxied location's limit)
# and counts in cpt_conn, 40 at once per client. A declared length may carry
# leading zeros, which nginx reads past, so the class does too. Downloads'
# response buffers (24 MiB each, below): 20 at once per client, 24 in all,
# under 576 MiB.
map $content_length $cpt_body_size {
    "~^0*([1-9][0-9]{5,}|[7-9][0-9]{4}|6[6-9][0-9]{3}|65[6-9][0-9]{2}|655[4-9][0-9]|6553[7-9])$" large;
    "~^0*[1-9]" small;
    default "";
}
map "$cpt_exempt:$cpt_body_size" $cpt_large_body_key {
    0:large $cpt_client;
    default "";
}
map "$cpt_exempt:$cpt_body_size" $cpt_small_body_key {
    0:small $cpt_client;
    default "";
}
map $cpt_large_body_key $cpt_large_body_all_key {
    "~." cpt;
    default "";
}
map $cpt_bytes_key $cpt_bytes_all_key {
    "~." cpt;
    default "";
}
# A body whose length nginx cannot know up front is refused with 411 when it is
# chunked or its method carries a body (POST, PUT, PATCH) with no length: every
# browser sends the length (refutation, edge lens C-16). One these variables
# cannot tell from a request with no body - an HTTP/2 stream with no length, by
# another method - is cut off at 64 KiB read (client_max_body_size, below), well
# inside its buffer, so it never reaches the disk either.
map "$request_method:$content_length:$http_transfer_encoding" $cpt_unsized_body {
    "~^[^:]*:[^:]*:.+$" 1;
    "~^(POST|PUT|PATCH)::$" 1;
    default 0;
}
# The starting numbers (owner decision D5: sized on a copy before the live
# publish). The site's measured ceiling is about 110 to 125 requests a second on
# the detail call, with release 2's four processes (R2-6; about 65 to 80 with
# release 1's two), so cpt_all is a flood stop, not fairness between practices
# (release 3). The sign-in and the upload are sized for an office behind one
# address (refutation, edge lens C-12, C-13): 20 people each uploading a
# document every 2 minutes, and everyone signing in again at once after the
# switch signs them out; B1 is the guessing control and the application's own
# per-member limit the fine one.
# A zone's size never changes once published: nginx refuses a reload that
# redeclares a zone with another size, so a new size takes a new name.
limit_req_zone $cpt_all_key zone=cpt_all:10m rate=30r/s;
limit_req_zone $cpt_signin_key zone=cpt_signin:5m rate=60r/m;
limit_req_zone $cpt_write_key zone=cpt_write:2m rate=5r/s;
limit_req_zone $cpt_upload_key zone=cpt_upload:2m rate=60r/m;
limit_req_zone $cpt_export_key zone=cpt_export:2m rate=6r/m;
limit_conn_zone $cpt_conn_key zone=cpt_conn:5m;
limit_conn_zone $cpt_bytes_key zone=cpt_bytes_conn:2m;
limit_conn_zone $cpt_bytes_all_key zone=cpt_bytes_all:1m;
limit_conn_zone $cpt_large_body_key zone=cpt_large_body:2m;
limit_conn_zone $cpt_large_body_all_key zone=cpt_large_body_all:1m;
limit_conn_zone $cpt_small_body_key zone=cpt_small_body:5m;
# A2: the path without its query string ($uri, never $request_uri, $args or
# $http_referer), nginx's request id (handed to the application, which stores it
# on its audit rows) and the session reference the application names in
# X-CPT-Actor (a sign-in reference, never a name; hidden from the browser below).
log_format cpt_studio '$time_iso8601 $remote_addr $ssl_server_name $host "$request_method $uri $server_protocol" $status $body_bytes_sent $request_time $upstream_status $upstream_response_time $request_id "$upstream_http_x_cpt_actor" $limit_req_status "$http_user_agent"';

# The listen pair is the majority style on this host (quillmd.com, leathererp,
# staging): measured with nginx 1.24 in the real include order, it adds no
# "protocol options redefined" warning, where 'ssl http2' on both added two.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl;
    server_name @@DOMAIN@@ admin.quillmd.com;
    # Any other Host is closed. A TLS server name that is not one of the two - a
    # connection opened for another QuillMD name, whose certificate also covers
    # admin.quillmd.com, and reused by a browser - is answered 421 Misdirected
    # Request, so the browser retries on a fresh connection; one opened for
    # either of the two serves both, since one certificate covers them.
    if ($host !~ ^(cpt|admin)\.quillmd\.com$) { return 444; }
    if ($ssl_server_name !~ ^(cpt|admin)\.quillmd\.com$) { return 421; }
    # A3: a chunked body, or a POST, PUT or PATCH with no length, is refused
    # before any of it is read (above)
    if ($cpt_unsized_body) { return 411; }

    ssl_certificate /etc/letsencrypt/live/cpt-studio/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cpt-studio/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # A4: the AES-GCM suites (NIST SP 800-52 Rev. 2) are asked for here; the
    # certificate is ECDSA, and the RSA pair keeps a future RSA certificate
    # working. They hold only where these settings apply: CPT is not this shared
    # listener's default server, and once SNI has chosen it, ssl_protocols, the
    # TLS 1.3 Ciphersuites and ssl_prefer_server_ciphers stay the default
    # server's, so TLS 1.3 ChaCha20 is accepted (measured; refutation, edge lens
    # C-17). The installer's probes record what negotiates (tls_policy_problems;
    # owner decision D27); CPT's own nginx on the new server enforces it.
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_conf_command Ciphersuites TLS_AES_256_GCM_SHA384:TLS_AES_128_GCM_SHA256;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets off;
    server_tokens off;
    # A2: every request at the edge, warnings included ("buffered to a temporary
    # file", and the 444, 421, 413 and 429 refusals).
    access_log /var/log/nginx/cpt-studio-access.log cpt_studio;
    error_log /var/log/nginx/cpt-studio-error.log warn;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    # A3: a request's body is at most 64 KiB unless its location says otherwise
    # (below: the upload and the answers) - this also cuts off, in the proxied
    # location, a body whose length is not declared - and is held in memory up to
    # the largest one accepted, so none is written to nginx's body directory on
    # the unencrypted disk; how many are held at once is bounded above
    # (cpt_large_body, cpt_large_body_all, cpt_small_body, cpt_conn).
    client_max_body_size 64k;
    client_body_buffer_size 20m;
    # the locations hand every request to @cpt_proxy with error_page 418; its own
    # error pages (429, 502, 504) still apply there
    recursive_error_pages on;
    # A1: slow clients are cut off instead of holding a connection (a body that
    # stalls 15 s between two reads releases its buffer).
    client_header_timeout 15s;
    client_body_timeout 15s;
    send_timeout 60s;
    reset_timedout_connection on;

    # Each location gives its routes the body they need - checked against the
    # declared length as the location is chosen, before any of it is read - and
    # hands the request on, its URI and method unchanged, to the one proxied
    # location (the installer allows one proxy_pass, which the switch rewrites).
    location / {
        client_max_body_size 64k;
        error_page 418 = @cpt_proxy;
        return 418;
    }
    location = /api/encounters {
        client_max_body_size 20m;
        error_page 418 = @cpt_proxy;
        return 418;
    }
    location ~ ^/api/encounters/[0-9a-f-]+/answers$ {
        client_max_body_size 1m;
        error_page 418 = @cpt_proxy;
        return 418;
    }
    location @cpt_proxy {
        # A1: every limit is here, in the one proxied location.
        limit_req zone=cpt_all burst=120 nodelay;
        limit_req zone=cpt_signin burst=40 nodelay;
        limit_req zone=cpt_write burst=30 nodelay;
        limit_req zone=cpt_upload burst=60 nodelay;
        limit_req zone=cpt_export burst=6 nodelay;
        limit_conn cpt_conn 40;
        limit_conn cpt_bytes_conn 20;
        limit_conn cpt_bytes_all 24;
        limit_conn cpt_large_body 4;
        limit_conn cpt_large_body_all 40;
        limit_conn cpt_small_body 40;
        limit_req_status 429;
        limit_conn_status 429;
        error_page 429 = @cpt_too_many;
        proxy_pass http://@@UPSTREAM@@;
        proxy_http_version 1.1;
        # The guard above lets only the two names through: the application sees
        # which one was asked for (the admin host has its own urlconf) and checks
        # a form's Origin against it.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        # REPLACE, never append: this nginx is the edge, so $remote_addr is the client.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization "";
        proxy_set_header Connection "";
        # A2: the same id as this edge's access log line.
        proxy_set_header X-Request-ID $request_id;
        # One copy of each policy header, from this edge.
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Robots-Tag;
        # A2: logged above, never shown to the browser.
        proxy_hide_header X-CPT-Actor;
        # The session cookie is HttpOnly - under its old name for the previous
        # revision's web and its __Host- name (B6) for this one's: the file is
        # published before the switch. The CSRF cookie must stay readable by the
        # page script (it sends X-CSRFToken), so it gets Secure/SameSite only.
        proxy_cookie_flags cptstudio_session secure httponly samesite=strict;
        proxy_cookie_flags __Host-cptstudio_session secure httponly samesite=strict;
        proxy_cookie_flags ~ secure samesite=strict;
        proxy_redirect off;
        proxy_connect_timeout 10s;
        # A1: under overload a request fails within a minute instead of three.
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        # A3: responses are held in memory (24 MiB: the largest file served),
        # and a larger one is relayed without a temporary file.
        proxy_buffering on;
        proxy_buffers 96 256k;
        proxy_busy_buffers_size 1m;
        proxy_max_temp_file_size 0;
        error_page 502 504 =503 @cpt_unavailable;
    }
    location @cpt_unavailable {
        default_type text/plain;
        return 503 "CPT Studio is temporarily unavailable.\n";
    }
    location @cpt_too_many {
        default_type text/plain;
        return 429 "Too many requests. Wait a minute and try again.\n";
    }
}
