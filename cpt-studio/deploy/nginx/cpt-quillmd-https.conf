# CPT Studio — @@DOMAIN@@ — HTTP stage: ACME HTTP-01 challenge and redirect only.
# Installed by cpt-studio/ops/install.py --phase http-vhost as a NEW file,
# /etc/nginx/sites-available/quillmd-cpt (+ sites-enabled symlink). The quillmd
# vhost is never edited: other tools pin its sha256.
# One specific server_name and NO default_server, so every unmatched host keeps
# landing where it lands today. The application is never served over plain HTTP.
server {
    listen 80;
    listen [::]:80;
    server_name @@DOMAIN@@;
    if ($host != @@DOMAIN@@) { return 444; }
    access_log off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://@@DOMAIN@@$request_uri;
    }
}

# HTTPS stage, installed by --phase https-vhost once the separate
# @@DOMAIN@@ lineage exists. The block above is kept byte-identical so
# renewals keep working. Login-protected synthetic demonstration only.
# The listen pair is the majority style on this host (quillmd.com, leathererp,
# staging): measured with nginx 1.24 in the real include order, it adds no
# "protocol options redefined" warning, where 'ssl http2' on both added two.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl;
    server_name @@DOMAIN@@;
    if ($host != @@DOMAIN@@) { return 444; }
    if ($ssl_server_name != @@DOMAIN@@) { return 444; }

    ssl_certificate /etc/letsencrypt/live/@@DOMAIN@@/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/@@DOMAIN@@/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /dev/null crit;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    client_max_body_size 20m;

    location / {
        proxy_pass http://@@UPSTREAM@@;
        proxy_http_version 1.1;
        proxy_set_header Host @@DOMAIN@@;
        proxy_set_header X-Forwarded-Proto https;
        # REPLACE, never append: this nginx is the edge, so $remote_addr is the client.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization "";
        proxy_set_header Connection "";
        # One copy of each policy header, from this edge.
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Robots-Tag;
        # The session cookie is HttpOnly. The CSRF cookie must stay readable by
        # the page script (it sends X-CSRFToken), so it gets Secure/SameSite only.
        proxy_cookie_flags cptstudio_session secure httponly samesite=strict;
        proxy_cookie_flags ~ secure samesite=strict;
        proxy_redirect off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
        error_page 502 504 =503 @cpt_unavailable;
    }
    location @cpt_unavailable {
        default_type text/plain;
        return 503 "CPT Studio is temporarily unavailable.\n";
    }
}
