# Preserved QuillMD infrastructure and marketing only.
# The fresh doctor/admin preview runs separately on localhost 9130/9131.
# Run live compose commands from /opt/meddoc-pro: the Caddyfile bind is relative.
# Do not use --remove-orphans, down -v, or global prune for this shared stack.
# Legacy/mixed volume declarations remain pending narrower ownership decisions.
# No old application image, worker, migration, QA, or backup scheduler is started.
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    user: 999:999
    cap_drop:
    - ALL
    mem_limit: 512m
    cpus: '1.0'
    environment:
      POSTGRES_DB: meddoc
      POSTGRES_USER: meddoc
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme_in_production}
      PGDATA: /var/lib/postgresql/data
    volumes:
    - pgdata_encrypted:/var/lib/postgresql/data
    ports:
    - 127.0.0.1:5432:5432
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U meddoc
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    user: 999:999
    cap_drop:
    - ALL
    command:
    - redis-server
    - --appendonly
    - 'yes'
    - --appendfsync
    - everysec
    mem_limit: 128m
    cpus: '0.5'
    volumes:
    - redis_data:/data
    ports:
    - 127.0.0.1:6379:6379
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 3s
      retries: 5
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    user: 1000:1000
    cap_drop:
    - ALL
    mem_limit: 256m
    cpus: '0.5'
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    command:
    - server
    - /data
    - --console-address
    - :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-meddoc}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme_in_production}
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY}
    volumes:
    - minio_data:/data
    ports:
    - 127.0.0.1:9000:9000
    - 127.0.0.1:9001:9001
    healthcheck:
      test:
      - CMD
      - curl
      - -sf
      - http://localhost:9000/minio/health/live
      interval: 10s
      timeout: 5s
      retries: 5
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    user: 1000:1000
    cap_add:
    - NET_BIND_SERVICE
    cap_drop:
    - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    mem_limit: 128m
    cpus: '0.5'
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - --spider
      - http://127.0.0.1:2019/config/
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
    - marketing
    ports:
    - 127.0.0.1:8443:443
    volumes:
    - ./Caddyfile:/etc/caddy/Caddyfile:ro
    - caddy_data:/data
    - caddy_config:/config
  marketing:
    cap_drop:
    - ALL
    build:
      context: .
      dockerfile: apps/marketing/Dockerfile
      args:
        NEXT_PUBLIC_TRANSCRIBE_MD_APP_URL: ${TRANSCRIBE_MD_AUTH_URL:-http://5.231.107.93:9020}
        NEXT_PUBLIC_MARKETING_URL: ${MARKETING_URL:-http://5.231.107.93:9010}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    mem_limit: 256m
    cpus: '0.5'
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - --spider
      - http://127.0.0.1:3010/
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: '1'
    ports:
    - 127.0.0.1:3010:3010
volumes:
  pgdata_encrypted:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/pgdata-encrypted/pgdata
  pgdata: null
  pgbackups: null
  redis_data: null
  minio_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/miniodata-encrypted/data
  caddy_data: null
  caddy_config: null
networks:
  default: null
  converter:
    internal: true
