# ============================================================================
# MedDoc Pro — Docker Compose (App + Postgres + Caddy)
# ============================================================================
# Usage:
#   docker compose up -d --build    (first deploy or after code changes)
#   docker compose logs -f app      (view app logs)
#   docker compose logs -f caddy    (view proxy/access logs)
#   docker compose down              (stop everything)
#
# Public entry:     Caddy on :80 (add :443 + domain later for auto-TLS)
# Dev direct entry: http://127.0.0.1:3001 → app (bypasses the proxy, so
#                   requests from localhost will NOT carry X-Forwarded-For
#                   and the admin UI will show "--" for the IP. Expected.)

services:
  # ── PostgreSQL Database ──
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: meddoc
      POSTGRES_USER: meddoc
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme_in_production}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"   # only accessible from localhost
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meddoc"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Next.js App (MedDoc Pro) ──
  meddoc-pro:
    build:
      context: .
      dockerfile: apps/meddoc-pro/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://meddoc:${DB_PASSWORD:-changeme_in_production}@postgres:5432/meddoc?schema=public
      # Canonical external URL NextAuth uses to build callbacks. Override
      # via PUBLIC_URL in .env once you move to a real domain (e.g.,
      # https://meddoc.example.com). Must match exactly what users see in
      # the browser — if they hit http://1.2.3.4 but AUTH_URL says
      # https://meddoc.example.com, the auth callback mismatches.
      AUTH_URL: ${PUBLIC_URL:-http://5.231.107.93}
      NEXTAUTH_URL: ${PUBLIC_URL:-http://5.231.107.93}  # v4 compat name
      AUTH_TRUST_HOST: "true"  # redundant (also hardcoded in auth.config.ts) — safe belt-and-braces
    ports:
      # Bound to loopback only — public traffic goes through Caddy. Kept
      # for dev debugging (e.g., curl http://127.0.0.1:3001 from the host).
      - "127.0.0.1:3001:3000"

  # ── Redis (BullMQ broker + ephemeral state) ──
  # Introduced in M2 for the batch pipeline. Internal-only — bound to
  # loopback for ops visibility, but apps reach it via the compose
  # network name `redis`.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── MinIO (S3-compatible object storage for audio) ──
  # Browsers upload audio directly here via presigned PUT URLs (spec §10).
  # The worker downloads by object key. Data lives in a docker volume —
  # production must enable SSE-S3 + verify disk-level encryption (M7).
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-meddoc}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme_in_production}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"  # S3 API
      - "127.0.0.1:9001:9001"  # Web console
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Caddy Reverse Proxy ──
  # Terminates inbound HTTP/HTTPS and forwards to `app:3000` on the
  # internal Docker network, setting X-Forwarded-For / X-Real-IP so the
  # app sees the real client IP.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - meddoc-pro
      - marketing
      - transcribe-md
    ports:
      - "80:80"
      - "443:443"
      # T-M1: public entry for TranscribeMD marketing site. 9001 was
      # already claimed by MinIO's web console (see minio service), so
      # marketing lives on 9010 until DNS + TLS are configured.
      - "9010:9010"
      # T-M2: the TranscribeMD solo app itself. Doctors sign up + work here.
      - "9020:9020"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # persistent Let's Encrypt certs (when TLS on)
      - caddy_config:/config   # Caddy's internal config cache

  # ── TranscribeMD Marketing (T-M1) ──
  # Static Next.js landing site for the new standalone product. No DB,
  # no shared packages beyond what the Dockerfile already pulls. Caddy
  # proxies :9010 → marketing:3010.
  marketing:
    build:
      context: .
      dockerfile: apps/marketing/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      # Loopback only — all public traffic goes through Caddy on :9010.
      - "127.0.0.1:3010:3010"

  # ── TranscribeMD worker (T-M4 — BullMQ consumer) ──
  # Runs the 6-layer audio → SOAP pipeline (Deepgram → speaker roles →
  # entities → SOAP draft → self-critique → polish). Separate image
  # from the web container; same monorepo source, different Dockerfile.
  # No ffmpeg: Deepgram batch handles 10h files natively so we skip
  # the chunking step scribe-worker needs.
  transcribe-md-worker:
    build:
      context: .
      dockerfile: apps/transcribe-md/Dockerfile.worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://meddoc:${DB_PASSWORD:-changeme_in_production}@postgres:5432/meddoc?schema=public
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-meddoc}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-changeme_in_production}
      TRANSCRIBE_MD_MINIO_BUCKET: ${TRANSCRIBE_MD_MINIO_BUCKET:-transcribe-md-audio}
      MINIO_USE_SSL: "false"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY}
      DEEPGRAM_MODEL: ${DEEPGRAM_MODEL:-nova-3-medical}
      # Per-call pricing rate cards (cents per million tokens / per min).
      # See packages/ai/src/pricing.ts for defaults.
      CLAUDE_SONNET_46_INPUT_CENTS_PER_M: ${CLAUDE_SONNET_46_INPUT_CENTS_PER_M:-300}
      CLAUDE_SONNET_46_OUTPUT_CENTS_PER_M: ${CLAUDE_SONNET_46_OUTPUT_CENTS_PER_M:-1500}
      DEEPGRAM_COST_PER_MIN_CENTS: ${DEEPGRAM_COST_PER_MIN_CENTS:-1.45}
      TRANSCRIBE_MD_WORKER_CONCURRENCY: ${TRANSCRIBE_MD_WORKER_CONCURRENCY:-2}

  # ── TranscribeMD Solo App (T-M2) ──
  # The real product surface — sign up, log in, create visits. Shares
  # Postgres with meddoc-pro + scribe (same User/Practice tables via
  # @meddoc/db). Redis is a dependency so BullMQ-based features in later
  # milestones have somewhere to enqueue work; today's shell doesn't use
  # it at runtime but we wire it now to avoid a compose edit later.
  transcribe-md:
    build:
      context: .
      dockerfile: apps/transcribe-md/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://meddoc:${DB_PASSWORD:-changeme_in_production}@postgres:5432/meddoc?schema=public
      AUTH_URL: ${TRANSCRIBE_MD_AUTH_URL:-http://5.231.107.93:9020}
      NEXTAUTH_URL: ${TRANSCRIBE_MD_AUTH_URL:-http://5.231.107.93:9020}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
      AUTH_TRUST_HOST: "true"
      NEXT_PUBLIC_TRANSCRIBE_MD_APP_URL: ${TRANSCRIBE_MD_AUTH_URL:-http://5.231.107.93:9020}
      NEXT_PUBLIC_MARKETING_URL: ${MARKETING_URL:-http://5.231.107.93:9010}
      # T-M4 — web container enqueues jobs + stores uploaded audio.
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-meddoc}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-changeme_in_production}
      TRANSCRIBE_MD_MINIO_BUCKET: ${TRANSCRIBE_MD_MINIO_BUCKET:-transcribe-md-audio}
      MINIO_USE_SSL: "false"
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      # Loopback only — public traffic arrives via Caddy on :9020.
      - "127.0.0.1:3011:3011"

  # ── DB Migrator (one-shot) ──
  # Targets the transcribe-md builder stage because it already runs
  # `npm ci` + `npm run db:generate` and has the full Prisma CLI
  # toolchain (prisma, @prisma/config, effect, c12, jiti …). Shipping
  # those into runtime app images adds ~75MB of dead weight — here we
  # reuse what's already built.
  #
  # Profile-gated so `docker compose up` ignores it. Invoke with:
  #   docker compose run --rm db-migrate
  # which defaults to `migrate deploy`. Override to peek:
  #   docker compose run --rm db-migrate npx prisma migrate status
  db-migrate:
    build:
      context: .
      dockerfile: apps/transcribe-md/Dockerfile
      target: builder
    profiles: ["migrations"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://meddoc:${DB_PASSWORD:-changeme_in_production}@postgres:5432/meddoc?schema=public
    working_dir: /app/packages/db
    entrypoint: ["npx", "--no-install", "prisma"]
    command: ["migrate", "deploy"]

volumes:
  pgdata:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:
