# QuillMD host-nginx vhost — VERSION-CONTROLLED SNAPSHOT (captured 2026-06-08)
# ============================================================================
# This is a snapshot of the LIVE host-level nginx vhost at
#   /etc/nginx/sites-available/quillmd   (symlinked into sites-enabled/)
# captured so the public ingress config is tracked in-repo.
#
# The host nginx is NOT managed by docker-compose. It is the shared host-level
# ingress that owns :80/:443 on this multi-tenant box (co-tenants: leathererp,
# dealmason, dealhunter). QuillMD's Caddy is demoted to a 127.0.0.1:8443
# upstream — see the `ports` note on the caddy service in docker-compose.yml.
# Flow: CloudFlare (grey-cloud) → host nginx (LE TLS) → 127.0.0.1:8443 Caddy
# (per-host routing + MODE B security headers) → app containers.
#
# THIS FILE IS DOCUMENTATION / VERSION-CONTROL ONLY. Editing it does NOT change
# the running host nginx. To apply real changes, edit the host file and run
#   nginx -t && systemctl reload nginx
# on the VPS, then re-snapshot here to keep the repo copy in sync.
# ============================================================================

map $http_upgrade $connection_upgrade_qmd {
    default upgrade;
    ''      close;
}

# Bearer-link credentials must never enter the host ingress log. `$uri`
# records the normalized path only; unlike `$request`/`$request_uri`, it omits
# the query string. Referer is deliberately absent from this format as well.
log_format quillmd_no_query
    '$remote_addr - $remote_user [$time_local] '
    '"$request_method $uri $server_protocol" $status $body_bytes_sent '
    '"$http_user_agent"';

server {
    listen 80;
    listen [::]:80;
    server_name quillmd.com www.quillmd.com app.quillmd.com admin.quillmd.com pro.quillmd.com;
    access_log /var/log/nginx/quillmd_access.log quillmd_no_query;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl;
    server_name quillmd.com www.quillmd.com app.quillmd.com admin.quillmd.com pro.quillmd.com;
    access_log /var/log/nginx/quillmd_access.log quillmd_no_query;

    ssl_certificate     /etc/letsencrypt/live/quillmd.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quillmd.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 200m;

    location / {
        proxy_pass            https://127.0.0.1:8443;
        proxy_ssl_server_name on;
        proxy_ssl_name        $host;
        proxy_ssl_verify      off;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        # This nginx is the public trust boundary. Replace, rather than
        # append to, caller-supplied forwarding headers before the loopback
        # Caddy hop; Caddy then validates the right-to-left trusted chain.
        proxy_set_header      X-Forwarded-For   $remote_addr;
        proxy_set_header      X-Forwarded-Proto https;
        proxy_set_header      Upgrade           $http_upgrade;
        proxy_set_header      Connection        $connection_upgrade_qmd;
        proxy_read_timeout    300s;
    }
}
