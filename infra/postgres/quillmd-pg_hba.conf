# QuillMD PostgreSQL 16 host-authentication contract.
#
# The Unix socket exists only inside the PostgreSQL container and remains
# available to the target-bound bootstrap, migration, recovery, and health
# operators. Every TCP client, including loopback, must authenticate with a
# SCRAM verifier and one of the seven reviewed TCP login identities.
# Replication connections are not part of this release and fail closed before
# any broader database rule is considered. Unknown TCP identities also fail
# closed for both address families.
local replication all reject
host replication all all reject
local all all trust
host all meddoc,meddoc_runtime,meddoc_release_control,meddoc_release_security,meddoc_audit_dispatcher,meddoc_auth_email_dispatcher,meddoc_backup all scram-sha-256
host all all 0.0.0.0/0 reject
host all all ::0/0 reject
