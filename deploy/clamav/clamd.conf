# QuillMD Template Twin clamd profile.
# Network listeners are intentionally absent: the only admission path is the
# Unix socket mounted into the transcribe-md web container.
LogTime yes
PidFile /run/clamav/clamd.pid
TemporaryDirectory /tmp
DatabaseDirectory /var/lib/clamav
OfficialDatabaseOnly yes
FailIfCvdOlderThan 2

LocalSocket /run/clamav/clamd.sock
LocalSocketGroup clamav
LocalSocketMode 660
FixStaleSocket yes

MaxConnectionQueueLength 8
StreamMaxLength 12M
MaxThreads 2
MaxQueue 8
ReadTimeout 35
CommandReadTimeout 5
SendBufTimeout 200
IdleTimeout 30
SelfCheck 300
ConcurrentDatabaseReload no
ExitOnOOM yes
User clamav
Foreground yes

# The HTTP admission boundary is 10 MiB. Archive expansion, recursion, file
# count, and scan time are separately bounded so a compressed DOCX cannot turn
# into unbounded scanner work. AlertExceedsMax makes a limit breach fail closed
# as a scanner finding instead of returning a clean receipt.
MaxScanTime 120000
MaxScanSize 64M
MaxFileSize 12M
MaxRecursion 12
MaxFiles 1000
MaxEmbeddedPE 10M
MaxHTMLNormalize 10M
MaxHTMLNoTags 5M
MaxScriptNormalize 5M
MaxZipTypeRcg 1M
MaxPartitions 16
MaxIconsPE 50
MaxRecHWP3 8
PCREMatchLimit 100000
PCRERecMatchLimit 2000
PCREMaxFileSize 10M

ScanArchive yes
ScanPE yes
ScanELF yes
ScanOLE2 yes
ScanPDF yes
ScanSWF yes
ScanXMLDOCS yes
ScanHWP3 yes
ScanHTML yes
ScanMail no
ScanOneNote yes
AlertExceedsMax yes
AlertEncryptedArchive yes
AlertEncryptedDoc yes
AlertOLE2Macros yes
