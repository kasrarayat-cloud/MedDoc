# Persistent official signature updates for the private Template Twin scanner.
DatabaseDirectory /var/lib/clamav
DatabaseOwner clamav
DatabaseMirror database.clamav.net
ScriptedUpdates yes
Checks 24
MaxAttempts 3
ConnectTimeout 15
ReceiveTimeout 60
TestDatabases yes
Bytecode yes
NotifyClamd /etc/clamav/clamd.conf
