name: nightly-tests

# Runs once a day against the live production surfaces. Uploads the
# generated HTML report as an artefact so you can download it from the
# workflow run, and opens a GitHub issue whenever any test fails so
# nothing drops on the floor when you're not watching.
#
# Manual trigger is supported via workflow_dispatch — useful right
# after a deploy when you want the full nightly assurance early.

on:
  schedule:
    - cron: '0 2 * * *'        # 02:00 UTC daily
  workflow_dispatch:

concurrency:
  group: nightly-tests
  cancel-in-progress: false

# ⚠️ WITHOUT THIS BLOCK THE FAILURE NOTIFICATION SILENTLY DOES NOTHING.
# The "Open issue on failure" step below calls issues.create, and the default
# GITHUB_TOKEN is read-only for issues, so it died with
# `HttpError: Resource not accessible by integration` — observed on run
# 30876327406. The job still failed, so the RED was real; but the mechanism
# meant to carry that red to a human was itself broken, which is the worse
# half: a nightly nobody is told about is a nightly nobody reads.
permissions:
  contents: read
  issues: write

# ⚠️ REGISTRY-BLIP RETRY BUDGET — npm defaults to 2 retries / 60s ceiling.
# On 2026-08-10 three independent builds on three branches died inside twelve
# minutes on `npm error code ECONNRESET` during `npm ci`, after 18 of 18 green
# e2e runs. Zero test failures — nothing ever installed. Declared at WORKFLOW
# level so every job and every future npm invocation inherits it, rather than as
# flags on each command, which is a hand-kept list.
env:
  NPM_CONFIG_FETCH_RETRIES: "5"
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "20000"
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "120000"

jobs:
  run:
    name: smoke + e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install workspace deps (transcribe-md + its playwright)
        run: |
          cd apps/transcribe-md
          npm ci --no-audit --no-fund

      # ── #739 — the FOURTH install site, and the one the issue's own workflow
      # table does not list. #739 enumerates `CI`, `a11y-ci` and `e2e` as "all
      # three required workflows"; that is true about REQUIRED checks and
      # incomplete about install sites. This job runs the identical command on
      # a 30-minute budget with no cache, so a ~19-minute stall here fails the
      # nightly and auto-files an issue whose cause is invisible in the log.
      # Same split and same cache as `test.yml` — see the long note there.
      - name: Resolve Playwright version (for cache key)
        id: pw-version
        run: |
          ver=$(node -p "require('./apps/transcribe-md/package.json').devDependencies['@playwright/test']")
          echo "version=${ver}" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}
          restore-keys: |
            playwright-${{ runner.os }}-

      # #739 — bound apt's own network waits; see the measurement in `test.yml`.
      - name: Bound apt's network waits (#739)
        run: |
          printf 'Acquire::http::Timeout "20";\nAcquire::https::Timeout "20";\nAcquire::Retries "3";\n' \
            | sudo tee /etc/apt/apt.conf.d/99-quillmd-timeouts > /dev/null
          # Proves its own application: apt parses apt.conf.d at STARTUP, so a
          # malformed drop-in fails here rather than being silently ignored.
          sudo apt-get --version > /dev/null

      - name: Install Playwright system deps (apt half of --with-deps)
        timeout-minutes: 5
        run: cd apps/transcribe-md && npx playwright install-deps chromium

      - name: Install Playwright Chromium (browser half of --with-deps)
        timeout-minutes: 5
        run: cd apps/transcribe-md && npx playwright install chromium

      - name: Seed .env.test from secrets
        # Secrets live in the repository settings. Missing secrets just
        # mean specs that depend on them skip — tests don't hard-fail.
        env:
          TEST_APP_EMAIL:    ${{ secrets.TEST_APP_EMAIL }}
          TEST_APP_PASSWORD: ${{ secrets.TEST_APP_PASSWORD }}
          TEST_PRO_EMAIL:    ${{ secrets.TEST_PRO_EMAIL }}
          TEST_PRO_PASSWORD: ${{ secrets.TEST_PRO_PASSWORD }}
        run: |
          cat > tests/automated/.env.test <<EOF
          TEST_MARKETING_URL=https://quillmd.com
          TEST_APP_URL=https://app.quillmd.com
          TEST_PRO_URL=https://pro.quillmd.com
          TEST_APP_EMAIL=${TEST_APP_EMAIL}
          TEST_APP_PASSWORD=${TEST_APP_PASSWORD}
          TEST_PRO_EMAIL=${TEST_PRO_EMAIL}
          TEST_PRO_PASSWORD=${TEST_PRO_PASSWORD}
          E2E_READ_ONLY=true
          EOF

      - name: Run smoke + e2e
        id: run
        run: bash tests/automated/run-all.sh --smoke --e2e
        continue-on-error: true

      # The chat editor's intelligence bar, against the REAL model.
      #
      # Nightly rather than per-PR on purpose: it makes paid model calls, and a
      # required check that costs money per push is a check people learn to
      # route around. The scripted subset is ~8 cases — the writes that had no
      # tool before, the multi-step case, and every hard refusal — so a
      # regression in what the chat will actually DO surfaces within a day.
      #
      # Skips cleanly when the key is absent (forks, and any run where the
      # secret was not provisioned) rather than failing on infrastructure.
      - name: Chat-editor eval (scripted subset)
        id: chateval
        if: env.ANTHROPIC_API_KEY != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: cd apps/transcribe-md && npm run eval:chat-editor:ci
        continue-on-error: true

      - name: Upload report artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meddoc-report-${{ github.run_id }}
          path: tests/automated/reports/
          retention-days: 14

      - name: Open issue on failure
        if: steps.run.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Nightly tests failed — ${new Date().toISOString().slice(0,10)}`,
              body: [
                'The nightly test suite reported failures.',
                '',
                `Run: ${runUrl}`,
                '',
                'The HTML report is attached to this run as an artefact.',
                'Download \`meddoc-report-${{ github.run_id }}\` and open',
                'the \`*.html\` file in the archive for per-test details.',
              ].join('\n'),
              labels: ['nightly-tests', 'failure'],
            });

      - name: Fail the job if any suite failed
        if: steps.run.outcome == 'failure'
        run: exit 1
