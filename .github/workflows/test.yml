name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fresh-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Fresh application tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: quillmd_ci
          POSTGRES_PASSWORD: synthetic-ci-database-only
          POSTGRES_DB: quillmd_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quillmd_ci -d quillmd_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      QUILLMD_SECRET_KEY: synthetic-ci-only-key-with-no-external-access-20260917
      QUILLMD_DB_NAME: quillmd_ci
      QUILLMD_DB_USER: quillmd_ci
      QUILLMD_DB_PASSWORD: synthetic-ci-database-only
      QUILLMD_DB_HOST: 127.0.0.1
      QUILLMD_DB_PORT: '5432'
      QUILLMD_AI_MODE: fixture
      QUILLMD_ADMIN_SITE: '0'
      QUILLMD_HTTPS: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: rebuild/requirements.txt
      - name: Install locked Python dependencies
        run: python -m pip install -r rebuild/requirements.txt
      # ffprobe measures the payload actually submitted to the transcription provider. Without it the
      # application degrades to 'coverage UNKNOWN' on every recording — honest, but it means CI would
      # exercise the DEGRADED path and never the real one, which is how a clinical disclosure rule
      # goes untested. The production host has it; CI must too, or the suite proves the wrong thing.
      - name: Install the media probe the submission check depends on
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: rebuild/documents/sdk_word/global.json
      - name: Build locked and pinned Word helper
        run: bash scripts/ci/prepare-word.sh
      - name: Verify kernel sandbox library
        run: ldconfig -p | grep 'libseccomp.so.2'
      - name: Fresh application, document and operations tests
        run: bash scripts/ci/verify-fresh.sh python
      - name: Actual Word adapter and kernel qualification
        working-directory: rebuild
        run: |
          python documents/sdk_word/verify_adapter_v2.py --original '../WM IOV Template.docx' --runtime "$QUILLMD_WORD_RUNTIME" --manifest "$QUILLMD_WORD_MANIFEST" --manifest-sha "$QUILLMD_WORD_MANIFEST_SHA256" --output .runtime/word-qualification
      - name: Python dependency audit
        run: python -m pip_audit -r rebuild/requirements.txt

  marketing:
    name: Marketing build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_TRANSCRIBE_MD_APP_URL: https://app.quillmd.com
      NEXT_PUBLIC_MARKETING_URL: https://quillmd.com
      NPM_CONFIG_FETCH_RETRIES: '5'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked marketing dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Marketing build and dependency audit
        run: bash scripts/ci/verify-fresh.sh marketing

  private-browser:
    name: Private browser and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: quillmd_browser_ci
          POSTGRES_PASSWORD: synthetic-browser-database-only
          POSTGRES_DB: quillmd_browser_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quillmd_browser_ci -d quillmd_browser_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      QUILLMD_SECRET_KEY: synthetic-browser-ci-only-key-no-external-access-20260917
      QUILLMD_DB_NAME: quillmd_browser_ci
      QUILLMD_DB_USER: quillmd_browser_ci
      QUILLMD_DB_PASSWORD: synthetic-browser-database-only
      QUILLMD_DB_HOST: 127.0.0.1
      QUILLMD_DB_PORT: '5432'
      QUILLMD_AI_MODE: fixture
      QUILLMD_ADMIN_SITE: '0'
      QUILLMD_HTTPS: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: rebuild/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked browser and application dependencies
        run: |
          python -m pip install -r rebuild/requirements.txt
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: rebuild/documents/sdk_word/global.json
      - name: Build locked and pinned Word helper
        run: bash scripts/ci/prepare-word.sh
      - name: Verify kernel sandbox library
        run: ldconfig -p | grep 'libseccomp.so.2'
      - name: Seed isolated synthetic database and collect assets
        working-directory: rebuild
        run: |
          python manage.py migrate --noinput
          python manage.py collectstatic --noinput
          python manage.py seed_private
      - name: Exercise private workflow and accessibility
        working-directory: rebuild
        run: |
          gunicorn quillmd.wsgi:application --bind 127.0.0.1:9130 --workers 1 --timeout 60 > .runtime/browser-server.log 2>&1 &
          browser_server_pid=$!
          python manage.py worker > .runtime/browser-worker.log 2>&1 &
          browser_worker_pid=$!
          trap 'kill "$browser_server_pid" "$browser_worker_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9130/health/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:9130/health/ > /dev/null
          node browser-tests.mjs
          python prepare-wm-browser.py
          node wm-browser-tests.mjs
      - name: Upload synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-browser-evidence
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: true
          path: |
            rebuild/.runtime/browser-artifacts/report.json
            rebuild/.runtime/wm-browser-artifacts/report.json
