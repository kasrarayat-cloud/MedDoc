# Secrets-scan CI guard — Round 3 PR-A
#
# Closes Round 3 audit P2-003 ("no secret scanner in pre-commit or CI") and
# prevents regression on findings A01-P0-001..003 + A02-P0-002 + A07-P3-001.
#
# TruffleHog --only-verified means the gate only fires on credentials that
# the scanner has live-validated against the issuing vendor — eliminates the
# false-positive rate that would push engineers to bypass the check.
#
# We rely on the trufflesecurity/trufflehog GitHub Action's default behaviour:
#   - on pull_request: scan the diff between PR base and PR head
#   - on push to main: scan the push delta (github.event.before → after)
# This is intentionally diff-only — we are NOT scanning the full repo history,
# because the leaked keys documented in audit findings A01-P0-001..003 already
# exist in older commits that are intentionally not being rewritten (rotated
# at vendor instead, per Round 3 PR-A. Old values in history are now dead
# values per LAUNCH_CHECKLIST §6).

name: secrets-scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trufflehog-diff:
    name: TruffleHog (verified-only, diff-scan)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified
