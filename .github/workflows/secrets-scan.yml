# Secrets-scan CI guard — Round 3 PR-A
#
# Closes Round 3 audit P2-003 ("no secret scanner in pre-commit or CI") and
# prevents regression on findings A01-P0-001..003 + A02-P0-002 + A07-P3-001.
#
# TruffleHog --only-verified means the gate only fires on credentials that
# the scanner has live-validated against the issuing vendor — eliminates the
# false-positive rate that would push engineers to bypass the check.
#
# We rely on the trufflesecurity/trufflehog GitHub Action's default behaviour:
#   - on pull_request: scan the diff between PR base and PR head
#   - on push to main: scan the push delta (github.event.before → after)
# This is intentionally diff-only — we are NOT scanning the full repo history,
# because the leaked keys documented in audit findings A01-P0-001..003 already
# exist in older commits that are intentionally not being rewritten (rotated
# at vendor instead, per Round 3 PR-A. Old values in history are now dead
# values per LAUNCH_CHECKLIST §6).

name: secrets-scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trufflehog-diff:
    name: TruffleHog (verified-only, diff-scan)
    # ⚠️ SELF-HOSTED — FIRST MIGRATION, CHOSEN BY BLAST RADIUS NOT BY SAVINGS.
    #
    # This job is the cheapest thing that can fail: one job, no service
    # containers, no image builds, ~1.0 billable minute. If `runs-on:
    # self-hosted` misbehaves at all, it surfaces here rather than inside the
    # 41-minute e2e.
    #
    # ⚠️ AND IT IS A REQUIRED CONTEXT, SO THE AVAILABILITY RISK IS REAL: if the
    # runner is offline this job never starts, the check-run never registers,
    # and EVERY PR blocks — the same "expected forever" trap that rules out
    # path filters on required checks. That is why the revert is one line, and
    # why the runner is a systemd service with Restart=always.
    #
    #   REVERT: change this back to `ubuntu-latest`. Nothing else depends on it.
    #   RUNNER: quillmd-ci-1 · 4 vCPU / 8 GB · Docker 29.7.2 (TruffleHog is a
    #           docker-based action and was smoke-tested on the box first).
    runs-on: [self-hosted, linux, x64, quillmd-ci]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified
