# ============================================================================
# CI — Playwright E2E gate for the transcribe-md app (Phase 1)
# ----------------------------------------------------------------------------
# Builds the REAL app + worker + db-migrate images from the PR code, brings up
# an EPHEMERAL non-prod stack (the committed docker-compose.qa.yml: own
# postgres/redis/minio, MOCK_AI_CALLS=true, dummy keys, :9020), migrates +
# guard-seeds the throwaway `meddoc_qa_test` DB, then runs the Playwright
# chromium suite headless against :9020. Fails the check if any spec fails;
# uploads the HTML report + traces for debugging.
#
# This is ADDITIVE to the existing checks (CI unit / npm audit / axe-core /
# TruffleHog). It never touches the prod stack — the images are built fresh in
# the runner and torn down with `down -v` at the end.
#
# Faithfulness: builds the same Dockerfiles prod ships (the app build runs the
# bundle-assert + 6 GB builder heap), and runs the real BullMQ worker pipeline
# under MOCK — so a build/bundle regression (the PDF-incident class) or a
# broken visit→SOAP→sign path fails the gate.
# ============================================================================

name: e2e

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege: the job only checks out, builds images, and uploads artifacts.
permissions:
  contents: read

jobs:
  e2e:
    name: Playwright E2E (transcribe-md)
    runs-on: ubuntu-latest
    # Five health-gated immutable runtime transitions now accompany the real
    # worker renders and pinned Open XML validation. This bounded watchdog
    # cushion does not weaken any per-step gate or turn a failure into a pass.
    timeout-minutes: 75

    env:
      # Build args: point the client bundle + auth URL at the CI app (:9020)
      # instead of the prod IP defaults baked into docker-compose.yml.
      TRANSCRIBE_MD_AUTH_URL: http://localhost:9020
      MARKETING_URL: http://localhost:9010
      DOCKER_BUILDKIT: "1"
      # Bind every build and synthetic evidence artifact to the authored PR
      # head (or the exact main-push commit), never the ephemeral merge ref.
      QUILLMD_RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      # NOTE: the build steps pass `-p meddoc-pro` so the built images are named
      # `meddoc-pro-transcribe-md{,-worker,-db-migrate}` (the prod compose has no
      # `name:`, so the project would otherwise default to the checkout dir).
      # That is build-scoped on purpose — the qa stack keeps its own
      # `name: meddoc-qa` project (images are global, looked up by name).

    steps:
      # PR evidence must identify the exact authored commit, not GitHub's
      # ephemeral pull_request merge ref. Main pushes retain github.sha.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify authored checkout identity
        shell: bash
        env:
          EXPECTED_RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_RELEASE_SHA" ]]
          [[ "$QUILLMD_RELEASE_SHA" == "$EXPECTED_RELEASE_SHA" ]]

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The app intentionally runs with NODE_ENV=production in the synthetic
      # QA stack, so it enforces the same external keyring ownership/mode as
      # production. Generate a job-scoped random key outside the checkout;
      # never print or persist the bytes in an artifact. The non-QA names are
      # also exported because the production compose file is parsed while
      # building the exact application image.
      - name: Provision ephemeral synthetic MFA keyring
        shell: bash
        run: |
          set -euo pipefail
          set +x
          umask 077
          keyring_dir="$RUNNER_TEMP/quillmd-ci-mfa"
          keyring_path="$keyring_dir/keyring.json"
          install -d -m 0700 "$keyring_dir"
          KEYRING_PATH="$keyring_path" node <<'NODE'
          const { randomBytes } = require("node:crypto");
          const { writeFileSync, writeSync } = require("node:fs");
          const destination = process.env.KEYRING_PATH;
          if (!destination) process.exit(1);
          const keyBase64Url = randomBytes(32).toString("base64url");
          const maskedSecrets = new Set();
          const maskSecret = (name, value) => {
            if (typeof value !== "string" || value.length === 0 || /[\r\n]/u.test(value)) {
              throw new Error(`${name} must be a non-empty single-line value`);
            }
            if (maskedSecrets.has(value)) return;
            const command = `::add-mask::${value}\n`;
            if (writeSync(1, command) !== Buffer.byteLength(command)) {
              throw new Error("MFA mask command write failed");
            }
            maskedSecrets.add(value);
          };
          maskSecret("MFA key", keyBase64Url);
          writeFileSync(
            destination,
            JSON.stringify({
              version: 1,
              keys: [{ id: "ci-synthetic-v1", keyBase64Url }],
            }),
            { mode: 0o600 },
          );
          NODE
          sudo chown root:1001 "$keyring_path"
          sudo chmod 0440 "$keyring_path"
          printf 'QA_MFA_SECRET_ACTIVE_KEY_ID=ci-synthetic-v1\n' >> "$GITHUB_ENV"
          printf 'QA_MFA_SECRET_KEYRING_FILE=%s\n' "$keyring_path" >> "$GITHUB_ENV"
          printf 'MFA_SECRET_ACTIVE_KEY_ID=ci-synthetic-v1\n' >> "$GITHUB_ENV"
          printf 'MFA_SECRET_KEYRING_FILE=%s\n' "$keyring_path" >> "$GITHUB_ENV"

      # The exact principal bootstrap refuses defaults and short/fixed
      # passwords. Generate isolated job-only credentials before either
      # Compose file is parsed. Values are registered with the runner masking
      # channel before GITHUB_ENV or a read-only bootstrap file is written;
      # neither credential file is uploaded. The backup file is readable only
      # after exact-path bind mounting because the unprivileged PostgreSQL UID
      # cannot read a runner-owned 0600 bind source; the parent prevents host
      # traversal by every other non-root user.
      - name: Provision ephemeral synthetic database credentials
        shell: bash
        run: |
          set -euo pipefail
          set +x
          umask 077
          credential_dir="$RUNNER_TEMP/quillmd-ci-database"
          backup_path="$credential_dir/backup-password"
          install -d -m 0700 "$credential_dir"
          GITHUB_ENV_PATH="$GITHUB_ENV" BACKUP_PATH="$backup_path" node <<'NODE'
          const { randomBytes } = require("node:crypto");
          const { appendFileSync, writeFileSync, writeSync } = require("node:fs");
          const environmentPath = process.env.GITHUB_ENV_PATH;
          const backupPath = process.env.BACKUP_PATH;
          if (!environmentPath || !backupPath) process.exit(1);

          const secret = () => randomBytes(32).toString("base64url");
          const assertSafeValue = (name, value) => {
            if (typeof value !== "string" || value.length === 0 || /[\r\n]/u.test(value)) {
              throw new Error(`${name} must be a non-empty single-line value`);
            }
          };
          const qa = {
            runtime: secret(),
            releaseControl: secret(),
            releaseSecurity: secret(),
            auditDispatcher: secret(),
            authEmailDispatcher: secret(),
            backup: secret(),
          };
          const owner = secret();
          const minioRoot = secret();
          const minioKmsSecret = randomBytes(32).toString("hex");
          const minioKms = `ci-synthetic-key:${minioKmsSecret}`;

          const values = {
            QA_DB_RUNTIME_PASSWORD: qa.runtime,
            QA_DB_RELEASE_CONTROL_PASSWORD: qa.releaseControl,
            QA_DB_RELEASE_SECURITY_PASSWORD: qa.releaseSecurity,
            QA_DB_AUDIT_DISPATCHER_PASSWORD: qa.auditDispatcher,
            QA_DB_AUTH_EMAIL_DISPATCHER_PASSWORD: qa.authEmailDispatcher,
            QA_DB_BACKUP_PASSWORD_FILE: backupPath,
            DB_PASSWORD: owner,
            DB_RUNTIME_PASSWORD: qa.runtime,
            DB_RELEASE_CONTROL_PASSWORD: qa.releaseControl,
            DB_AUDIT_DISPATCHER_PASSWORD: qa.auditDispatcher,
            DB_AUTH_EMAIL_DISPATCHER_PASSWORD: qa.authEmailDispatcher,
            DB_BACKUP_PASSWORD_FILE: backupPath,
            MINIO_ROOT_PASSWORD: minioRoot,
            MINIO_KMS_SECRET_KEY: minioKms,
          };
          for (const [name, value] of Object.entries(values)) {
            assertSafeValue(name, value);
          }

          // Register every distinct generated value before the first file or
          // GITHUB_ENV write. Aliased runtime credentials are masked once.
          const maskedSecrets = new Set();
          const maskSecret = (name, value) => {
            assertSafeValue(name, value);
            if (maskedSecrets.has(value)) return;
            const command = `::add-mask::${value}\n`;
            if (writeSync(1, command) !== Buffer.byteLength(command)) {
              throw new Error("database mask command write failed");
            }
            maskedSecrets.add(value);
          };
          for (const [name, value] of Object.entries({
            ...qa,
            owner,
            minioRoot,
            minioKmsSecret,
            minioKms,
          })) {
            maskSecret(name, value);
          }

          writeFileSync(backupPath, qa.backup, { mode: 0o444 });
          appendFileSync(
            environmentPath,
            Object.entries(values)
              .map(([name, value]) => `${name}=${value}\n`)
              .join(""),
            { mode: 0o600 },
          );
          NODE
          chmod 0444 "$backup_path"

      # Build the repository-owned PostgreSQL image from this exact checkout.
      # Production Compose requires an immutable image ID even when only the
      # application targets are built, so resolve the single Compose-derived
      # local tag and export its exact sha256 ID before parsing that file.
      - name: Build and pin synthetic QA PostgreSQL image
        shell: bash
        run: |
          set -euo pipefail
          set +x
          docker compose -f docker-compose.qa.yml build postgres

          image_name_output="$(
            docker compose -f docker-compose.qa.yml config --images postgres
          )"
          mapfile -t image_names <<< "$image_name_output"
          [[ "${#image_names[@]}" -eq 1 ]]
          [[ -n "${image_names[0]}" && ! "${image_names[0]}" =~ [[:space:]] ]]

          image_id_output="$(
            docker image inspect --format '{{.Id}}' "${image_names[0]}"
          )"
          mapfile -t image_ids <<< "$image_id_output"
          [[ "${#image_ids[@]}" -eq 1 ]]
          [[ "${image_ids[0]}" =~ ^sha256:[a-f0-9]{64}$ ]]
          printf 'QUILLMD_POSTGRES_IMAGE=%s\n' "${image_ids[0]}" >> "$GITHUB_ENV"
          printf 'QA_POSTGRES_IMAGE=%s\n' "${image_ids[0]}" >> "$GITHUB_ENV"

      # ── Build the real images from the PR (app build = the OOM-sensitive
      #    step; the Dockerfile bakes --max-old-space-size=6144 + the
      #    unpdf/mammoth bundle-assert, both of which run here). The 16 GB
      #    GitHub runner absorbs the 6 GB build heap. ──
      # The E2E specs target the stable (pre-C3) UI contract. The prod
      # docker-compose pins NEXT_PUBLIC_SKIN_BETA=true (the C3 skin is the
      # live UI); pin it OFF here so the regression gate stays decoupled from
      # the deploy flag and its specs keep matching. (C3-flag-ON E2E coverage
      # is a tracked follow-up.)
      - name: Build app + worker images
        env:
          NEXT_PUBLIC_SKIN_BETA: "false"
        shell: bash
        run: |
          set -euo pipefail
          set +x
          docker compose -p meddoc-pro -f docker-compose.yml build transcribe-md transcribe-md-worker

      - name: Build db-migrate image (prisma CLI)
        shell: bash
        run: |
          set -euo pipefail
          set +x
          docker compose -p meddoc-pro -f docker-compose.yml --profile migrations build db-migrate

      # The QA Compose defaults are developer conveniences only. The hosted
      # runner is isolated and the immediately preceding exact-checkout builds
      # must create these three reviewed production tags. Resolve them directly
      # so this pinning step never depends on an uncommitted environment file.
      - name: Pin exact synthetic QA application images
        shell: bash
        run: |
          set -euo pipefail
          set +x

          pin_image() {
            local expected_image="$1"
            local environment_name="$2"
            local -a image_ids=()
            local image_id_output
            image_id_output="$(
              docker image inspect --format '{{.Id}}' "$expected_image"
            )"
            mapfile -t image_ids <<< "$image_id_output"
            [[ "${#image_ids[@]}" -eq 1 ]]
            [[ "${image_ids[0]}" =~ ^sha256:[a-f0-9]{64}$ ]]
            printf '%s=%s\n' "$environment_name" "${image_ids[0]}" >> "$GITHUB_ENV"
          }

          pin_image meddoc-pro-transcribe-md:latest QA_TRANSCRIBE_MD_IMAGE
          pin_image meddoc-pro-transcribe-md-worker:latest QA_TRANSCRIBE_MD_WORKER_IMAGE
          pin_image meddoc-pro-db-migrate QA_DB_MIGRATE_IMAGE

      # The app image deliberately runs uid 1001 with primary gid 65533. The
      # keyring stays root:1001/0440, so only the two reviewed MFA consumers
      # receive supplemental gid 1001 through Compose. Prove the exact image
      # can read the exact mounted file without emitting its bytes.
      - name: Verify app runtime can read the MFA keyring
        shell: bash
        run: |
          set -euo pipefail
          set +x
          [[ "$MFA_SECRET_KEYRING_FILE" == "$QA_MFA_SECRET_KEYRING_FILE" ]]
          [[ "$QA_TRANSCRIBE_MD_IMAGE" =~ ^sha256:[a-f0-9]{64}$ ]]
          docker run --rm -i \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --group-add 101 \
            --group-add 1001 \
            --mount "type=bind,src=$MFA_SECRET_KEYRING_FILE,dst=$MFA_SECRET_KEYRING_FILE,readonly" \
            --env MFA_SECRET_KEYRING_FILE \
            --entrypoint node \
            "$QA_TRANSCRIBE_MD_IMAGE" - <<'NODE'
          const { readFileSync, statSync } = require("node:fs");
          const path = process.env.MFA_SECRET_KEYRING_FILE;
          if (!path || process.getuid() !== 1001 || process.getgid() !== 65533) {
            throw new Error("MFA runtime identity mismatch");
          }
          const groups = [...new Set(process.getgroups())].sort((left, right) => left - right);
          const expectedGroups = [101, 1001, 65533];
          if (
            groups.length !== expectedGroups.length ||
            groups.some((group, index) => group !== expectedGroups[index])
          ) {
            throw new Error("MFA runtime supplemental group mismatch");
          }
          const stat = statSync(path);
          if (stat.uid !== 0 || stat.gid !== 1001 || (stat.mode & 0o777) !== 0o440) {
            throw new Error("MFA keyring ownership or mode mismatch");
          }
          const document = JSON.parse(readFileSync(path, "utf8"));
          if (document.version !== 1 || document.keys?.[0]?.id !== "ci-synthetic-v1") {
            throw new Error("MFA keyring structure mismatch");
          }
          NODE

      # ── Bring up the isolated qa stack from the committed recipe. ──
      - name: Start qa infra (postgres + redis + minio)
        run: docker compose -f docker-compose.qa.yml up -d --wait postgres redis minio

      # Prisma migrations are cumulative but this release contains two online
      # transition boundaries. The closed runner exposes only the four audited
      # cut points, verifies the official ledger prefix and binds each mutation
      # to this disposable target. A raw one-shot deploy is intentionally not
      # available through the Compose contract.
      - name: Apply lineage-expand migration segment
        shell: bash
        run: |
          set -euo pipefail
          status="$(docker compose -f docker-compose.qa.yml run --rm -T \
            db-migrate --phase status)"
          fingerprint="$(jq -er '
            select(.event == "status") |
            select(.appliedMigrations == 0) |
            .targetFingerprints["lineage-expand"]
          ' <<<"$status")"
          [[ "$fingerprint" =~ ^[a-f0-9]{64}$ ]]
          DATABASE_RELEASE_MIGRATION_APPROVED_TARGET_FINGERPRINT="$fingerprint" \
            docker compose -f docker-compose.qa.yml run --rm -T \
              -e DATABASE_RELEASE_MIGRATION_APPROVED_TARGET_FINGERPRINT \
              db-migrate --phase lineage-expand

      # Complete and prove the lineage transition before migration 69 can be
      # admitted. The second bounded backfill must be a zero-change no-op so
      # idempotent resume is evidenced, not merely assumed.
      - name: Contract NoteTemplate lineage in disposable QA
        shell: bash
        run: |
          set -euo pipefail
          lineage_status() {
            docker compose -f docker-compose.qa.yml run --rm -T \
              --entrypoint sh db-migrate -c \
              'npm run --silent lineage:online -w @meddoc/db -- --phase status'
          }
          lineage_fingerprint() {
            local status="$1"
            local phase="$2"
            local fingerprint
            fingerprint="$(jq -er --arg phase "$phase" \
              '.targetFingerprints[$phase]' <<<"$status")"
            [[ "$fingerprint" =~ ^[a-f0-9]{64}$ ]]
            printf '%s' "$fingerprint"
          }

          initial_status="$(lineage_status)"
          jq -e '
            .readOnly == true and
            .operationKey == "note_templates_lineage_v1" and
            .phase == "EXPANDED" and
            .presentIndexesExact == true and
            .validationConstraintExact == true and
            .transitionContractExact == true
          ' <<<"$initial_status" >/dev/null

          fingerprint="$(lineage_fingerprint "$initial_status" guard-index)"
          TEMPLATE_TWIN_LINEAGE_APPROVED_TARGET_FINGERPRINT="$fingerprint" \
            docker compose -f docker-compose.qa.yml run --rm -T \
              -e TEMPLATE_TWIN_LINEAGE_APPROVED_TARGET_FINGERPRINT \
              --entrypoint sh db-migrate -c \
              'npm run --silent lineage:online -w @meddoc/db -- --phase guard-index'

          status="$(lineage_status)"
          fingerprint="$(lineage_fingerprint "$status" backfill)"
          TEMPLATE_TWIN_LINEAGE_APPROVED_TARGET_FINGERPRINT="$fingerprint" \
            docker compose -f docker-compose.qa.yml run --rm -T \
              -e TEMPLATE_TWIN_LINEAGE_APPROVED_TARGET_FINGERPRINT \
              --entrypoint sh db-migrate -c \
              'npm run --silent lineage:online -w @meddoc/db -- --phase backfill --batch-size 1000 --batch-delay-ms 0'

          status="$(lineage_status)"
          fingerprint="$(lineage_fingerprint "$status" backfill)"
          no_op_backfill="$(
            TEMPLATE_TWIN_LINEAGE_APPROVED_TARGET_FINGERPRINT="$fingerprint" \
              docker compose -f docker-compose.qa.yml run --rm -T \
                -e TEMPLATE_TWIN_LINEAGE_APPROVED_TARGET_FINGERPRINT \
                --entrypoint sh db-migrate -c \
                'npm run --silent lineage:online -w @meddoc/db -- --phase backfill --batch-size 1000 --batch-delay-ms 0'
          )"
          jq -se '
            [ .[] | select(.event == "batch") ] as $batches |
            $batches | length == 1 and
            .[0].phase == "BACKFILLED" and
            .[0].batchRows == 0 and
            .[0].complete == true and
            .[0].cursorRestarted == false
          ' <<<"$no_op_backfill" >/dev/null

          status="$(lineage_status)"
          fingerprint="$(lineage_fingerprint "$status" indexes)"
          TEMPLATE_TWIN_LINEAGE_APPROVED_TARGET_FINGERPRINT="$fingerprint" \
            docker compose -f docker-compose.qa.yml run --rm -T \
              -e TEMPLATE_TWIN_LINEAGE_APPROVED_TARGET_FINGERPRINT \
              --entrypoint sh db-migrate -c \
              'npm run --silent lineage:online -w @meddoc/db -- --phase indexes'

          status="$(lineage_status)"
          fingerprint="$(lineage_fingerprint "$status" validate)"
          TEMPLATE_TWIN_LINEAGE_APPROVED_TARGET_FINGERPRINT="$fingerprint" \
            docker compose -f docker-compose.qa.yml run --rm -T \
              -e TEMPLATE_TWIN_LINEAGE_APPROVED_TARGET_FINGERPRINT \
              --entrypoint sh db-migrate -c \
              'npm run --silent lineage:online -w @meddoc/db -- --phase validate'

          status="$(lineage_status)"
          fingerprint="$(lineage_fingerprint "$status" contract)"
          TEMPLATE_TWIN_LINEAGE_APPROVED_TARGET_FINGERPRINT="$fingerprint" \
          TEMPLATE_TWIN_LINEAGE_CONTRACT_ACK=note_templates_lineage_v1:meddoc_qa_test \
            docker compose -f docker-compose.qa.yml run --rm -T \
              -e TEMPLATE_TWIN_LINEAGE_APPROVED_TARGET_FINGERPRINT \
              -e TEMPLATE_TWIN_LINEAGE_CONTRACT_ACK \
              --entrypoint sh db-migrate -c \
              'npm run --silent lineage:online -w @meddoc/db -- --phase contract'

          final_status="$(lineage_status)"
          jq -e '
            .readOnly == true and
            .operationKey == "note_templates_lineage_v1" and
            .phase == "CONTRACTED" and
            .nullRows == 0 and
            .duplicateLineageVersions == 0 and
            .partialIndex.exists == false and
            .finalIndex == {"exists":true,"valid":true,"ready":true} and
            .templateKindIndex == {"exists":true,"valid":true,"ready":true} and
            .validationConstraint == {"exists":true,"validated":true} and
            .presentIndexesExact == true and
            .validationConstraintExact == true and
            .columnNotNull == true and
            .transitionTriggerPresent == false and
            .transitionContractExact == true
          ' <<<"$final_status" >/dev/null

      - name: Apply auth-expand migration segment
        shell: bash
        run: |
          set -euo pipefail
          status="$(docker compose -f docker-compose.qa.yml run --rm -T \
            db-migrate --phase status)"
          fingerprint="$(jq -er '
            select(.event == "status") |
            select(.appliedMigrations == 68) |
            select(.lastMigration == "20260715162000_template_twin_docx_v1") |
            .targetFingerprints["auth-expand"]
          ' <<<"$status")"
          [[ "$fingerprint" =~ ^[a-f0-9]{64}$ ]]
          DATABASE_RELEASE_MIGRATION_APPROVED_TARGET_FINGERPRINT="$fingerprint" \
            docker compose -f docker-compose.qa.yml run --rm -T \
              -e DATABASE_RELEASE_MIGRATION_APPROVED_TARGET_FINGERPRINT \
              db-migrate --phase auth-expand

      # V5 is deliberately expand-only. Complete it on the already reviewed
      # synthetic target, rerun the idempotent reconciliation, and prove the
      # transition trigger is absent before migration 94 is admitted.
      - name: Complete auth-token linearization in disposable QA
        shell: bash
        run: |
          set -euo pipefail
          auth_status() {
            docker compose -f docker-compose.qa.yml run --rm -T \
              --entrypoint sh db-migrate -c \
              'export AUTH_TOKEN_LINEARIZATION_DATABASE_URL="$DATABASE_URL";
               npm run --silent auth-token-linearization:online -w @meddoc/db -- --phase status'
          }
          for attempt in 1 2; do
            status="$(auth_status)"
            fingerprint="$(jq -er '.targetFingerprints.all' <<<"$status")"
            [[ "$fingerprint" =~ ^[a-f0-9]{64}$ ]]
            AUTH_TOKEN_LINEARIZATION_APPROVED_TARGET_FINGERPRINT="$fingerprint" \
              docker compose -f docker-compose.qa.yml run --rm -T \
                -e AUTH_TOKEN_LINEARIZATION_APPROVED_TARGET_FINGERPRINT \
                --entrypoint sh db-migrate -c \
                'export AUTH_TOKEN_LINEARIZATION_DATABASE_URL="$DATABASE_URL";
                 npm run --silent auth-token-linearization:online -w @meddoc/db -- --phase all --batch-size 100 --batch-delay-ms 0'
          done
          final_status="$(auth_status)"
          jq -e '
            .duplicateGroups == 0 and
            .indexExists == true and
            .indexValid == true and
            .indexReady == true and
            .indexExact == true and
            .transitionTriggerEnabled == false and
            .transitionTriggerState == "absent" and
            .complete == true
          ' <<<"$final_status" >/dev/null

      - name: Apply pre-v9 migration segment
        shell: bash
        run: |
          set -euo pipefail
          status="$(docker compose -f docker-compose.qa.yml run --rm -T \
            db-migrate --phase status)"
          fingerprint="$(jq -er '
            select(.event == "status") |
            select(.appliedMigrations == 93) |
            select(.lastMigration == "20260720150000_auth_token_linearization_v5") |
            .targetFingerprints["pre-v9"]
          ' <<<"$status")"
          [[ "$fingerprint" =~ ^[a-f0-9]{64}$ ]]
          DATABASE_RELEASE_MIGRATION_APPROVED_TARGET_FINGERPRINT="$fingerprint" \
            docker compose -f docker-compose.qa.yml run --rm -T \
              -e DATABASE_RELEASE_MIGRATION_APPROVED_TARGET_FINGERPRINT \
              db-migrate --phase pre-v9

      # The release-security login is deliberately absent during fresh-cluster
      # bootstrap and is added only after v8 by its target-bound transactional
      # provisioner. No credential enters argv or output.
      - name: Provision release-security principal in disposable QA
        shell: bash
        run: |
          set -euo pipefail
          system_identifier="$({
            docker compose -f docker-compose.qa.yml exec -T postgres \
              psql -X --no-psqlrc --quiet --tuples-only --no-align \
              --username meddoc --dbname meddoc_qa_test \
              --command 'SELECT system_identifier FROM pg_control_system()'
          })"
          [[ "$system_identifier" =~ ^[0-9]+$ ]]
          DB_RELEASE_SECURITY_PASSWORD="$QA_DB_RELEASE_SECURITY_PASSWORD" \
          POSTGRES_USER=meddoc \
          POSTGRES_DB=meddoc_qa_test \
          DB_EXPECTED_SYSTEM_IDENTIFIER="$system_identifier" \
            docker compose -f docker-compose.qa.yml exec -T \
              -e DB_RELEASE_SECURITY_PASSWORD \
              -e POSTGRES_USER \
              -e POSTGRES_DB \
              -e DB_EXPECTED_SYSTEM_IDENTIFIER \
              postgres sh -s < \
                infra/postgres/provision-template-twin-release-security.sh

      - name: Apply exact-principal v9 migration segment
        shell: bash
        run: |
          set -euo pipefail
          status="$(docker compose -f docker-compose.qa.yml run --rm -T \
            db-migrate --phase status)"
          fingerprint="$(jq -er '
            select(.event == "status") |
            select(.appliedMigrations == 96) |
            select(.lastMigration == "20260720200000_mfa_credential_lifecycle_audit_v8") |
            .targetFingerprints.v9
          ' <<<"$status")"
          [[ "$fingerprint" =~ ^[a-f0-9]{64}$ ]]
          DATABASE_RELEASE_MIGRATION_APPROVED_TARGET_FINGERPRINT="$fingerprint" \
            docker compose -f docker-compose.qa.yml run --rm -T \
              -e DATABASE_RELEASE_MIGRATION_APPROVED_TARGET_FINGERPRINT \
              db-migrate --phase v9
          final_status="$(docker compose -f docker-compose.qa.yml run --rm -T \
            db-migrate --phase status)"
          jq -e '
            .event == "status" and
            .appliedMigrations == 97 and
            .lastMigration == "20260720213000_exact_database_principal_closure_v9"
          ' <<<"$final_status" >/dev/null

      # Run the exact catalog contract only after the ordered migrations and
      # both online protocols have reached their promotable final states.
      # Every application/operations login is proved independently before
      # runtime startup. Credentials remain process environment only; the
      # preflight emits fixed PASS/FAIL output and never catalog details.
      - name: Prove every exact database principal after fresh migration
        shell: bash
        run: |
          set -euo pipefail
          backup_password="$(<"$QA_DB_BACKUP_PASSWORD_FILE")"
          [[ "$backup_password" =~ ^[A-Za-z0-9_-]{43,128}$ ]]
          profiles=(
            runtime
            release-control
            release-security
            audit-dispatcher
            auth-email-dispatcher
            backup
          )
          logins=(
            meddoc_runtime
            meddoc_release_control
            meddoc_release_security
            meddoc_audit_dispatcher
            meddoc_auth_email_dispatcher
            meddoc_backup
          )
          passwords=(
            "$QA_DB_RUNTIME_PASSWORD"
            "$QA_DB_RELEASE_CONTROL_PASSWORD"
            "$QA_DB_RELEASE_SECURITY_PASSWORD"
            "$QA_DB_AUDIT_DISPATCHER_PASSWORD"
            "$QA_DB_AUTH_EMAIL_DISPATCHER_PASSWORD"
            "$backup_password"
          )
          for index in "${!profiles[@]}"; do
            connection="postgresql://${logins[$index]}:${passwords[$index]}@postgres:5432/meddoc_qa_test?schema=public&options=-c%20search_path%3Dpg_catalog%2Cpublic"
            EXACT_DATABASE_PRINCIPAL_DATABASE_URL="$connection" \
            EXACT_DATABASE_PRINCIPAL_PROFILE="${profiles[$index]}" \
              docker compose -f docker-compose.qa.yml run --rm -T --no-deps \
                -e EXACT_DATABASE_PRINCIPAL_DATABASE_URL \
                -e EXACT_DATABASE_PRINCIPAL_PROFILE \
                --entrypoint sh db-migrate -c \
                'cd /app; npm run database-principal:preflight -w @meddoc/db'
          done

      # The #278 fail-closed db-guard (assertNonProdDatabase) refuses to seed
      # unless DATABASE_URL is a positively non-prod DB. meddoc_qa_test carries
      # the qa/test marker, so it proceeds; a prod URL here would abort.
      # QA_AUDITOR_PASSWORD is a throwaway: it sets the password of a seeded
      # user in the meddoc_qa_test DB that is destroyed with `down -v` at the
      # end of the job and is never used by the E2E specs (they self-signup).
      # Not a real credential — not verifiable by TruffleHog.
      - name: Guarded seed (proves the #278 non-prod guard)
        run: >
          docker compose -f docker-compose.qa.yml run --rm
          -e QA_AUDITOR_PASSWORD=QaE2eSeedThrowaway9
          --entrypoint sh db-migrate
          -c 'cd /app/apps/transcribe-md && npx --no-install tsx scripts/seed-qa-user.ts'

      # MUST run BEFORE the app starts. /api/health (the app's docker
      # healthcheck, docker-compose.qa.yml) gates on
      # `bucketExists(transcribe-md-audio-qa)` as a REQUIRED check — so with no
      # bucket the app returns 503 and never goes healthy, and the
      # `up --wait transcribe-md` step below fails with "container
      # meddoc-qa-transcribe-md-1 is unhealthy". (Previously this step ran
      # AFTER "Start app + worker", which made the gate a latent race against
      # docker compose's `--wait` strictness — green on lenient runners, red
      # on strict ones. minio is already up+healthy from the infra step.)
      - name: Create the audio bucket in minio
        run: >
          docker compose -f docker-compose.qa.yml exec -T minio sh -c
          'export MC_CONFIG_DIR=/tmp/mc; mc alias set local http://127.0.0.1:9000 qa_minio qa_minio_pw && mc mb --ignore-existing local/transcribe-md-audio-qa'

      - name: Start app + worker
        run: docker compose -f docker-compose.qa.yml up -d --wait transcribe-md transcribe-md-worker

      # ── Run the suite from the runner against the dockerized app at :9020. ──
      - name: Install Playwright chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run E2E (chromium; scenario 5 note-format UN-GATED via NOTE_FORMAT_E2E)
        working-directory: apps/transcribe-md
        env:
          PW_BASE_URL: http://localhost:9020
          NOTE_FORMAT_E2E: "1"
          CI: "true"
        run: npx playwright test --project=chromium

      - name: Verify app + worker after ordinary Chromium
        if: ${{ !cancelled() }}
        run: scripts/template-twin-synthetic-ci-orchestrator.sh assert-runtime

      # This fixture exercises the production release-control contract only in
      # the disposable meddoc_qa_test database. Its four mechanical decisions
      # are labelled synthetic-ci-fixture/not-production-approval and do not
      # represent Desktop Word, Clinical Safety, Privacy/Legal, or Operations
      # approval. Only protected file paths are exported through GITHUB_ENV.
      - name: Prepare the disabled synthetic Template Twin release
        run: scripts/template-twin-synthetic-ci-orchestrator.sh prepare

      # PREPARE leaves both persisted rollout controls and this process boundary
      # disabled. The actual app health route and worker startup—not the fixture
      # process—must register the two distinct deployment envelopes before an
      # activation attempt can succeed.
      - name: Start attested Template Twin runtimes with kill switch active
        env:
          TEMPLATE_TWIN_SYNTHETIC_CI_RUNTIME_PROFILE: infrastructure
        run: scripts/template-twin-synthetic-ci-orchestrator.sh recreate-disabled

      - name: Run E2E (Template Twin infrastructure path)
        working-directory: apps/transcribe-md
        env:
          PW_BASE_URL: http://localhost:9020
          CI: "true"
          TEMPLATE_TWIN_SYNTHETIC_CI_RUNTIME_PROFILE: infrastructure
          TEMPLATE_TWIN_SYNTHETIC_CI_ORCHESTRATOR: ${{ github.workspace }}/scripts/template-twin-synthetic-ci-orchestrator.sh
          TEMPLATE_TWIN_SYNTHETIC_CI_ACTIVATE_ACTION: activate-cycle
        run: npx playwright test --project=template-twin

      - name: Verify app + worker after Template Twin infrastructure
        if: ${{ !cancelled() }}
        run: scripts/template-twin-synthetic-ci-orchestrator.sh assert-runtime

      # Replace the infrastructure release while fail closed. This revokes the
      # old epochs, creates the staging candidate, writes new APP/WORKER
      # envelopes with kill switch=true, and then recreates the real replicas so
      # they can register. The staging Playwright journey performs the later
      # activate-cycle only after its authenticated disabled checks pass.
      - name: Prepare disabled replacement for Template Twin staging QA
        env:
          TEMPLATE_TWIN_SYNTHETIC_CI_RUNTIME_PROFILE: staging
        run: scripts/template-twin-synthetic-ci-orchestrator.sh replace-disabled

      - name: Run E2E (authenticated Template Twin staging UI)
        working-directory: apps/transcribe-md
        env:
          PW_BASE_URL: http://localhost:9020
          CI: "true"
          TEMPLATE_TWIN_STAGING_ARTIFACT_DIR: template-twin-staging-artifacts
          TEMPLATE_TWIN_SYNTHETIC_CI_RUNTIME_PROFILE: staging
          TEMPLATE_TWIN_SYNTHETIC_CI_ORCHESTRATOR: ${{ github.workspace }}/scripts/template-twin-synthetic-ci-orchestrator.sh
          TEMPLATE_TWIN_SYNTHETIC_CI_ACTIVATE_ACTION: activate-cycle
          TEMPLATE_TWIN_SYNTHETIC_CI_REPLACE_ACTION: replace-cycle
        run: npx playwright test --project=template-twin-staging-ui

      - name: Verify app + worker after Template Twin staging UI
        if: ${{ !cancelled() }}
        run: scripts/template-twin-synthetic-ci-orchestrator.sh assert-runtime

      - name: Validate staging source and output with Open XML SDK
        env:
          TEMPLATE_TWIN_STAGING_ARTIFACT_DIR: apps/transcribe-md/template-twin-staging-artifacts
          QA_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >
          QA_GENERATED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          bash apps/transcribe-md/scripts/template-twin-staging-ui/validate-openxml.sh

      - name: Finalize synthetic staging artifact hashes
        id: staging_artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="apps/transcribe-md/template-twin-staging-artifacts"
          test -d "$artifact_dir"
          short_sha="$(git rev-parse --short=12 HEAD)"
          full_sha="$(git rev-parse HEAD)"
          printf 'sha=%s\n' "$short_sha" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$full_sha" > "$artifact_dir/GENERATING-COMMIT.txt"
          find "$artifact_dir" -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum > "$artifact_dir/SHA256SUMS"
          {
            printf '### Template Twin synthetic staging evidence\n\n'
            printf -- '- Commit: `%s`\n' "$full_sha"
            printf -- '- Artifact: `template-twin-staging-ui-%s`\n\n' "$short_sha"
            printf '```text\n'
            cat "$artifact_dir/SHA256SUMS"
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload synthetic Template Twin staging evidence
        uses: actions/upload-artifact@v4
        with:
          name: template-twin-staging-ui-${{ steps.staging_artifact.outputs.sha }}
          path: apps/transcribe-md/template-twin-staging-artifacts/
          retention-days: 7
          if-no-files-found: error

      # Close the synthetic release before unrelated PHI/Rx fixtures run. The
      # following baseline Compose recreation intentionally omits runtime.env,
      # restoring the committed kill-switch-on defaults.
      - name: Revoke the synthetic Template Twin release after staging
        run: scripts/template-twin-synthetic-ci-orchestrator.sh revoke

      - name: Clean the synthetic Template Twin release fixture after staging
        run: scripts/template-twin-synthetic-ci-orchestrator.sh cleanup

      # ── Flag-gated MOCK fixtures that can't share the main suite's app env:
      #    • MOCK_TEMPLATE_PHI_FLAG=true → every note-format parse rejects
      #      (scenario 23, phi-reject project) — flips the mocked PHI scan flagged.
      #    • MOCK_RX_WARNINGS=true → L7c emits a critical Rx warning on every visit
      #      (scenario 24, rx-safety project) — would block every other spec's sign.
      #    The two flags are independent (different mock purposes), so recreate the
      #    app + worker once with both and run both isolated projects. ──
      # Safe to re-run the bucket-gated `up --wait` here: this recreates only
      # transcribe-md + the worker (minio is NOT touched), so the audio bucket
      # created above persists in the qa_minio named volume → /api/health stays
      # healthy. If a future edit adds minio to this step (or a `down`), the
      # bucket-create step must run again before this.
      - name: Recreate app + worker with the flag-gated MOCK fixtures
        run: >
          MOCK_TEMPLATE_PHI_FLAG=true MOCK_RX_WARNINGS=true
          docker compose -f docker-compose.qa.yml up -d --wait --force-recreate
          transcribe-md transcribe-md-worker

      - name: Run E2E (flag-on project — phi-reject)
        working-directory: apps/transcribe-md
        env:
          PW_BASE_URL: http://localhost:9020
          NOTE_FORMAT_E2E: "1"
          CI: "true"
        run: npx playwright test --project=phi-reject

      - name: Verify app + worker after PHI rejection
        if: ${{ !cancelled() }}
        run: scripts/template-twin-synthetic-ci-orchestrator.sh assert-runtime

      - name: Run E2E (flag-on project — rx-safety)
        working-directory: apps/transcribe-md
        env:
          PW_BASE_URL: http://localhost:9020
          NOTE_FORMAT_E2E: "1"
          CI: "true"
        run: npx playwright test --project=rx-safety

      - name: Verify app + worker after Rx safety
        if: ${{ !cancelled() }}
        run: scripts/template-twin-synthetic-ci-orchestrator.sh assert-runtime

      # ── Debuggability for a red run. ──
      - name: App + worker logs (on failure)
        if: failure()
        run: docker compose -f docker-compose.qa.yml logs --tail=300 transcribe-md transcribe-md-worker

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/transcribe-md/playwright-report/
          retention-days: 14

      - name: Upload Playwright traces + videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/transcribe-md/test-results/
          retention-days: 14

      # Safety cleanup stays ahead of volume destruction so revocation and its
      # audit evidence are proven while PostgreSQL is still available. Both
      # phases are recovery-safe when preparation never started or already
      # completed earlier in the job.
      - name: Revoke any remaining synthetic Template Twin release
        if: always()
        run: scripts/template-twin-synthetic-ci-orchestrator.sh revoke

      - name: Clean any remaining synthetic Template Twin release state
        if: always()
        run: scripts/template-twin-synthetic-ci-orchestrator.sh cleanup

      - name: Tear down the qa stack (volumes too)
        if: always()
        run: docker compose -f docker-compose.qa.yml down -v

      - name: Remove the protected Template Twin fixture root
        if: always()
        run: scripts/template-twin-synthetic-ci-orchestrator.sh destroy

      - name: Remove ephemeral synthetic MFA keyring
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          keyring_dir="$RUNNER_TEMP/quillmd-ci-mfa"
          keyring_path="$keyring_dir/keyring.json"
          sudo rm -f -- "$keyring_path"
          rmdir "$keyring_dir" 2>/dev/null || true

      - name: Remove ephemeral synthetic database credentials
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          set +x
          credential_dir="$RUNNER_TEMP/quillmd-ci-database"
          backup_path="$credential_dir/backup-password"
          if [[ -d "$credential_dir" ]]; then
            rm -f -- "$backup_path"
            rmdir "$credential_dir"
          fi
