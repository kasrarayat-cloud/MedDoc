# ============================================================================
# CI — Playwright E2E gate for the transcribe-md app (Phase 1)
# ----------------------------------------------------------------------------
# Builds the REAL app + worker + db-migrate images from the PR code, brings up
# an EPHEMERAL non-prod stack (the committed docker-compose.qa.yml: own
# postgres/redis/minio, MOCK_AI_CALLS=true, dummy keys, :9020), migrates +
# guard-seeds the throwaway `meddoc_qa_test` DB, then runs the Playwright
# chromium suite headless against :9020. Fails the check if any spec fails;
# uploads the HTML report + traces for debugging.
#
# This is ADDITIVE to the existing checks (CI unit / npm audit / axe-core /
# TruffleHog). It never touches the prod stack — the images are built fresh in
# the runner and torn down with `down -v` at the end.
#
# Faithfulness: builds the same Dockerfiles prod ships (the app build runs the
# bundle-assert + 6 GB builder heap), and runs the real BullMQ worker pipeline
# under MOCK — so a build/bundle regression (the PDF-incident class) or a
# broken visit→SOAP→sign path fails the gate.
# ============================================================================

name: e2e

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege: the job only checks out, builds images, and uploads artifacts.
permissions:
  contents: read

# ⚠️ REGISTRY-BLIP RETRY BUDGET — npm defaults to 2 retries / 60s ceiling.
# On 2026-08-10 three independent builds on three branches died inside twelve
# minutes on `npm error code ECONNRESET` during `npm ci`, after 18 of 18 green
# e2e runs. Zero test failures — nothing ever installed. Declared at WORKFLOW
# level so every job and every future npm invocation inherits it, rather than as
# flags on each command, which is a hand-kept list.
env:
  NPM_CONFIG_FETCH_RETRIES: "5"
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "20000"
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "120000"

jobs:
  # ==========================================================================
  # DOCS-ONLY DETECTION — one cheap job, consumed by BOTH arms below.
  # ==========================================================================
  changes:
    name: detect docs-only
    # ⚠️ SELF-HOSTED (quillmd-ci-1, 4 vCPU / 8 GB, Docker 29.7.2). Job `name:`
    # is UNCHANGED so every required context is preserved byte-for-byte.
    # REVERT: `ubuntu-latest`, one line per job, nothing else depends on it.
    runs-on: [self-hosted, linux, x64, quillmd-ci]
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.d.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # the predicate diffs base...HEAD; a shallow clone would fail CLOSED
      - id: d
        name: is-docs-only
        run: |
          BASE="${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}"
          if bash scripts/ci/is-docs-only.sh "$BASE" HEAD; then
            echo "docs_only=true"  >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

  # ==========================================================================
  # ⚠️ TWO JOBS, ONE `name:` — AND THAT IS THE WHOLE DESIGN.
  #
  # `Playwright E2E (transcribe-md)` is a REQUIRED status context. A required
  # check that never RUNS leaves a PR "expected" forever and unmergeable, so
  # path filters on the trigger are not available to us. Instead exactly one of
  # these two jobs runs, and both publish a check-run under the SAME name — so
  # branch protection, the 7-check floor and `scripts/merge-pr.sh` see no
  # difference whatsoever.
  #
  # If you rename one, rename BOTH, or a docs-only PR becomes unmergeable.
  # ==========================================================================
  e2e-skip:
    name: Playwright E2E (transcribe-md)
    needs: changes
    if: needs.changes.outputs.docs_only == 'true'
    # ⚠️ SELF-HOSTED (quillmd-ci-1, 4 vCPU / 8 GB, Docker 29.7.2). Job `name:`
    # is UNCHANGED so every required context is preserved byte-for-byte.
    # REVERT: `ubuntu-latest`, one line per job, nothing else depends on it.
    runs-on: [self-hosted, linux, x64, quillmd-ci]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # ⚠️ RE-ASSERT, DO NOT TRUST THE UPSTREAM OUTPUT. Defense in depth: this
      # arm is the one that lets a change merge WITHOUT the suite, so it proves
      # its own precondition rather than inheriting it. If the two ever
      # disagree, this FAILS — and a red required check is the safe direction.
      - name: RE-ASSERT the change is docs-only
        run: |
          BASE="${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}"
          if ! bash scripts/ci/is-docs-only.sh "$BASE" HEAD; then
            echo "::error::SKIP ARM REACHED ON A NON-DOCS CHANGE — refusing to report green."
            exit 1
          fi
          echo "docs-only re-asserted independently; E2E legitimately skipped."

  e2e:
    name: Playwright E2E (transcribe-md)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    # ⚠️ SELF-HOSTED (quillmd-ci-1, 4 vCPU / 8 GB, Docker 29.7.2). Job `name:`
    # is UNCHANGED so every required context is preserved byte-for-byte.
    # REVERT: `ubuntu-latest`, one line per job, nothing else depends on it.
    runs-on: [self-hosted, linux, x64, quillmd-ci]
    # 40 was sized for ONE image build and two projects. This job now builds
    # four images and runs four projects; recovering the doc-preview timeouts
    # above brings it back inside the budget, and this leaves headroom rather
    # than sitting on the line. Splitting the projects into parallel jobs is the
    # better long-term shape — noted, deliberately not bundled into a fix PR.
    # ⚠️ BOX-CALIBRATED, NOT A SPEED SETTING. A timeout is a HANG-GUARD;
    # generous is free. quillmd-ci-1 (4 vCPU) is ~1.4-1.9x slower than a
    # hosted runner on CPU-bound work, and every timeout in this repo was
    # sized against hosted speed. Formula: measured 48m31s on quillmd-ci-1 x2.5 = 121 -> 120.
    timeout-minutes: 120

    env:
      # Build args: point the client bundle + auth URL at the CI app (:9020)
      # instead of the prod IP defaults baked into docker-compose.yml.
      TRANSCRIBE_MD_AUTH_URL: http://localhost:9020
      MARKETING_URL: http://localhost:9010
      DOCKER_BUILDKIT: "1"
      # NOTE: the build steps pass `-p meddoc-pro` so the built images are named
      # `meddoc-pro-transcribe-md{,-worker,-db-migrate}` (the prod compose has no
      # `name:`, so the project would otherwise default to the checkout dir).
      # That is build-scoped on purpose — the qa stack keeps its own
      # `name: meddoc-qa` project (images are global, looked up by name).

    steps:
      - uses: actions/checkout@v4

      # ── RECLAIM RUNNER DISK, BEFORE ANYTHING BUILDS ──────────────────────
      # This job builds FOUR ~435 MB app images plus the worker and db-migrate,
      # and starts Gotenberg, whose chromium layer is another ~1.7 GB. A stock
      # runner has ~14 GB free, and the job died twice with
      #   "failed to register layer: write /usr/lib/chromium/chromium:
      #    no space left on device"
      # — once mid-suite, after 18 minutes of green tests, which reads as a
      # test failure rather than as a full disk.
      #
      # The preinstalled Android/.NET/GHC/CodeQL toolchains are ~25 GB and this
      # job uses none of them. Removing them is the standard remedy and it is
      # far cheaper than discovering the ceiling again at minute 18.
      # ⚠️ GITHUB-HOSTED ONLY, AND THE GUARD IS LOAD-BEARING — DO NOT REMOVE IT.
      #
      # Every command in this step is safe ONLY because a hosted runner is
      # DISPOSABLE. On a PERSISTENT runner the same two lines are destruction:
      #
      #   `docker image prune -af` removes every image not held by a RUNNING
      #   container. On the QuillMD VPS that is the entire ROLLBACK ESTATE —
      #   measured 2026-08-25: **164 `pre-*` tags**, the documented rollback path
      #   for every past deploy, which ruling #137 explicitly forbids pruning.
      #   A routine PR would have deleted all of them, silently, every run.
      #
      #   `rm -rf /usr/share/dotnet …` targets preinstalled toolchains that exist
      #   on a hosted image and may be somebody's actual installation elsewhere.
      #
      # `runner.environment` is `github-hosted` or `self-hosted`, so this gates on
      # exactly the assumption the step is built from. Hosted behaviour is
      # unchanged — the ceiling this step exists to avoid is a hosted ceiling.
      #
      # THE GENERAL RULE: a step written for disposable infrastructure is a
      # destruction command on persistent infrastructure. When a runner moves,
      # re-audit every step's infrastructure assumptions.
      - name: Free runner disk
        if: runner.environment == 'github-hosted'
        run: |
          echo "before:"; df -h / | tail -1
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc                       /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af || true
          echo "after:"; df -h / | tail -1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ── Build the real images from the PR (app build = the OOM-sensitive
      #    step; the Dockerfile bakes --max-old-space-size=6144 + the
      #    unpdf/mammoth bundle-assert, both of which run here). The 16 GB
      #    GitHub runner absorbs the 6 GB build heap. ──
      # ⚠️ F-ret.1, 2026-08-04 — THE DEFAULT PACK NOW BUILDS THE SHIPPED PRODUCT.
      #
      # This step used to pin `NEXT_PUBLIC_SKIN_BETA: "false"`, with the comment
      # "pin it OFF here so the regression gate stays decoupled from the deploy
      # flag and its specs keep matching. (C3-flag-ON E2E coverage is a tracked
      # follow-up.)"
      #
      # That decoupling is exactly what went wrong. The required check was
      # measuring a build NOBODY RUNS — the flag has been ON in production since
      # the C3 promotion (2026-06-15) and Rounds since 2026-08-02 — so the gate
      # was green for two months about a product that did not exist. Run
      # flag-ON for the first time on 2026-08-04 it produced **19 failures out
      # of 59**, and one of them was a real defect that had been live for a day:
      # a doctor could not archive a signed note (#523).
      #
      # A gate decoupled from the deploy is not a conservative gate. It is a
      # gate pointed somewhere else.
      #
      # The flag set below is PRODUCTION'S, deliberately — the same list
      # `docker-compose.yml` bakes, so "the pack is green" and "the shipped
      # product works" are one statement. `gate-flag-coverage.test.ts` pins the
      # list; if you add a flag to prod and not here, that guard reds.
      #
      # ⚠️ THE ROUNDS FLAG IS GONE — REMOVED 2026-08-05 (F-ret.3) with the
      # flag-OFF arm. The skin is unconditional, so there is nothing to set and
      # every image below is a Rounds image whether or not its step name says so.
      #
      # ⚠️ AND THE COMMENT THAT STOOD HERE WAS FALSE FOR A DAY, BY MY OWN HAND.
      # It read "SKIN_ROUNDS IS NOT SET HERE, AND THAT IS DELIBERATE" while the
      # step below set it to "true" — F-ret.1 added the flag and left the
      # sentence claiming the opposite. That is the third comment in this
      # program asserting a property the code does not have, and the first one
      # this session's own work created. Changing a step and not its comment is
      # how the next reader is misled by something that looks authoritative.
      #
      # FOLLOW-UP, NAMED NOT DONE: the separately-tagged "flag-ON" images further
      # down are now byte-identical in flag terms to this one. Collapsing them
      # would cut CI time substantially, but it is a workflow restructure and is
      # deliberately NOT bundled with a flag deletion — a failure in either
      # would be unattributable.
      #
      # ⚠️ THE WHOLE SET IS PASSED, NOT JUST THE SKIN FLAG, AND THAT IS THE
      # DIFFERENCE BETWEEN "production-shaped" AND "nearly". `docker-compose.yml`
      # reads every one of these as `${VAR:-false}`, and CI has no `.env` — so
      # setting only SKIN_BETA would have left REVIEW_DOC_VIEW, UX_SIMPLIFY,
      # CHAT_EDITOR and the rest at **false** while the step's name and comment
      # claimed the shipped product. Verified with
      # `docker compose --env-file /dev/null config`, which resolves them all to
      # "false" without a `.env` present.
      #
      # The values below mirror production's `.env` exactly. If prod turns a
      # flag on and this list is not updated, the required gate silently goes
      # back to testing a build nobody runs — which is the failure this change
      # exists to end.
      #
      # NOT SET, deliberately: NEXT_PUBLIC_DEV_STATES. Prod does not set it; it
      # exists for the Rounds packs' seeded fixtures and they build their own
      # separately-tagged image further down.
      - name: Build app + worker images
        env:
          NEXT_PUBLIC_SKIN_BETA: "true"
          NEXT_PUBLIC_REVIEW_DOC_VIEW: "true"
          NEXT_PUBLIC_UX_SIMPLIFY: "true"
          NEXT_PUBLIC_CHAT_EDITOR: "true"
          NEXT_PUBLIC_DOC_PREVIEW: "true"
          NEXT_PUBLIC_SETTINGS_SIMPLE_ROW: "true"
          NEXT_PUBLIC_VISIT_DOC_PAGE: "true"
          NEXT_PUBLIC_ULTRASOUND_SPECIALTY: "true"
          NEXT_PUBLIC_TEMPLATE_NATIVE_DOCX: "true"
          NEXT_PUBLIC_TEMPLATE_NATIVE_PDF: "true"
        # ⚠️ BUILT VIA THE QA COMPOSE, NOT PROD'S — 2026-08-05 (TEAMS hygiene 1).
        # This used `-f docker-compose.yml`, which tags `:latest`. On the VPS
        # that is the tag production deploys from, so a QA build silently
        # re-pointed it. QA now owns `:qa` end to end and never reads or writes
        # prod's tag; `scripts/check-qa-tag-isolation.sh` asserts it by digest.
        run: docker compose -p meddoc-qa -f docker-compose.qa.yml build transcribe-md transcribe-md-worker

      - name: Build db-migrate image (prisma CLI)
        run: docker compose -p meddoc-qa -f docker-compose.qa.yml build db-migrate

      # ── Bring up the isolated qa stack from the committed recipe. ──
      - name: Start qa infra (postgres + redis + minio)
        run: docker compose -f docker-compose.qa.yml up -d --wait postgres redis minio

      - name: Migrate schema → meddoc_qa_test
        run: docker compose -f docker-compose.qa.yml run --rm db-migrate

      # The #278 fail-closed db-guard (assertNonProdDatabase) refuses to seed
      # unless DATABASE_URL is a positively non-prod DB. meddoc_qa_test carries
      # the qa/test marker, so it proceeds; a prod URL here would abort.
      # QA_AUDITOR_PASSWORD is a throwaway: it sets the password of a seeded
      # user in the meddoc_qa_test DB that is destroyed with `down -v` at the
      # end of the job and is never used by the E2E specs (they self-signup).
      # Not a real credential — not verifiable by TruffleHog.
      - name: Guarded seed (proves the #278 non-prod guard)
        run: >
          docker compose -f docker-compose.qa.yml run --rm
          -e QA_AUDITOR_PASSWORD=QaE2eSeedThrowaway9
          --entrypoint sh db-migrate
          -c 'cd /app/apps/transcribe-md && npx --no-install tsx scripts/seed-qa-user.ts'

      # T1 — the multi-seat fixture. Two practices WITH CLINICAL DATA, because a
      # practice-scoping test over an empty practice passes for free: remove the
      # predicate and nothing changes. Production's three multi-member practices
      # all have zero visits, which is exactly how this gate would have proven
      # nothing. The seed itself throws if either side lands empty.
      - name: Seed the T1 multi-seat fixture (practice isolation)
        run: >
          docker compose -f docker-compose.qa.yml run --rm
          -e T1_MEMBER_PASSWORD=T1E2eFixtureThrowaway9x
          --entrypoint sh db-migrate
          -c 'cd /app/apps/transcribe-md && npx --no-install tsx scripts/seed-t1-multiseat.ts'

      # MUST run BEFORE the app starts. /api/health (the app's docker
      # healthcheck, docker-compose.qa.yml) gates on
      # `bucketExists(transcribe-md-audio)` as a REQUIRED check — so with no
      # bucket the app returns 503 and never goes healthy, and the
      # `up --wait transcribe-md` step below fails with "container
      # meddoc-qa-transcribe-md-1 is unhealthy". (Previously this step ran
      # AFTER "Start app + worker", which made the gate a latent race against
      # docker compose's `--wait` strictness — green on lenient runners, red
      # on strict ones. minio is already up+healthy from the infra step.)
      # The SECOND bucket is not optional either. The Template Twin artifact
      # store deliberately never creates or reconfigures a bucket — provisioning
      # a private PHI-adjacent bucket is an infrastructure act, not something an
      # app does on first write — so a missing one surfaces as
      # TemplateTwinStorageUnavailableError at the first compile. The QA VPS had
      # it provisioned by hand months ago, which is exactly why its absence here
      # went unnoticed until CI tried to compile a template.
      - name: Create the audio + template-artifact buckets in minio
        run: >
          docker compose -f docker-compose.qa.yml exec -T minio sh -c
          'export MC_CONFIG_DIR=/tmp/mc; mc alias set local http://127.0.0.1:9000 qa_minio qa_minio_pw && mc mb --ignore-existing local/transcribe-md-audio && mc mb --ignore-existing local/transcribe-md-template-artifacts && mc ls local'

      # ── THE CERTIFIED TWIN the visit-doc project needs. ──────────────────
      # visit-document.spec.ts refuses to skip — "no CERTIFIED twin in this
      # stack — fixture missing" FAILS, which is right, but CI had no way to
      # produce one, so all 14 specs failed on the fixture instead of the code.
      #
      # This runs the REAL path against the committed form: the real docx
      # compiler, the real mapping confirmation, the real fill -> render ->
      # roundtrip proof, and the real certification gate. Nothing is relaxed
      # and no row is forced to CERTIFIED behind its back.
      #
      # It makes NO model calls. The three stochastic inputs on that path
      # (mapping proposal, L3 extraction, note generation) come from a
      # content-addressed pin minted once on QA against the live models and
      # committed as tests/e2e/fixtures/twin-certified-pins.json. The seeder
      # re-verifies every hash and injects extractor/generator seams that THROW
      # if reached, so a compiler change fails loudly here rather than quietly
      # reaching for a model that CI has only a dummy key for.
      #
      # Runs BEFORE the app starts: it is a direct DB + object-store script and
      # needs the audio bucket above, nothing else.
      # BOUNDED. This step once ran 22 minutes against a 55-minute job budget
      # while the identical work takes ~90 seconds on a warm stack — a hang, not
      # slowness, and an unbounded hang starves every project after it and then
      # reports as a job timeout, which names nothing. `timeout` turns that into
      # a step failure with the seeder's own progress lines still in the log, so
      # the last stage it reached is visible.
      - name: Seed a genuine CERTIFIED twin (real compile+certify, pinned, no model calls)
        timeout-minutes: 9
        run: |
          echo "── buckets, as the object store itself reports them ──"
          docker compose -f docker-compose.qa.yml exec -T minio sh -c \
            'export MC_CONFIG_DIR=/tmp/mc; mc alias set local http://127.0.0.1:9000 qa_minio qa_minio_pw >/dev/null && mc ls local' || true
          echo "── seeding ──"
          # `bash -e` would abort on the timeout's non-zero exit and skip every
          # diagnostic below — which is exactly the information this step exists
          # to produce. Handle the status explicitly instead.
          set +e
          timeout --signal=TERM --kill-after=30s 7m \
          docker compose -f docker-compose.qa.yml run --rm -T \
            -e MOCK_AI_CALLS=true \
            `# ⚠️ B0 — A KEY IS REQUIRED UNDER MOCK, DELIBERATELY. Since the mock` \
            `# boundary moved BELOW the meter, getClient() runs even when mocked —` \
            `# it stays the first statement and outside the try, so the path is` \
            `# fail-closed. That keeps TWO conditions: the flag stops the call, and` \
            `# this dummy credential is what survives a code path that forgets the` \
            `# flag. Without it the PHI scan fails closed and the seed dies with` \
            `# TemplateTwinPhiScanUnavailableError. Same value as docker-compose.qa.yml:290.` \
            -e ANTHROPIC_API_KEY=qa-dummy-anthropic-key-never-valid \
            -e AUTH_SECRET=qa-throwaway-secret-not-used-in-prod-000000000000000= \
            -e NEXTAUTH_SECRET=qa-throwaway-secret-not-used-in-prod-000000000000000= \
            -e AUTH_TRUST_HOST=true \
            -e AUTH_URL=http://localhost:9020 \
            -e NEXTAUTH_URL=http://localhost:9020 \
            -e REDIS_URL=redis://redis:6379 \
            -e MINIO_ENDPOINT=minio:9000 \
            -e MINIO_ACCESS_KEY=qa_minio \
            -e MINIO_SECRET_KEY=qa_minio_pw \
            -e TRANSCRIBE_MD_MINIO_BUCKET=transcribe-md-audio \
            -e MINIO_USE_SSL=false \
            -e NODE_ENV=production \
            --entrypoint sh db-migrate \
            -c 'cd /app/apps/transcribe-md && npx --no-install tsx scripts/seed-certified-twin.ts'
          rc=$?
          if [ $rc -eq 124 ] || [ $rc -eq 137 ]; then
            echo "::error::the twin seed HUNG (killed at 7m). The last [twin-seed] line above is the stage it reached."
            echo "── minio state ──"
            docker compose -f docker-compose.qa.yml exec -T minio sh -c \
              'export MC_CONFIG_DIR=/tmp/mc; mc alias set local http://127.0.0.1:9000 qa_minio qa_minio_pw >/dev/null && mc ls --recursive local' || true
            docker compose -f docker-compose.qa.yml logs --tail=80 minio || true
            df -h / | tail -1
          fi
          exit $rc

      # ⚠️ `gotenberg` IS NOT OPTIONAL HERE SINCE RULING #113, AND THIS PR'S OWN
      # RUN IS WHAT PROVED IT. `pdf-generator.ts` (pdfkit, in-process) was
      # retired and the PDF export converged onto `generateVisitDocx` →
      # Gotenberg, so a stack without the sidecar cannot produce a PDF at all —
      # BY DESIGN, since #116(c) requires the failure be a loud named refusal
      # rather than a half-document or a DOCX wearing a PDF's content type.
      #
      # This job brought up only the app and the worker, so scenarios 1 and 3
      # asked for a PDF, met the 503, and failed on
      # `expect(pdf.suggestedFilename()).toMatch(/\.pdf$/)`.
      #
      # THE GATE WAS RIGHT AND THE STACK WAS WRONG: a test environment whose
      # service set no longer matches production's is the wrong-universe class,
      # and the red is the instrument working. Two later jobs in this file
      # already list gotenberg — the main scenario job is where the PDF
      # DOWNLOAD actually lives, and it was the one missing it.
      - name: Start app + worker (+ the PDF converter — see above)
        run: docker compose -f docker-compose.qa.yml up -d --wait gotenberg transcribe-md transcribe-md-worker

      # ── Run the suite from the runner against the dockerized app at :9020. ──
      # ── #739 — see the long note in `test.yml` for the measurement. Same
      # split, same reason: `--with-deps` is one step with one silent log, and
      # when it hangs nothing says which of its two halves hung. Split here
      # too, so this pack's stalls are diagnosable by the same tell.
      #
      # ⚠️ AND THE ARITHMETIC IS WHY IT MATTERS MORE HERE THAN IN `CI`. This
      # job's budget is generous but the PACK is long — the last ten `e2e` runs
      # on `main` measured 36m01s–49m01s — so a ~19-minute install stall does
      # not merely fail this step, it makes the remaining budget unable to hold
      # the pack. Bounding the install at 10 minutes is what keeps a stall from
      # converting into an unrelated-looking timeout further down.
      - name: Install workspace dependencies
        run: npm ci

      - name: Resolve Playwright version (for cache key)
        id: pw-version
        run: |
          ver=$(node -p "require('./apps/transcribe-md/package.json').devDependencies['@playwright/test']")
          echo "version=${ver}" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}
          restore-keys: |
            playwright-${{ runner.os }}-

      # #739 — bound apt's own network waits; see the measurement in `test.yml`.
      # The hang is `apt-get install` fetching packages AFTER the index has
      # recovered, so the cure belongs at the layer that can tell a slow fetch
      # from a dead one.
      - name: Bound apt's network waits (#739)
        run: |
          printf 'Acquire::http::Timeout "20";\nAcquire::https::Timeout "20";\nAcquire::Retries "3";\n' \
            | sudo tee /etc/apt/apt.conf.d/99-quillmd-timeouts > /dev/null
          # Proves its own application: apt parses apt.conf.d at STARTUP, so a
          # malformed drop-in fails here rather than being silently ignored.
          sudo apt-get --version > /dev/null

      # ⚠️ `working-directory` IS LOAD-BEARING, AND THIS FILE WAS THE ONLY ONE OF
      # FOUR MISSING IT. `@playwright/test` is declared in `apps/transcribe-md`
      # and `apps/meddoc-pro` — NEVER at the repo root. Root
      # `node_modules/.bin/playwright` exists only because npm workspaces HOISTS
      # it, which is an accident of resolution and not a declared dependency.
      #
      # From the app directory `npx` searches the app-local `.bin` AND walks UP
      # to the root; from the root it can only ever see the root. So the app
      # directory is a strict SUPERSET — it resolves under either hoisting,
      # where the root form resolves under only one.
      #
      # MEASURED 2026-08-25 on PR #743 (dependabot, 37 root bumps), run
      # 32843747130 job 97788724159, step failing in ONE SECOND — which is what
      # distinguishes it from #739's stall, where the 5-minute ceiling is burned:
      #
      #     2026-08-25T11:55:36.8209217Z sh: 1: playwright: not found
      #     2026-08-25T11:55:36.8367411Z ##[error]Process completed with exit code 127.
      #
      # The bump changed hoisting, the root bin vanished, and this job died at a
      # step `a11y.yml` sailed through on the SAME COMMIT — because that file
      # already carries `working-directory`. All 12 `npx playwright test` steps
      # BELOW in this file carry it too; only these two install steps, added
      # together by the #739 split, did not.
      - name: Install Playwright system deps (apt half of --with-deps)
        timeout-minutes: 5
        run: npx playwright install-deps chromium
        working-directory: apps/transcribe-md

      - name: Install Playwright Chromium (browser half of --with-deps)
        timeout-minutes: 5
        run: npx playwright install chromium
        working-directory: apps/transcribe-md

      # ── RULING #117(e) — the attestation footer as LIBREOFFICE paints it. ──
      # The unit suite's structural guard reads `word/footer1.xml` and the
      # section's `w:footerReference w:type`, and records its own limit: a
      # ONE-PAGE fixture, so "on every page" is asserted over a set of size one,
      # and the reference type is a PROXY for what the renderer does. This step
      # removes the proxy — a genuinely multi-page document through the REAL
      # converter, read back page by page.
      #
      # ⚠️ IT LIVES HERE, NOT IN `CI`, BECAUSE IT NEEDS THE SIDECAR. The `CI`
      # workflow starts no gotenberg, so these files are excluded from the
      # default vitest config; `gate-rendered-tier-is-invoked.test.ts` asserts
      # from inside that default suite that THIS STEP still exists, so deleting
      # it turns the unit suite red rather than silently retiring a gate.
      #
      # It runs INSIDE the `converter` network rather than publishing gotenberg's
      # port: that network is `internal: true` on purpose, and Docker silently
      # declines to publish a port from it — the mapping appears in
      # `docker compose config`, the container comes up healthy, and no port is
      # bound. See docker-compose.qa.rendered.yml.
      - name: Run the RENDERED tier (#117e — real LibreOffice, multi-page)
        run: >
          docker compose -f docker-compose.qa.yml -f docker-compose.qa.rendered.yml
          run --rm rendered-tests

      - name: Run E2E (chromium; scenario 5 note-format UN-GATED via NOTE_FORMAT_E2E)
        working-directory: apps/transcribe-md
        env:
          PW_BASE_URL: http://localhost:9020
          NOTE_FORMAT_E2E: "1"
          CI: "true"
          # ⚠️ THE SAME VALUE THE SEED STEP USES, AND IT HAS TO BE REPEATED HERE.
          # That step passes it with `-e` into a docker container; this step is
          # the Playwright RUNNER on the host and inherits nothing from it.
          # `34-practice-uniform-read` logs the fixture members in, so without
          # this it fails as "login timed out" — which reads like a browser flake
          # and sends the next person to the wrong place. The spec asserts the
          # variable is set rather than defaulting it, so the failure names the
          # cause.
          T1_MEMBER_PASSWORD: T1E2eFixtureThrowaway9x
        run: npx playwright test --project=chromium

      # ── Flag-gated MOCK fixtures that can't share the main suite's app env:
      #    • MOCK_TEMPLATE_PHI_FLAG=true → every note-format parse rejects
      #      (scenario 23, phi-reject project) — flips the mocked PHI scan flagged.
      #    • MOCK_RX_WARNINGS=true → L7c emits a critical Rx warning on every visit
      #      (scenario 24, rx-safety project) — would block every other spec's sign.
      #    The two flags are independent (different mock purposes), so recreate the
      #    app + worker once with both and run both isolated projects. ──
      # Safe to re-run the bucket-gated `up --wait` here: this recreates only
      # transcribe-md + the worker (minio is NOT touched), so the audio bucket
      # created above persists in the qa_minio named volume → /api/health stays
      # healthy. If a future edit adds minio to this step (or a `down`), the
      # bucket-create step must run again before this.
      # gotenberg listed for the same reason as the step above — these projects
      # sign visits too, and a recreate that dropped the converter would
      # reintroduce the 503 for any spec that exports a PDF.
      - name: Recreate app + worker with the flag-gated MOCK fixtures
        run: >
          MOCK_TEMPLATE_PHI_FLAG=true MOCK_RX_WARNINGS=true
          docker compose -f docker-compose.qa.yml up -d --wait
          gotenberg transcribe-md transcribe-md-worker

      # ── The pre-sign document surface. Needs the C3 skin AND the review-doc
      #    flag baked in (both are read from CLIENT components, so a runtime env
      #    would leave the OFF branch live with no error). Separately tagged so
      #    the gate's own image is never overwritten. ──
      #
      # NEXT_PUBLIC_ULTRASOUND_SPECIALTY ADDED 2026-07-28. The pack now runs its
      # core specs across BOTH specialty classes, and the imaging half asserts
      # that an imaging report has no office-E/M surface. That suppression is
      # `ultrasoundSpecialtyEnabled() && isImagingReportSpecialty(...)` — with the
      # flag off the conjunction is false, so the app correctly (for that build)
      # computes and PERSISTS an office level on an ultrasound visit, and the
      # imaging specs fail on a product that is behaving as configured.
      #
      # It failed loudly rather than mysteriously: the fixture's own guard threw
      # "IMAGING FIXTURE CARRIES OFFICE E/M STATE — emScoredCode=99212" — the
      # original production bug, reproduced inside CI by a missing build arg.
      # ── ROUNDS Gate A. Its own flag-ON image; the board does not exist with
      #    the flag off, which the pack asserts so a mis-built image fails
      #    loudly rather than passing a suite that never exercised Rounds.
      #
      #    THIS BLOCK RUNS BEFORE THE review-doc BLOCK, AND THE ORDER IS LOAD-
      #    BEARING. Its first arrangement sat BETWEEN "recreate app on the
      #    review-doc image" and "run review-doc", and ended with a step that
      #    recreated the app on the DEFAULT image "for the remaining packs". So
      #    review-doc — already recreated on its own flag-ON image — then ran
      #    against a flag-OFF build, and all 18 of its tests failed on a missing
      #    `review-document-view` testid. The rounds pack itself passed; the
      #    damage was entirely to the pack downstream of it.
      #
      #    There is no "restore" step now, and there should not be: every pack
      #    below recreates the app on its OWN image as its last setup step, so
      #    each one owns the environment it runs in. A shared restore step is
      #    just a second place for the image to be wrong.
      #
      #    THE RULE: a pack's `--project=` run must be immediately preceded by
      #    the recreate onto ITS image. `gate-project-env.test.ts` asserts it. ──
      - name: Build Rounds flag-ON image
        run: >
          docker build -f apps/transcribe-md/Dockerfile
          --build-arg NEXT_PUBLIC_SKIN_BETA=true
          --build-arg NEXT_PUBLIC_ULTRASOUND_SPECIALTY=true
          --build-arg NEXT_PUBLIC_REVIEW_DOC_VIEW=true
          --build-arg NEXT_PUBLIC_CHAT_EDITOR=true
          --build-arg NEXT_PUBLIC_UX_SIMPLIFY=true
          --build-arg NEXT_PUBLIC_SETTINGS_SIMPLE_ROW=true
          --build-arg NEXT_PUBLIC_DOC_PREVIEW=true
          --build-arg NEXT_PUBLIC_VISIT_DOC_PAGE=true
          --build-arg NEXT_PUBLIC_TEMPLATE_NATIVE_DOCX=true
          --build-arg NEXT_PUBLIC_DEV_STATES=true
          -t meddoc-pro-transcribe-md:rounds .

      - name: Recreate app on the Rounds image
        run: >
          docker compose -f docker-compose.qa.yml -f docker-compose.qa.rounds.yml
          up -d --wait transcribe-md

      - name: Run E2E (rounds-board — Gate A)
        working-directory: apps/transcribe-md
        env:
          PW_BASE_URL: http://localhost:9020
          CI: "true"
        run: npx playwright test --project=rounds-board

      # ── ROUNDS Gate B, Screen 2. Same image, its own recreate.
      #
      #    The recreate is idempotent here (same tag, same overrides) and it is
      #    NOT decoration: the rule above is that a pack's run is immediately
      #    preceded by the recreate onto its own image, and that rule is what
      #    keeps a future pack inserted between these two from silently running
      #    this one against someone else's build. `gate-project-env.test.ts`
      #    reads the last recreate before each run and asserts exactly that.
      #
      #    Nothing cleanup-shaped goes after it — the next block recreates onto
      #    its own image as its first act. ──
      - name: Recreate app on the Rounds image (stage pack)
        run: >
          docker compose -f docker-compose.qa.yml -f docker-compose.qa.rounds.yml
          up -d --wait transcribe-md

      - name: Run E2E (rounds-stage — Gate B, Screen 2)
        working-directory: apps/transcribe-md
        env:
          PW_BASE_URL: http://localhost:9020
          CI: "true"
        run: npx playwright test --project=rounds-stage

      # ── ROUNDS Gate B, Screen 3. Same image again, its own recreate.
      #
      #    The recreate is idempotent and it is NOT decoration: the rule is that
      #    a pack's run is IMMEDIATELY preceded by the recreate onto its own
      #    image, so that a pack inserted between these two later cannot leave
      #    this one running against someone else's build. gate-project-env
      #    reads the last recreate before each run and asserts exactly that.
      #
      #    Nothing cleanup-shaped goes after it — the next block recreates onto
      #    its own image as its first act. A shared restore step is just a
      #    second place for the image to be wrong, and it is what once reddened
      #    all 18 review-doc tests for a reason that had nothing to do with
      #    them. ──
      - name: Recreate app on the Rounds image (gates pack)
        run: >
          docker compose -f docker-compose.qa.yml -f docker-compose.qa.rounds.yml
          up -d --wait transcribe-md

      - name: Run E2E (rounds-gates — Gate B, Screen 3)
        working-directory: apps/transcribe-md
        env:
          PW_BASE_URL: http://localhost:9020
          CI: "true"
        run: npx playwright test --project=rounds-gates

      # ── ROUNDS Gate B, Screen 4. Same image, its own recreate — the rule is
      #    that a pack's run is IMMEDIATELY preceded by the recreate onto its own
      #    image, so a pack inserted here later cannot leave this one running
      #    against someone else's build. Nothing cleanup-shaped after it. ──
      - name: Recreate app on the Rounds image (signed pack)
        run: >
          docker compose -f docker-compose.qa.yml -f docker-compose.qa.rounds.yml
          up -d --wait transcribe-md

      - name: Run E2E (rounds-signed — Gate B, Screen 4)
        working-directory: apps/transcribe-md
        env:
          PW_BASE_URL: http://localhost:9020
          CI: "true"
        run: npx playwright test --project=rounds-signed

      # ── ROUNDS Gate B — axe, flag-ON. Same image, its own recreate. It runs
      #    HERE rather than in a11y.yml on purpose: that workflow is a required
      #    check on every unrelated PR and builds one app with plain
      #    `npm run build`, so adding the skin there would make the required gate
      #    measure a skin production is not running until item F. ──
      - name: Recreate app on the Rounds image (a11y pack)
        run: >
          docker compose -f docker-compose.qa.yml -f docker-compose.qa.rounds.yml
          up -d --wait transcribe-md

      - name: Run E2E (rounds-a11y — Gate B, axe on every Rounds surface)
        working-directory: apps/transcribe-md
        env:
          PW_BASE_URL: http://localhost:9020
          CI: "true"
        run: npx playwright test --project=rounds-a11y

      # ── ROUNDS C1-d — the auth surface, flag-ON. Same image, its own
      #    recreate, and it must stay AHEAD of the screenshot upload below:
      #    one upload serves every Rounds pack, so a pack placed after it
      #    writes captures nothing collects — and `if-no-files-found: error`
      #    cannot catch that, because the directory is already non-empty from
      #    the packs that ran first. Pinned by gate-shot-durability.
      #    (Deliberately no literal project flag in this prose:
      #    gate-project-env's event scan reads raw lines with no comment
      #    filter, so a project name written here emits a phantom run event
      #    adjudicated against whichever recreate happens to precede it.) ──
      - name: Recreate app on the Rounds image (C1 auth pack)
        run: >
          docker compose -f docker-compose.qa.yml -f docker-compose.qa.rounds.yml
          up -d --wait transcribe-md

      - name: Run E2E (rounds-c1 — C1-d, C1-e and C1-f — auth, settings, templates)
        working-directory: apps/transcribe-md
        env:
          PW_BASE_URL: http://localhost:9020
          CI: "true"
        run: npx playwright test --project=rounds-c1

      # ── R1 — the unification pass. Same flag-ON image, its own recreate, so
      #    gate-project-env's contiguous recreate→run pairing holds. The pack
      #    asserts the SHELL on every authenticated route (0 asides, one Main
      #    nav, one <main id="main">) and the /patients roster's full function.
      #    It is here rather than folded into a screen pack because a red is a
      #    shell regression, and the flip shipped one that every screen pack
      #    was green through. ──
      - name: Recreate app on the Rounds image (R1 unification pack)
        run: >
          docker compose -f docker-compose.qa.yml -f docker-compose.qa.rounds.yml
          up -d --wait transcribe-md

      - name: Run E2E (rounds-r1 — one app, one nav, on every authed route)
        working-directory: apps/transcribe-md
        env:
          PW_BASE_URL: http://localhost:9020
          CI: "true"
        run: npx playwright test --project=rounds-r1

      # ── Gate B's screenshots clause, made retrievable. ──
      # They are uploaded HERE rather than at the end of the job, and on
      # `always()` rather than `failure()`, because both of those were the bug:
      # the captures used to be written into `test-results/`, which every later
      # `playwright test` invocation deletes in global setup, and the only step
      # that uploaded that directory was `if: failure()`. So on a GREEN run —
      # the only kind rule 2a lets the ledger cite — zero screenshots ever left
      # the runner, and on a red one they had usually been wiped first.
      # `rounds-shots/` sits outside every project's outputDir; uploading it
      # immediately keeps it independent of anything downstream.
      - name: Upload Rounds screenshots (Gate B)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rounds-shots
          path: apps/transcribe-md/rounds-shots/
          if-no-files-found: error
          retention-days: 14

      - name: Build flag-ON image for the document surface
        run: >
          docker build -f apps/transcribe-md/Dockerfile
          --build-arg NEXT_PUBLIC_REVIEW_DOC_VIEW=true
          --build-arg NEXT_PUBLIC_SKIN_BETA=true
          --build-arg NEXT_PUBLIC_ULTRASOUND_SPECIALTY=true
          -t meddoc-pro-transcribe-md:review-doc .

      - name: Recreate app on the flag-ON image
        run: >
          docker compose -f docker-compose.qa.yml -f docker-compose.qa.reviewdoc.yml
          up -d --wait transcribe-md

      - name: Run E2E (review-doc — the pre-sign document surface)
        working-directory: apps/transcribe-md
        env:
          PW_BASE_URL: http://localhost:9020
          CI: "true"
        run: npx playwright test --project=review-doc

      # ── Real-document preview. Its own flag-ON image, and the converter
      #    sidecar, because one spec STOPS the converter on purpose to prove the
      #    fallback — the guarantee the whole feature rests on. ──
      # EVERY FLAG THE SURFACE READS, not just the one the project is named
      # after. This image omitted NEXT_PUBLIC_UX_SIMPLIFY, and the confirm card
      # the whole project asserts on renders only when that flag is on — so all
      # four tests waited out their 180 s and the project had never once passed
      # since it was added. It cost ~13 min of the job's 40-min budget on every
      # run. Production sets UX_SIMPLIFY=true, so this was a gate defect, not a
      # product one; with the flag the same four tests pass in 2.8 min.
      # Each flag-ON image is a full app build. Their intermediate layers are
      # what actually fills the disk, and nothing after this point needs them.
      - name: Reclaim build cache before the next image
        run: docker builder prune -af || true

      - name: Build flag-ON image for the document preview
        run: >
          docker build -f apps/transcribe-md/Dockerfile
          --build-arg NEXT_PUBLIC_DOC_PREVIEW=true
          --build-arg NEXT_PUBLIC_SETTINGS_SIMPLE_ROW=true
          --build-arg NEXT_PUBLIC_UX_SIMPLIFY=true
          --build-arg NEXT_PUBLIC_SKIN_BETA=true
          -t meddoc-pro-transcribe-md:doc-preview .

      - name: Start the converter sidecar + app on the flag-ON image
        run: >
          docker compose -f docker-compose.qa.yml -f docker-compose.qa.docpreview.yml
          up -d --wait gotenberg transcribe-md

      - name: Run E2E (doc-preview — including the sidecar-down fallback)
        working-directory: apps/transcribe-md
        env:
          PW_BASE_URL: http://localhost:9020
          CI: "true"
        run: npx playwright test --project=doc-preview

      # ── Phase 2 — the visit page as the document. Its own flag-ON image
      #    (the doc-preview build does not carry NEXT_PUBLIC_VISIT_DOC_PAGE),
      #    and the converter sidecar, because one spec stops it on purpose. ──
      - name: Reclaim build cache before the visit-doc image
        run: docker builder prune -af || true

      - name: Build flag-ON image for the document visit page
        run: >
          docker build -f apps/transcribe-md/Dockerfile
          --build-arg NEXT_PUBLIC_VISIT_DOC_PAGE=true
          --build-arg NEXT_PUBLIC_DOC_PREVIEW=true
          --build-arg NEXT_PUBLIC_REVIEW_DOC_VIEW=true
          --build-arg NEXT_PUBLIC_SETTINGS_SIMPLE_ROW=true
          --build-arg NEXT_PUBLIC_TEMPLATE_NATIVE_DOCX=true
          --build-arg NEXT_PUBLIC_UX_SIMPLIFY=true
          --build-arg NEXT_PUBLIC_SKIN_BETA=true
          --build-arg NEXT_PUBLIC_CHAT_EDITOR=true
          -t meddoc-pro-transcribe-md:visit-doc .

      - name: Start the converter sidecar + app on the visit-doc image
        run: >
          docker compose -f docker-compose.qa.yml -f docker-compose.qa.visitdoc.yml
          up -d --wait gotenberg transcribe-md

      - name: Run E2E (visit-doc — the document page, incl. sidecar-down)
        working-directory: apps/transcribe-md
        env:
          PW_BASE_URL: http://localhost:9020
          CI: "true"
        run: npx playwright test --project=visit-doc

      # ── The chat editor is NOT run in CI: chat-editor.eval.spec.ts drives a
      #    REAL model on real tokens, and *.eval.spec.ts is this repo's marker
      #    for that class. It is run deliberately, against a stack with a live
      #    key. What CI DOES cover is the unit layer that holds the safety
      #    rules: the closed intent union, the attestation store, and the
      #    E/M-stale invariants — all in the vitest gate.

      - name: Restore the fixture app image
        run: >
          MOCK_TEMPLATE_PHI_FLAG=true MOCK_RX_WARNINGS=true
          docker compose -f docker-compose.qa.yml up -d --wait transcribe-md

      - name: Run E2E (flag-on projects — phi-reject + rx-safety)
        working-directory: apps/transcribe-md
        env:
          PW_BASE_URL: http://localhost:9020
          NOTE_FORMAT_E2E: "1"
          CI: "true"
        run: npx playwright test --project=phi-reject --project=rx-safety

      # ── Debuggability for a red run. ──
      - name: App + worker logs (on failure)
        if: failure()
        run: docker compose -f docker-compose.qa.yml logs --tail=300 transcribe-md transcribe-md-worker

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/transcribe-md/playwright-report/
          retention-days: 14

      - name: Upload Playwright traces + videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/transcribe-md/test-results/
          retention-days: 14

      - name: Tear down the qa stack (volumes too)
        if: always()
        run: docker compose -f docker-compose.qa.yml down -v
