# Fresh application and preserved marketing dependencies. No automatic merge.
version: 2
updates:
- package-ecosystem: npm
  directory: /
  schedule:
    interval: daily
  open-pull-requests-limit: 5
  labels:
  - dependencies
  commit-message:
    prefix: chore(deps)
    include: scope
  groups:
    monorepo-root-minor-patch:
      applies-to: version-updates
      update-types:
      - minor
      - patch
- package-ecosystem: npm
  directory: /apps/marketing
  schedule:
    interval: daily
  open-pull-requests-limit: 5
  labels:
  - dependencies
  - app:marketing
  commit-message:
    prefix: chore(deps)
    include: scope
  groups:
    marketing-minor-patch:
      applies-to: version-updates
      update-types:
      - minor
      - patch
- package-ecosystem: npm
  directory: /packages/shared
  schedule:
    interval: daily
  open-pull-requests-limit: 3
  labels:
  - dependencies
  - pkg:shared
  commit-message:
    prefix: chore(deps)
    include: scope
  groups:
    shared-minor-patch:
      applies-to: version-updates
      update-types:
      - minor
      - patch
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  open-pull-requests-limit: 3
  labels:
  - dependencies
  - ci
  commit-message:
    prefix: chore(deps)
    include: scope
- package-ecosystem: docker
  directory: /apps/marketing
  schedule:
    interval: weekly
  open-pull-requests-limit: 3
  labels:
  - dependencies
  - docker
  commit-message:
    prefix: chore(deps)
    include: scope
- package-ecosystem: pip
  directory: /rebuild
  schedule:
    interval: weekly
  open-pull-requests-limit: 3
  labels:
  - dependencies
  groups:
    python-minor-patch:
      update-types:
      - minor
      - patch
