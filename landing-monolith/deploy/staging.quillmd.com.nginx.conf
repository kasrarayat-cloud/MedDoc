# =============================================================================
# staging.quillmd.com — QuillMD "obsidian monolith" landing (NET-NEW staging).
# -----------------------------------------------------------------------------
# Mirrors the live quillmd vhost ingress model (CloudFlare grey-cloud → host
# nginx, TLS via Let's Encrypt) but serves a STATIC export from disk instead of
# proxying to Caddy — this site has no backend.
#
# ISOLATION: specific server_name (staging.quillmd.com) + NO default_server, so
# this block cannot affect quillmd.com / app.quillmd.com or any co-tenant vhost.
# Install target: /etc/nginx/sites-available/quillmd-staging  (symlink → enabled)
# Static root:    /var/www/quillmd-staging   (the `out/` static export)
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name staging.quillmd.com;

    # Shared ACME webroot (same one the quillmd vhost uses) so certbot can
    # answer the HTTP-01 challenge for this name.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl;
    server_name staging.quillmd.com;

    ssl_certificate     /etc/letsencrypt/live/staging.quillmd.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.quillmd.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /var/www/quillmd-staging;
    index index.html;

    # Next.js static export: hashed assets are immutable; HTML is not.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
    # trailingSlash:true → /path/ resolves to /path/index.html.
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # staging — keep crawlers out regardless of page meta.
    add_header X-Robots-Tag "noindex, nofollow" always;
}
