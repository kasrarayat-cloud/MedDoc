<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 920" width="920" height="920">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a2230" stop-opacity="0.9"/>
      <stop offset="0.45" stop-color="#0b1016" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#05070b"/>
    </linearGradient>
    <linearGradient id="streamG" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#e8b85c" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#e8b85c"/>
      <stop offset="1" stop-color="#3fd8c8"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#3fd8c8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3fd8c8" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>
  <rect width="920" height="920" fill="#06070a"/>
  <ellipse cx="460" cy="430" rx="300" ry="360" fill="url(#halo)"/>
  <!-- obsidian prism -->
  <g transform="translate(460 460)">
    <polygon points="0,-330 150,-250 150,250 0,330 -150,250 -150,-250"
             fill="url(#glass)" stroke="#3fd8c8" stroke-opacity="0.5" stroke-width="2"/>
    <polygon points="0,-330 150,-250 0,-200 -150,-250" fill="#3fd8c8" fill-opacity="0.10"/>
    <polygon points="0,330 150,250 0,300 -150,250" fill="#e8b85c" fill-opacity="0.08"/>
    <!-- internal data streams -->
    <g stroke="url(#streamG)" stroke-width="3" stroke-linecap="round" opacity="0.85" filter="url(#blur)">
      <line x1="-60" y1="220" x2="-40" y2="-220"/>
      <line x1="0" y1="240" x2="20" y2="-240"/>
      <line x1="60" y1="210" x2="80" y2="-200"/>
    </g>
    <g stroke="#3fd8c8" stroke-width="1.5" opacity="0.6">
      <line x1="-60" y1="220" x2="-40" y2="-220"/>
      <line x1="0" y1="240" x2="20" y2="-240"/>
      <line x1="60" y1="210" x2="80" y2="-200"/>
    </g>
  </g>
  <text x="460" y="855" text-anchor="middle" fill="#3b4458" font-family="monospace" font-size="20" letter-spacing="4">HERO_MONOLITH · PLACEHOLDER</text>
</svg>
