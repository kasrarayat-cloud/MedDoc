# ============================================================================
# Isolated QA / E2E stack — compose project "meddoc-qa".
# ----------------------------------------------------------------------------
# A fully self-contained, throwaway clone of the transcribe-md runtime for
# aggressive QA / E2E WITHOUT ever touching the production `meddoc` database
# (QA report finding F1). It is isolated from prod by construction:
#   - separate compose PROJECT  → separate network; service name `postgres`
#     resolves to THIS postgres, never prod's.
#   - FRESH named volumes        → never the prod /mnt/pgdata-encrypted mount.
#   - DB NAME `meddoc_qa_test`   → the fail-closed db-guard (packages/db/
#     src/db-guard.ts) only proceeds for a qa/test-marked DB, so the seeders
#     + E2E cleanup physically cannot run against prod's `meddoc`.
#   - reuses the ALREADY-BUILT prod images (no rebuild → no heap-OOM).
#   - MOCK_AI_CALLS=true + dummy API keys → cannot reach real APIs / burn tokens.
#   - app published on 127.0.0.1:9020 only; pg/redis/minio internal.
#
# Full flow + commands: docs/qa/README.md
# Teardown (removes the qa volumes too):
#   docker compose -f docker-compose.qa.yml down -v
# ============================================================================
name: meddoc-qa

x-qa-owner-db-url: &qa-owner-db-url postgresql://meddoc:qa_test_pw@postgres:5432/meddoc_qa_test?schema=public&options=-c%20search_path%3Dpg_catalog%2Cpublic
x-qa-runtime-db-url: &qa-runtime-db-url "postgresql://meddoc_runtime:${QA_DB_RUNTIME_PASSWORD:?QA_DB_RUNTIME_PASSWORD is required}@postgres:5432/meddoc_qa_test?schema=public&options=-c%20search_path%3Dpg_catalog%2Cpublic"
x-qa-secret: &qa-secret "qa-throwaway-secret-not-used-in-prod-000000000000000="

services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:7d400e340efb42f4d8c9c12c6427adb253f726881a9985d2a471bf0eed824dff
    restart: "no"
    mem_limit: 512m
    cpus: "1.0"
    environment:
      POSTGRES_DB: meddoc_qa_test # qa/test marker → db-guard allows mutation
      POSTGRES_USER: meddoc
      POSTGRES_PASSWORD: qa_test_pw
      PGDATA: /var/lib/postgresql/data/pgdata
      DB_RUNTIME_PASSWORD: ${QA_DB_RUNTIME_PASSWORD:?QA_DB_RUNTIME_PASSWORD is required}
      DB_RELEASE_CONTROL_PASSWORD: ${QA_DB_RELEASE_CONTROL_PASSWORD:?QA_DB_RELEASE_CONTROL_PASSWORD is required}
      DB_AUDIT_DISPATCHER_PASSWORD: ${QA_DB_AUDIT_DISPATCHER_PASSWORD:?QA_DB_AUDIT_DISPATCHER_PASSWORD is required}
      DB_AUTH_EMAIL_DISPATCHER_PASSWORD: ${QA_DB_AUTH_EMAIL_DISPATCHER_PASSWORD:?QA_DB_AUTH_EMAIL_DISPATCHER_PASSWORD is required}
      DB_BACKUP_PASSWORD_FILE: /run/secrets/qa_postgres_backup_password
    volumes:
      - qa_pgdata:/var/lib/postgresql/data # FRESH isolated volume (NOT prod)
      - ./infra/postgres/init-template-twin-roles.sh:/docker-entrypoint-initdb.d/20-quillmd-exact-principals.sh:ro
    secrets:
      - qa_postgres_backup_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meddoc"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: "no"
    mem_limit: 128m
    cpus: "0.5"
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Exact production scanner profile, isolated to this synthetic QA project.
  # There is deliberately no TCP listener or published port. The disposable
  # QA signature volume persists across `up`/`down` and is removed by the
  # documented `down -v` teardown.
  template-twin-clamav:
    image: clamav/clamav:1.4.5@sha256:48eaad9644475c2d466ce6d4ba2da892dbd4dcd47713201d31b665364655cc3c
    restart: "no"
    entrypoint: ["/bin/sh", "/opt/quillmd/clamav-entrypoint.sh"]
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    mem_limit: 1536m
    cpus: "1.0"
    stop_grace_period: 30s
    environment:
      CLAMD_STARTUP_TIMEOUT: "600"
      CLAMAV_SIGNATURE_MAX_AGE_SECONDS: "172800"
      FRESHCLAM_CHECKS: "24"
    networks:
      - template_twin_scanner
    volumes:
      - qa_clamav_signatures:/var/lib/clamav
      - qa_clamav_socket:/run/clamav
      - ./deploy/clamav/clamd.conf:/etc/clamav/clamd.conf:ro
      - ./deploy/clamav/freshclam.conf:/etc/clamav/freshclam.conf:ro
      - ./deploy/clamav/entrypoint.sh:/opt/quillmd/clamav-entrypoint.sh:ro
      - ./deploy/clamav/readiness.sh:/opt/quillmd/clamav-readiness.sh:ro
    healthcheck:
      test: ["CMD", "/bin/sh", "/opt/quillmd/clamav-readiness.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 10m

  minio:
    image: minio/minio:latest
    restart: "no"
    mem_limit: 256m
    cpus: "0.5"
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: qa_minio
      MINIO_ROOT_PASSWORD: qa_minio_pw
    volumes:
      - qa_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot, QA-only bucket provisioning. The Template Twin bucket is
  # distinct from transient audio storage, private, object-lock capable, and
  # versioned. This is synthetic infrastructure evidence only; it is not a
  # production compliance attestation.
  minio-template-init:
    image: minio/mc:latest
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set qa http://minio:9000 qa_minio qa_minio_pw
        mc mb --ignore-existing qa/transcribe-md-audio-qa
        mc mb --ignore-existing --with-lock qa/transcribe-md-template-artifacts-qa
        mc anonymous set none qa/transcribe-md-template-artifacts-qa
        mc version enable qa/transcribe-md-template-artifacts-qa

  # One-shot schema apply (cached builder image — has the prisma CLI; no build).
  # Invoke: docker compose -f docker-compose.qa.yml run --rm db-migrate
  db-migrate:
    image: ${QA_DB_MIGRATE_IMAGE:-meddoc-pro-db-migrate:latest}
    profiles: ["migrations"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: *qa-owner-db-url
    working_dir: /app/packages/db
    entrypoint: ["npx", "--no-install", "prisma"]
    command: ["migrate", "deploy"]

  transcribe-md:
    image: ${QA_TRANSCRIBE_MD_IMAGE:-meddoc-pro-transcribe-md:latest}
    restart: "no"
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: "1.0"
    group_add:
      - "101"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-template-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: *qa-runtime-db-url
      REDIS_URL: redis://redis:6379/15
      QUILLMD_SERVICE_ROLE: physician-app
      QUILLMD_DATABASE_PRINCIPAL_PROFILE: synthetic-disposable-qa-v1
      QUILLMD_AUTH_SESSION_VERIFIER_PROFILE: ""
      MFA_SECRET_ACTIVE_KEY_ID: ${QA_MFA_SECRET_ACTIVE_KEY_ID:?QA_MFA_SECRET_ACTIVE_KEY_ID is required}
      MFA_SECRET_KEYRING_FILE: ${QA_MFA_SECRET_KEYRING_FILE:?QA_MFA_SECRET_KEYRING_FILE is required}
      MFA_SECRET_LEGACY_READ_MODE: strict
      MFA_SECRET_LEGACY_READ_UNTIL: ""
      MFA_SECRET_LEGACY_READ_ATTESTATION: ""
      AUTH_URL: http://localhost:9020
      NEXTAUTH_URL: http://localhost:9020
      AUTH_TRUST_HOST: "true"
      ADMIN_PUBLIC_HOST: localhost
      PHYSICIAN_PUBLIC_HOST: localhost
      ADMIN_SYNTHETIC_QA_SHARED_HOST_ATTESTATION: accepted-isolated-synthetic-qa-shared-host
      AUTH_SECRET: *qa-secret
      NEXTAUTH_SECRET: *qa-secret
      AUTH_USE_MOCK: "${AUTH_USE_MOCK:-false}"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: qa_minio
      MINIO_SECRET_KEY: qa_minio_pw
      TRANSCRIBE_MD_MINIO_BUCKET: transcribe-md-audio-qa
      TRANSCRIBE_MD_TEMPLATE_BUCKET: transcribe-md-template-artifacts-qa
      MINIO_USE_SSL: "false"
      TEMPLATE_TWIN_STORAGE_PROFILE: qa
      # These are explicit, named exceptions for this isolated synthetic QA
      # stack. They acknowledge controls local MinIO does not prove; they are
      # not production attestations and readiness remains productionReady=false.
      TEMPLATE_TWIN_QA_STORAGE_ENCRYPTION_AT_REST_ATTESTATION: accepted-isolated-synthetic-qa-gap
      TEMPLATE_TWIN_QA_STORAGE_TLS_EXPECTATION_ATTESTATION: accepted-isolated-synthetic-qa-gap
      TEMPLATE_TWIN_QA_STORAGE_LEAST_PRIVILEGE_ATTESTATION: accepted-isolated-synthetic-qa-gap
      TEMPLATE_TWIN_QA_STORAGE_LIFECYCLE_RETENTION_ATTESTATION: accepted-isolated-synthetic-qa-gap
      TEMPLATE_TWIN_QA_STORAGE_BACKUP_RESTORE_ATTESTATION: accepted-isolated-synthetic-qa-gap
      TEMPLATE_TWIN_ORPHAN_RETENTION_DAYS: "7"
      # No media is approved in the synthetic QA profile. Real byte digests
      # require practice-scoped Privacy/Legal + Operations change control.
      TEMPLATE_TWIN_APPROVED_STATIC_ASSETS_BY_PRACTICE_JSON: "{}"
      QUILLMD_REQUIRED_RUNTIME_PROTOCOL_EPOCH: template-twin-final-schema-v2
      TEMPLATE_TWIN_RUNTIME_MODE: standard
      TEMPLATE_TWIN_KILL_SWITCH: "false"
      TEMPLATE_TWIN_MALWARE_SCANNER_SOCKET: /var/run/quillmd-clamav/clamd.sock
      TEMPLATE_TWIN_MALWARE_SCANNER_READINESS_FILE: /var/run/quillmd-clamav/readiness.json
      # Authenticated synthetic staging UI. Resource identity is fixed to this
      # disposable QA stack, but the enable flag defaults empty, so the UI and
      # every staging mutation remain unavailable unless a QA operator opts in.
      TEMPLATE_TWIN_STAGING_QA_ENABLED: "${TEMPLATE_TWIN_STAGING_QA_ENABLED:-}"
      TEMPLATE_TWIN_STAGING_QA_ENVIRONMENT: qa
      TEMPLATE_TWIN_STAGING_QA_RESOURCE_ATTESTATION: isolated-disposable-qa-v1
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      # E2E signups use reserved synthetic-only domains; auto-confirm needs BOTH the allowlist and
      # the prod-gate flag (the image runs NODE_ENV=production). SAFE ONLY in
      # this throwaway :9020 stack — these two vars must NEVER appear in the
      # real production compose env (they would bypass email verification).
      EMAIL_AUTO_CONFIRM_DOMAINS: "synthetic.test,example.test"
      EMAIL_AUTO_CONFIRM_ALLOW_IN_PROD: "true"
      # TEST-ONLY: the E2E suite drives ~6 signups from one runner IP and would
      # trip the per-IP SIGNUP limit (5/hour), making the gate flaky. Disable
      # rate limiting in this throwaway stack only. TWO flags are required in
      # production (this image runs NODE_ENV=production) so a single stray var
      # can never disable prod rate-limiting — same posture as the
      # EMAIL_AUTO_CONFIRM flags above. Both MUST NEVER appear in the real
      # production compose env.
      RATE_LIMIT_DISABLED: "true"
      RATE_LIMIT_DISABLE_ALLOW_IN_PROD: "true"
      # No real API calls anywhere in this stack.
      MOCK_AI_CALLS: "${MOCK_AI_CALLS:-true}"
      MOCK_TEMPLATE_TWIN_E2E: "${MOCK_TEMPLATE_TWIN_E2E:-}"
      # Note-format PHI-gate reject path (E2E scenario 23). Default empty (off)
      # so the normal suite's parses succeed; the e2e workflow recreates this
      # app with MOCK_TEMPLATE_PHI_FLAG=true for the dedicated phi-reject pass,
      # which flips the mocked PHI scan to its FLAGGED variant so every parse
      # rejects. Only honored under MOCK_AI_CALLS — never touches a real call.
      MOCK_TEMPLATE_PHI_FLAG: "${MOCK_TEMPLATE_PHI_FLAG:-}"
      # Rx clinical-safety (E2E scenario 24). Default empty (off) so signing
      # isn't blocked elsewhere; the e2e workflow recreates the worker with
      # MOCK_RX_WARNINGS=true for the dedicated rx-safety pass, which returns the
      # populated tm_rx_drafting fixture (a critical + major + minor warning).
      # L7c runs in the WORKER; set here on the app too for symmetry (harmless —
      # the app never calls tm_rx_drafting). Only honored under MOCK_AI_CALLS.
      MOCK_RX_WARNINGS: "${MOCK_RX_WARNINGS:-}"
      # Real keys are injected via shell env ONLY for model evals (never committed);
      # default mock-key-qa keeps the standard MOCK qa/CI flow self-contained.
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-mock-key-qa}"
      DEEPGRAM_API_KEY: "${DEEPGRAM_API_KEY:-mock-key-qa}"
      # Clinical-model override for evals (feat/fable5-eval). Empty default →
      # the app/worker keep their hardcoded per-layer models (prod behaviour).
      TRANSCRIBE_MD_CLINICAL_MODEL: "${TRANSCRIBE_MD_CLINICAL_MODEL:-}"
    volumes:
      - qa_clamav_socket:/var/run/quillmd-clamav:ro
      - ${QA_MFA_SECRET_KEYRING_FILE:?QA_MFA_SECRET_KEYRING_FILE is required}:${QA_MFA_SECRET_KEYRING_FILE:?QA_MFA_SECRET_KEYRING_FILE is required}:ro
    healthcheck:
      test:
        ["CMD", "wget", "-qO-", "--spider", "http://127.0.0.1:3011/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    ports:
      - "127.0.0.1:9020:3011"

  transcribe-md-worker:
    image: ${QA_TRANSCRIBE_MD_WORKER_IMAGE:-meddoc-pro-transcribe-md-worker:latest}
    restart: "no"
    cap_drop:
      - ALL
    mem_limit: 1g
    cpus: "1.0"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-template-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: *qa-runtime-db-url
      NODE_ENV: production
      QUILLMD_SERVICE_ROLE: transcribe-md-worker
      QUILLMD_DATABASE_PRINCIPAL_PROFILE: synthetic-disposable-qa-v1
      QUILLMD_AUTH_SESSION_VERIFIER_PROFILE: ""
      MFA_SECRET_ACTIVE_KEY_ID: ""
      MFA_SECRET_KEYRING_FILE: ""
      MFA_SECRET_LEGACY_READ_MODE: ""
      MFA_SECRET_LEGACY_READ_UNTIL: ""
      MFA_SECRET_LEGACY_READ_ATTESTATION: ""
      REDIS_URL: redis://redis:6379/15
      AUTH_SECRET: *qa-secret
      NEXTAUTH_SECRET: *qa-secret
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: qa_minio
      MINIO_SECRET_KEY: qa_minio_pw
      TRANSCRIBE_MD_MINIO_BUCKET: transcribe-md-audio-qa
      TRANSCRIBE_MD_TEMPLATE_BUCKET: transcribe-md-template-artifacts-qa
      MINIO_USE_SSL: "false"
      TEMPLATE_TWIN_STORAGE_PROFILE: qa
      # Keep worker evidence identical to the app. Private access plus
      # versioning/object lock are provider-verified at runtime; these named
      # values acknowledge only the remaining isolated synthetic-QA gaps.
      TEMPLATE_TWIN_QA_STORAGE_ENCRYPTION_AT_REST_ATTESTATION: accepted-isolated-synthetic-qa-gap
      TEMPLATE_TWIN_QA_STORAGE_TLS_EXPECTATION_ATTESTATION: accepted-isolated-synthetic-qa-gap
      TEMPLATE_TWIN_QA_STORAGE_LEAST_PRIVILEGE_ATTESTATION: accepted-isolated-synthetic-qa-gap
      TEMPLATE_TWIN_QA_STORAGE_LIFECYCLE_RETENTION_ATTESTATION: accepted-isolated-synthetic-qa-gap
      TEMPLATE_TWIN_QA_STORAGE_BACKUP_RESTORE_ATTESTATION: accepted-isolated-synthetic-qa-gap
      TEMPLATE_TWIN_ORPHAN_RETENTION_DAYS: "7"
      TEMPLATE_TWIN_MAINTENANCE_ENABLED: "true"
      QUILLMD_REQUIRED_RUNTIME_PROTOCOL_EPOCH: template-twin-final-schema-v2
      TEMPLATE_TWIN_RUNTIME_MODE: standard
      TEMPLATE_TWIN_KILL_SWITCH: "false"
      TEMPLATE_TWIN_STAGING_QA_ENABLED: "${TEMPLATE_TWIN_STAGING_QA_ENABLED:-}"
      TEMPLATE_TWIN_STAGING_QA_ENVIRONMENT: qa
      TEMPLATE_TWIN_STAGING_QA_RESOURCE_ATTESTATION: isolated-disposable-qa-v1
      TRANSCRIBE_MD_WORKER_CONCURRENCY: "2"
      MOCK_AI_CALLS: "${MOCK_AI_CALLS:-true}"
      MOCK_TEMPLATE_TWIN_E2E: "${MOCK_TEMPLATE_TWIN_E2E:-}"
      # Rx clinical-safety (E2E scenario 24): L7c rx-drafting runs HERE. Default
      # empty (off); the e2e workflow recreates this worker with
      # MOCK_RX_WARNINGS=true for the rx-safety pass so new visits get the
      # populated tm_rx_drafting fixture (critical + major + minor warnings).
      MOCK_RX_WARNINGS: "${MOCK_RX_WARNINGS:-}"
      # Real keys are injected via shell env ONLY for model evals (never committed);
      # default mock-key-qa keeps the standard MOCK qa/CI flow self-contained.
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-mock-key-qa}"
      DEEPGRAM_API_KEY: "${DEEPGRAM_API_KEY:-mock-key-qa}"
      # Clinical-model override for evals (feat/fable5-eval). Empty default →
      # the app/worker keep their hardcoded per-layer models (prod behaviour).
      TRANSCRIBE_MD_CLINICAL_MODEL: "${TRANSCRIBE_MD_CLINICAL_MODEL:-}"

  # Marketing site (apps/marketing) — static Next, no backend. Opt-in via the
  # `marketing` profile so the default qa flow (transcribe-md E2E) never starts
  # it. Used by the `--project=marketing` smoke (scenario 28); the signup-CTA
  # URL is BAKED at image-build time (NEXT_PUBLIC_TRANSCRIBE_MD_APP_URL), so
  # build with TRANSCRIBE_MD_AUTH_URL=http://localhost:9020 for the funnel
  # assertion. NOT wired into the required e2e CI gate (see scenario 28 header).
  marketing:
    image: meddoc-pro-marketing:latest
    profiles: ["marketing"]
    restart: "no"
    mem_limit: 256m
    cpus: "0.5"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--spider", "http://127.0.0.1:3010/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    ports:
      - "127.0.0.1:9010:3010"

secrets:
  qa_postgres_backup_password:
    file: ${QA_DB_BACKUP_PASSWORD_FILE:?QA_DB_BACKUP_PASSWORD_FILE is required}

volumes:
  qa_pgdata:
  qa_minio:
  qa_clamav_signatures:
  qa_clamav_socket:

networks:
  template_twin_scanner:
    driver: bridge
