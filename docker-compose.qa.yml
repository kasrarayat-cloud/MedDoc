# ============================================================================
# Isolated QA / E2E stack — compose project "meddoc-qa".
# ----------------------------------------------------------------------------
# A fully self-contained, throwaway clone of the transcribe-md runtime for
# aggressive QA / E2E WITHOUT ever touching the production `meddoc` database
# (QA report finding F1). It is isolated from prod by construction:
#   - separate compose PROJECT  → separate network; service name `postgres`
#     resolves to THIS postgres, never prod's.
#   - FRESH named volumes        → never the prod /mnt/pgdata-encrypted mount.
#   - DB NAME `meddoc_qa_test`   → the fail-closed db-guard (packages/db/
#     src/db-guard.ts) only proceeds for a qa/test-marked DB, so the seeders
#     + E2E cleanup physically cannot run against prod's `meddoc`.
#   - reuses the ALREADY-BUILT prod images (no rebuild → no heap-OOM).
#   - MOCK_AI_CALLS=true + dummy API keys → cannot reach real APIs / burn tokens.
#   - app published on 127.0.0.1:9020 only; pg/redis/minio internal.
#
# Full flow + commands: docs/qa/README.md
# Teardown (removes the qa volumes too):
#   docker compose -f docker-compose.qa.yml down -v
# ============================================================================
name: meddoc-qa

x-qa-db-url: &qa-db-url postgresql://meddoc:qa_test_pw@postgres:5432/meddoc_qa_test?schema=public
x-qa-secret: &qa-secret "qa-throwaway-secret-not-used-in-prod-000000000000000="

services:

  gotenberg:
    # C2-b: gotenberg PLUS the fonts the PDF export embeds. The stock image has
    # neither Charter nor Inter Tight, so LibreOffice substituted Noto Serif and
    # the on-screen preview — which is this container's render of the DOCX —
    # showed a different typeface from the file the doctor downloads. Proven by
    # converting one DOCX through both images and reading /BaseFont out of each
    # result. `image:` is kept so the tag stays stable for compose and rollback.
    build:
      context: apps/transcribe-md/fonts
      dockerfile: ../../../docker/gotenberg-fonts.Dockerfile
    image: meddoc-pro-gotenberg:fonts
    restart: unless-stopped
    # LibreOffice peaks well under this per conversion; the cap stops a
    # pathological document from competing with the clinical pipeline.
    mem_limit: 1g
    cpus: '1.5'
    networks:
      - converter
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    security_opt:
      - no-new-privileges:true
    command:
      - gotenberg
      - --api-port=3000
      # Belt on top of the internal network: refuse any conversion that would
      # dereference a remote resource.
      - --chromium-deny-list=.*
      - --api-timeout=25s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
  postgres:
    image: pgvector/pgvector:pg16
    restart: "no"
    mem_limit: 512m
    cpus: '1.0'
    environment:
      POSTGRES_DB: meddoc_qa_test        # qa/test marker → db-guard allows mutation
      POSTGRES_USER: meddoc
      POSTGRES_PASSWORD: qa_test_pw
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - qa_pgdata:/var/lib/postgresql/data   # FRESH isolated volume (NOT prod)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meddoc"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: "no"
    mem_limit: 128m
    cpus: '0.5'
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # ⚠️ quay.io, NOT Docker Hub — the migration to GitHub-hosted CI runners
    # surfaced Docker Hub's anonymous pull quota on shared hosted IPs: e2e failed
    # with "pull access denied for minio/minio" while pgvector/redis pulled. MinIO
    # publishes the same image to quay.io/minio/minio, which has no anonymous
    # quota. QA/e2e ONLY — the production compose is deliberately untouched.
    image: quay.io/minio/minio:latest
    restart: "no"
    mem_limit: 256m
    cpus: '0.5'
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: qa_minio
      MINIO_ROOT_PASSWORD: qa_minio_pw
    volumes:
      - qa_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot schema apply (cached builder image — has the prisma CLI; no build).
  # Invoke: docker compose -f docker-compose.qa.yml run --rm db-migrate
  # ⚠️ NO `build:` SECTION HERE, AND THAT IS DELIBERATE — but it has a sharp
  # edge worth knowing before it bites you.
  #
  # This stack CONSUMES images by name; it never builds them. That is the whole
  # point: QA must run a build byte-identical to the promoted one. Images are
  # built from the PROD compose file, exactly as CI does it:
  #
  #     docker compose -p meddoc-pro -f docker-compose.yml build transcribe-md
  #     docker compose -p meddoc-pro -f docker-compose.yml --profile migrations build db-migrate
  #
  # THE EDGE: because there is no build section, running
  # `docker compose -f docker-compose.qa.yml build db-migrate` is a SILENT
  # NO-OP. Compose has nothing to build, prints nothing, exits 0 — and the next
  # `run --rm db-migrate` quietly uses a stale image. That is how new migrations
  # went unapplied here on 2026-07-28 while the log read "No pending migrations
  # to apply". Always follow with
  # `bash scripts/assert-migrations-applied.sh meddoc-qa-postgres-1 meddoc_qa_test`,
  # which caught exactly this on its first real use.
  db-migrate:
    # Own tag, own build — see the note on transcribe-md above.
    image: meddoc-pro-db-migrate:qa
    build:
      context: .
      dockerfile: apps/transcribe-md/Dockerfile
      # ⚠️ `target: builder` IS LOAD-BEARING AND OMITTING IT BROKE CI ONCE.
      # This service's entrypoint is `npx --no-install prisma`, and the Prisma
      # CLI is a devDependency — present only in the BUILDER stage. Building the
      # default (runtime) stage produces an image that starts fine and then dies
      # with `npx canceled due to missing packages: ["prisma@7.9.1"]`.
      # Mirrors docker-compose.yml's db-migrate exactly.
      target: builder
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: *qa-db-url
    working_dir: /app/packages/db
    entrypoint: ["npx", "--no-install", "prisma"]
    command: ["migrate", "deploy"]

  transcribe-md:
    # ⚠️ QA HAS ITS OWN TAG AND BUILDS IT ITSELF — 2026-08-05 (TEAMS hygiene 1).
    # This read `meddoc-pro-transcribe-md:latest`, the SAME tag production builds
    # to, on the SAME daemon. So staging any image for QA meant retagging
    # `:latest`, which silently re-points the tag prod's compose would deploy.
    # DEPLOYMENT_RUNBOOK forbids exactly that ("never rebuild prod's :latest to
    # stage something") and this file left no other way in — a prohibition the
    # default path violated. It cost a ~1h window on 2026-08-05 where a prod
    # `compose up` would have shipped an untested image (nothing ran; rollback
    # tags were verified intact).
    #
    # The build args mirror production's deliberately: QA must be
    # production-SHAPED, and "the pack is green" and "the shipped product works"
    # have to be one statement. `scripts/check-qa-tag-isolation.sh` asserts no QA
    # container ever runs the prod :latest digest.
    image: meddoc-pro-transcribe-md:qa
    build:
      context: .
      dockerfile: apps/transcribe-md/Dockerfile
      args:
        NEXT_PUBLIC_TRANSCRIBE_MD_APP_URL: "http://localhost:9020"
        NEXT_PUBLIC_MARKETING_URL: "http://localhost:9010"
        NEXT_PUBLIC_SHOW_PIPELINE_TAB: "false"
        NEXT_PUBLIC_SKIN_BETA: "${NEXT_PUBLIC_SKIN_BETA:-true}"
        NEXT_PUBLIC_REVIEW_DOC_VIEW: "${NEXT_PUBLIC_REVIEW_DOC_VIEW:-true}"
        NEXT_PUBLIC_UX_SIMPLIFY: "${NEXT_PUBLIC_UX_SIMPLIFY:-true}"
        NEXT_PUBLIC_CHAT_EDITOR: "${NEXT_PUBLIC_CHAT_EDITOR:-true}"
        NEXT_PUBLIC_DOC_PREVIEW: "${NEXT_PUBLIC_DOC_PREVIEW:-true}"
        NEXT_PUBLIC_SETTINGS_SIMPLE_ROW: "${NEXT_PUBLIC_SETTINGS_SIMPLE_ROW:-true}"
        NEXT_PUBLIC_VISIT_DOC_PAGE: "${NEXT_PUBLIC_VISIT_DOC_PAGE:-true}"
        NEXT_PUBLIC_ULTRASOUND_SPECIALTY: "${NEXT_PUBLIC_ULTRASOUND_SPECIALTY:-true}"
        NEXT_PUBLIC_TEMPLATE_NATIVE_DOCX: "${NEXT_PUBLIC_TEMPLATE_NATIVE_DOCX:-true}"
        NEXT_PUBLIC_TEMPLATE_NATIVE_PDF: "${NEXT_PUBLIC_TEMPLATE_NATIVE_PDF:-true}"
    restart: "no"
    mem_limit: 512m
    cpus: '1.0'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: *qa-db-url
      REDIS_URL: redis://redis:6379
      AUTH_URL: http://localhost:9020
      NEXTAUTH_URL: http://localhost:9020
      AUTH_TRUST_HOST: "true"
      AUTH_SECRET: *qa-secret
      NEXTAUTH_SECRET: *qa-secret
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: qa_minio
      MINIO_SECRET_KEY: qa_minio_pw
      TRANSCRIBE_MD_MINIO_BUCKET: transcribe-md-audio
      MINIO_USE_SSL: "false"
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      # E2E signups use @test.dev; auto-confirm needs BOTH the allowlist and
      # the prod-gate flag (the image runs NODE_ENV=production). SAFE ONLY in
      # this throwaway :9020 stack — these two vars must NEVER appear in the
      # real production compose env (they would bypass email verification).
      EMAIL_AUTO_CONFIRM_DOMAINS: "test.dev,quillmd-test.local"
      EMAIL_AUTO_CONFIRM_ALLOW_IN_PROD: "true"
      # TEST-ONLY: the E2E suite drives ~6 signups from one runner IP and would
      # trip the per-IP SIGNUP limit (5/hour), making the gate flaky. Disable
      # rate limiting in this throwaway stack only. TWO flags are required in
      # production (this image runs NODE_ENV=production) so a single stray var
      # can never disable prod rate-limiting — same posture as the
      # EMAIL_AUTO_CONFIRM flags above. Both MUST NEVER appear in the real
      # production compose env.
      RATE_LIMIT_DISABLED: "true"
      RATE_LIMIT_DISABLE_ALLOW_IN_PROD: "true"
      # Invite-only signup (2026-07-28). The suite drives real signups, so it
      # needs a real code. NOTE THE POSTURE: the gate is NOT disabled for tests
      # — there is no off switch, deliberately. The E2E stack is simply an
      # invited tenant, so every scenario exercises the same code path a pilot
      # doctor will. A suite that ran against a switched-off gate would prove
      # nothing about the gate.
      SIGNUP_INVITE_CODES: "E2E-PILOT-CODE"
      # NEXT_PUBLIC_SKIN_ROUNDS removed 2026-08-05 (F-ret.3). It was a runtime
      # entry for a BUILD-TIME flag and its own comment said so — kept only "so
      # `docker compose config` shows the intended posture". That is precisely
      # the decoy shape: a line that reads as a control and controls nothing.
      # The flag itself no longer exists.
      # ⚠️ NO REAL API CALLS ANYWHERE IN THIS STACK — and this line is how that
      # promise is actually kept, after it was broken for weeks.
      #
      # This used to read `${MOCK_AI_CALLS:-true}`. The `:-true` looks like a
      # safe default and is not one: it applies only when the variable is
      # UNSET, and `.env` sets `MOCK_AI_CALLS=false` because PRODUCTION must
      # make real calls. Compose reads that same `.env`, so the QA stack
      # silently inherited prod's setting and made REAL calls — 298 recorded
      # Anthropic calls and real Deepgram requests, on a stack whose entire
      # purpose is to make none. It also burns the shared Anthropic balance
      # that production depends on.
      #
      # HARD-CODED, not interpolated. No `${...}` here at all: an expression
      # clever enough to express "default true unless opted out" is an
      # expression clever enough to be wrong, which is precisely how this broke.
      # If you genuinely need live models here, write an override compose file
      # — the same pattern docker-compose.qa.reviewdoc.yml already uses — so the
      # decision is a visible, reviewable file rather than an ambient variable.
      MOCK_AI_CALLS: "true"
      # Note-format PHI-gate reject path (E2E scenario 23). Default empty (off)
      # so the normal suite's parses succeed; the e2e workflow recreates this
      # app with MOCK_TEMPLATE_PHI_FLAG=true for the dedicated phi-reject pass,
      # which flips the mocked PHI scan to its FLAGGED variant so every parse
      # rejects. Only honored under MOCK_AI_CALLS — never touches a real call.
      MOCK_TEMPLATE_PHI_FLAG: "${MOCK_TEMPLATE_PHI_FLAG:-}"
      # Rx clinical-safety (E2E scenario 24). Default empty (off) so signing
      # isn't blocked elsewhere; the e2e workflow recreates the worker with
      # MOCK_RX_WARNINGS=true for the dedicated rx-safety pass, which returns the
      # populated tm_rx_drafting fixture (a critical + major + minor warning).
      # L7c runs in the WORKER; set here on the app too for symmetry (harmless —
      # the app never calls tm_rx_drafting). Only honored under MOCK_AI_CALLS.
      MOCK_RX_WARNINGS: "${MOCK_RX_WARNINGS:-}"
      # Symmetry with the worker, same as the line above — the app runs neither
      # L4b nor L5/L6. See the worker service for why both of these exist.
      TRANSCRIBE_MD_EVIDENCE_ANCHORS: "true"
      MOCK_CRITIQUE_ISSUES: "${MOCK_CRITIQUE_ISSUES:-}"
      # Real keys are injected via shell env ONLY for model evals (never committed);
      # default mock-key-qa keeps the standard MOCK qa/CI flow self-contained.
      # ⚠️ CREDENTIALS ARE SEVERED, NOT DEFAULTED — the second half of the
      # 2026-07-28 fix, and the half that survives a code regression.
      #
      # These used to read `${ANTHROPIC_API_KEY:-mock-key-qa}`. Identical trap
      # to MOCK_AI_CALLS: `:-` applies only when the variable is UNSET, and
      # /opt/meddoc-pro/.env sets both because production needs them. Compose
      # reads that same .env, so the "isolated" stack was holding a live
      # `sk-ant-api03-…` and a live Deepgram key. Verified in the running
      # container, not inferred from the file.
      #
      # MOCK_AI_CALLS=true stops the calls only while every code path honours
      # the flag. One missed branch — a new layer, a retry helper, a script —
      # and a real key is right there. Hard-coded dummies mean a mock
      # regression FAILS AUTH instead of billing a vendor and leaking a
      # synthetic transcript out of a stack that promised to hold nothing.
      #
      # Every vendor credential the codebase reads is listed, INCLUDING the
      # ones prod leaves unset today: an unset key is one .env line away from
      # being a real one, and this list is the thing that keeps that from
      # mattering.
      ANTHROPIC_API_KEY: "qa-dummy-anthropic-key-never-valid"
      DEEPGRAM_API_KEY: "qa-dummy-deepgram-key-never-valid"
      OPENAI_API_KEY: "qa-dummy-openai-key-never-valid"
      # B7 — STRIPE. LITERAL DUMMIES, and the literalness is the whole point.
      #
      # ⚠️ NEVER `${STRIPE_SECRET_KEY:-sk_test_…}` HERE. `:-` applies only when
      # the variable is UNSET, and compose interpolation reads the project
      # `.env` whether or not this file declares an `env_file` — which is
      # exactly how `${MOCK_AI_CALLS:-true}` and `${ANTHROPIC_API_KEY:-mock-key-qa}`
      # inherited PRODUCTION values for weeks and cost 298 real Anthropic calls
      # from the stack whose header promised it could reach nothing.
      #
      # ⚠️ AND STRIPE IS TEST MODE ONLY ON THIS PROGRAMME — a hard-halt item at
      # the top of the FOUNDATION master prompt. A dummy that is not even
      # `sk_test_`-shaped is deliberate: it cannot be mistaken for a working
      # test key, so nothing here can quietly start succeeding.
      STRIPE_SECRET_KEY: "qa-dummy-stripe-secret-never-valid"
      # The webhook's fail-closed arm keys on this being TRUTHY. A dummy leaves
      # `api/stripe/webhook` ACTIVE and rejecting every signature, which is the
      # posture closest to production; an empty value would make it 503 and the
      # verification path would never run on QA at all.
      STRIPE_WEBHOOK_SECRET: "qa-dummy-stripe-webhook-secret-never-valid"
      # RESEND IS THE EXCEPTION: EMPTY, not a dummy.
      #
      # A dummy is stronger than absence for a vendor the code will call
      # regardless. Resend is not one: `isEmailDeliveryEnabled()` gates on the
      # key being TRUTHY, and when it is falsy the app logs a dev-only reset
      # link instead of mailing it — which is exactly what the password-reset
      # E2E reads. Handing it a dummy makes delivery look ENABLED, the link
      # stops being logged, and scenario 17 fails. Caught by that test.
      #
      # Absence is the stronger posture here anyway: no key means the send path
      # is switched off rather than attempted-and-rejected.
      RESEND_API_KEY: ""
      # Sentry: empty string, not a dummy. The SDK no-ops on an empty DSN and
      # would spend every event retrying a malformed one.
      SENTRY_DSN: ""
      SENTRY_DSN_TRANSCRIBE_MD: ""
      # Clinical-model override for evals (feat/fable5-eval). Empty default →
      # the app/worker keep their hardcoded per-layer models (prod behaviour).
      TRANSCRIBE_MD_CLINICAL_MODEL: "${TRANSCRIBE_MD_CLINICAL_MODEL:-}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--spider", "http://127.0.0.1:3011/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    ports:
      - "127.0.0.1:9020:3011"
    networks:
      - default
      - converter


  transcribe-md-worker:
    # Own tag, own build — see the note on transcribe-md above.
    image: meddoc-pro-transcribe-md-worker:qa
    build:
      context: .
      dockerfile: apps/transcribe-md/Dockerfile.worker
    restart: "no"
    mem_limit: 1g
    cpus: '1.0'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: *qa-db-url
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: *qa-secret
      NEXTAUTH_SECRET: *qa-secret
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: qa_minio
      MINIO_SECRET_KEY: qa_minio_pw
      TRANSCRIBE_MD_MINIO_BUCKET: transcribe-md-audio
      MINIO_USE_SSL: "false"
      TRANSCRIBE_MD_WORKER_CONCURRENCY: "2"
      # HARD-CODED — see the long note on the app service above. The worker is
      # the one that actually calls Deepgram and Anthropic, so this line is the
      # one that was costing money.
      MOCK_AI_CALLS: "true"
      # Rx clinical-safety (E2E scenario 24): L7c rx-drafting runs HERE. Default
      # empty (off); the e2e workflow recreates this worker with
      # MOCK_RX_WARNINGS=true for the rx-safety pass so new visits get the
      # populated tm_rx_drafting fixture (critical + major + minor warnings).
      MOCK_RX_WARNINGS: "${MOCK_RX_WARNINGS:-}"
      # ⚠️ PRODUCTION-SHAPED, AND UNTIL 2026-08-10 IT WAS NOT. Production's
      # worker carries TRANSCRIBE_MD_EVIDENCE_ANCHORS=true — verified by
      # reading the RUNNING container, not the compose file — and this stack
      # never set it. So L4b, the per-claim entailment verifier, has NEVER run
      # on QA: `evidence-anchors-flag.ts:9` defaults it OFF, the worker logged
      # `enabled:false` at every boot, and `tm_anchor_entailment` had zero rows
      # here while production held 231.
      #
      # Found by B4's coverage run, which could not COUNT a stage that never
      # RAN. The stated intent of this file is that QA be production-shaped;
      # this line is that intent made true, declared rather than inherited so a
      # future .env cannot quietly flip it.
      #
      # Inert on SOAP content under MOCK: the flag appends an anchoring block to
      # L4's system prompt, and a mocked L4 returns a fixture regardless.
      TRANSCRIBE_MD_EVIDENCE_ANCHORS: "true"
      # ⚠️ F27 — THE SAME CLASS AS THE ENTRY DIRECTLY ABOVE, ELEVEN MORE
      # MEMBERS, NEVER ENUMERATED. That entry fixed ONE variable
      # (TRANSCRIBE_MD_EVIDENCE_ANCHORS) because ONE variable had bitten. The
      # predicate it should have been swept by is "every var production's
      # WORKER carries at runtime that this stack does not" — naming a class is
      # not enumerating it.
      #
      # THE MECHANISM, and it is a side effect of a control that is CORRECT.
      # Production delivers each NEXT_PUBLIC_* flag by TWO paths:
      #   1. build.args      -> Next INLINES it into the frontend bundle
      #   2. env_file: .env  -> the WORKER's runtime process.env
      # docker-compose.yml:561-573 says so in its own comments. This file
      # declares the same names under `build.args` ONLY (:173-185) and has ZERO
      # env_file declarations — deliberately, because inheriting the shared
      # .env is exactly what put 298 real Anthropic calls through this stack.
      # The severance is right. The flags rode .env to the worker, so the
      # worker silently lost ALL of them.
      #
      # MEASURED 2026-08-24, both containers running `npx tsx src/worker.ts`
      # (identical shape — so the env is the only difference):
      #   prod worker: templateNativeDocxEnabled() = true   | 11 NEXT_PUBLIC_*
      #   QA   worker: templateNativeDocxEnabled() = false   |  0 NEXT_PUBLIC_*
      #
      # CONSEQUENCE: worker/template-twin-fill-step.ts:76 returned
      # `{status:'skipped', reason:'flag_off'}` for EVERY QA visit, so the
      # per-visit twin fill could not run here at all and
      # template_twin_fill_manifests sat at 0. Ruling #144's acceptance walk —
      # override -> EXPORT-AFTER-OVERRIDE -> SIGN-AFTER-OVERRIDE — was
      # UNPERFORMABLE on this stack, and a harness driven through the worker
      # would have measured a system nobody ships.
      #
      # ⚠️ LITERALS, NEVER `${VAR:-default}`. Compose interpolation reads the
      # project .env whether or not this file declares an env_file — the trap
      # named at length in the credentials block below. `:-` applies only when
      # UNSET, and production sets every one of these.
      #
      # The two URLs are QA's OWN (matching build.args :173-174), not
      # production's — copying prod's values verbatim would point this stack at
      # app.quillmd.com.
      NEXT_PUBLIC_TEMPLATE_NATIVE_DOCX: "true"
      NEXT_PUBLIC_TEMPLATE_NATIVE_PDF: "true"
      NEXT_PUBLIC_ULTRASOUND_SPECIALTY: "true"
      NEXT_PUBLIC_REVIEW_DOC_VIEW: "true"
      NEXT_PUBLIC_UX_SIMPLIFY: "true"
      NEXT_PUBLIC_VISIT_DOC_PAGE: "true"
      NEXT_PUBLIC_CHAT_EDITOR: "true"
      NEXT_PUBLIC_DOC_PREVIEW: "true"
      NEXT_PUBLIC_SETTINGS_SIMPLE_ROW: "true"
      NEXT_PUBLIC_TRANSCRIBE_MD_APP_URL: "http://localhost:9020"
      NEXT_PUBLIC_MARKETING_URL: "http://localhost:9010"
      # B4's closing gate. Default empty (off) so every other suite keeps the
      # `issues: []` critique it relies on. With it set, L5 returns ONE MINOR
      # issue, which is what makes L6 call its model instead of taking the
      # passthrough at 06-polish.ts:186 — the only way `tm_polish` and
      # `tm_polish_gate` can be counted on a mocked run.
      MOCK_CRITIQUE_ISSUES: "${MOCK_CRITIQUE_ISSUES:-}"
      # Real keys are injected via shell env ONLY for model evals (never committed);
      # default mock-key-qa keeps the standard MOCK qa/CI flow self-contained.
      # ⚠️ CREDENTIALS ARE SEVERED, NOT DEFAULTED — the second half of the
      # 2026-07-28 fix, and the half that survives a code regression.
      #
      # These used to read `${ANTHROPIC_API_KEY:-mock-key-qa}`. Identical trap
      # to MOCK_AI_CALLS: `:-` applies only when the variable is UNSET, and
      # /opt/meddoc-pro/.env sets both because production needs them. Compose
      # reads that same .env, so the "isolated" stack was holding a live
      # `sk-ant-api03-…` and a live Deepgram key. Verified in the running
      # container, not inferred from the file.
      #
      # MOCK_AI_CALLS=true stops the calls only while every code path honours
      # the flag. One missed branch — a new layer, a retry helper, a script —
      # and a real key is right there. Hard-coded dummies mean a mock
      # regression FAILS AUTH instead of billing a vendor and leaking a
      # synthetic transcript out of a stack that promised to hold nothing.
      #
      # Every vendor credential the codebase reads is listed, INCLUDING the
      # ones prod leaves unset today: an unset key is one .env line away from
      # being a real one, and this list is the thing that keeps that from
      # mattering.
      ANTHROPIC_API_KEY: "qa-dummy-anthropic-key-never-valid"
      DEEPGRAM_API_KEY: "qa-dummy-deepgram-key-never-valid"
      OPENAI_API_KEY: "qa-dummy-openai-key-never-valid"
      # B7 — STRIPE. LITERAL DUMMIES, and the literalness is the whole point.
      #
      # ⚠️ NEVER `${STRIPE_SECRET_KEY:-sk_test_…}` HERE. `:-` applies only when
      # the variable is UNSET, and compose interpolation reads the project
      # `.env` whether or not this file declares an `env_file` — which is
      # exactly how `${MOCK_AI_CALLS:-true}` and `${ANTHROPIC_API_KEY:-mock-key-qa}`
      # inherited PRODUCTION values for weeks and cost 298 real Anthropic calls
      # from the stack whose header promised it could reach nothing.
      #
      # ⚠️ AND STRIPE IS TEST MODE ONLY ON THIS PROGRAMME — a hard-halt item at
      # the top of the FOUNDATION master prompt. A dummy that is not even
      # `sk_test_`-shaped is deliberate: it cannot be mistaken for a working
      # test key, so nothing here can quietly start succeeding.
      STRIPE_SECRET_KEY: "qa-dummy-stripe-secret-never-valid"
      # The webhook's fail-closed arm keys on this being TRUTHY. A dummy leaves
      # `api/stripe/webhook` ACTIVE and rejecting every signature, which is the
      # posture closest to production; an empty value would make it 503 and the
      # verification path would never run on QA at all.
      STRIPE_WEBHOOK_SECRET: "qa-dummy-stripe-webhook-secret-never-valid"
      # RESEND IS THE EXCEPTION: EMPTY, not a dummy.
      #
      # A dummy is stronger than absence for a vendor the code will call
      # regardless. Resend is not one: `isEmailDeliveryEnabled()` gates on the
      # key being TRUTHY, and when it is falsy the app logs a dev-only reset
      # link instead of mailing it — which is exactly what the password-reset
      # E2E reads. Handing it a dummy makes delivery look ENABLED, the link
      # stops being logged, and scenario 17 fails. Caught by that test.
      #
      # Absence is the stronger posture here anyway: no key means the send path
      # is switched off rather than attempted-and-rejected.
      RESEND_API_KEY: ""
      # Sentry: empty string, not a dummy. The SDK no-ops on an empty DSN and
      # would spend every event retrying a malformed one.
      SENTRY_DSN: ""
      SENTRY_DSN_TRANSCRIBE_MD: ""
      # Clinical-model override for evals (feat/fable5-eval). Empty default →
      # the app/worker keep their hardcoded per-layer models (prod behaviour).
      TRANSCRIBE_MD_CLINICAL_MODEL: "${TRANSCRIBE_MD_CLINICAL_MODEL:-}"

  # Marketing site (apps/marketing) — static Next, no backend. Opt-in via the
  # `marketing` profile so the default qa flow (transcribe-md E2E) never starts
  # it. Used by the `--project=marketing` smoke (scenario 28); the signup-CTA
  # URL is BAKED at image-build time (NEXT_PUBLIC_TRANSCRIBE_MD_APP_URL), so
  # build with TRANSCRIBE_MD_AUTH_URL=http://localhost:9020 for the funnel
  # assertion. NOT wired into the required e2e CI gate (see scenario 28 header).
  marketing:
    # Own tag — see the note on transcribe-md above. Profile-gated (`marketing`),
    # so the default QA stack never starts it; the build is declared anyway so
    # enabling the profile does not fail on a missing image.
    image: meddoc-pro-marketing:qa
    build:
      context: .
      dockerfile: apps/marketing/Dockerfile
      # Mirrors prod's args. Omitting build args is the same class of miss as
      # the `target: builder` above: a partial copy of a build block produces an
      # image that looks right and behaves differently.
      args:
        NEXT_PUBLIC_TRANSCRIBE_MD_APP_URL: "http://localhost:9020"
        NEXT_PUBLIC_MARKETING_URL: "http://localhost:9010"
    profiles: ["marketing"]
    restart: "no"
    mem_limit: 256m
    cpus: '0.5'
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--spider", "http://127.0.0.1:3010/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    ports:
      - "127.0.0.1:9010:3010"

networks:
  default:
  # Same isolation as prod: no gateway, so the converter has no route out.
  converter:
    internal: true

volumes:
  qa_pgdata:
  qa_minio:
