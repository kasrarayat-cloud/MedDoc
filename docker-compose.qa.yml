# ============================================================================
# Isolated QA / E2E stack — compose project "meddoc-qa".
# ----------------------------------------------------------------------------
# A fully self-contained, throwaway clone of the transcribe-md runtime for
# aggressive QA / E2E WITHOUT ever touching the production `meddoc` database
# (QA report finding F1). It is isolated from prod by construction:
#   - separate compose PROJECT  → separate network; service name `postgres`
#     resolves to THIS postgres, never prod's.
#   - FRESH named volumes        → never the prod /mnt/pgdata-encrypted mount.
#   - DB NAME `meddoc_qa_test`   → the fail-closed db-guard (packages/db/
#     src/db-guard.ts) only proceeds for a qa/test-marked DB, so the seeders
#     + E2E cleanup physically cannot run against prod's `meddoc`.
#   - reuses the ALREADY-BUILT prod images (no rebuild → no heap-OOM).
#   - MOCK_AI_CALLS=true + dummy API keys → cannot reach real APIs / burn tokens.
#   - app published on 127.0.0.1:9020 only; pg/redis/minio internal.
#
# Full flow + commands: docs/qa/README.md
# Teardown (removes the qa volumes too):
#   docker compose -f docker-compose.qa.yml down -v
# ============================================================================
name: meddoc-qa

x-qa-db-url: &qa-db-url postgresql://meddoc:qa_test_pw@postgres:5432/meddoc_qa_test?schema=public
x-qa-secret: &qa-secret "qa-throwaway-secret-not-used-in-prod-000000000000000="

services:

  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    # LibreOffice peaks well under this per conversion; the cap stops a
    # pathological document from competing with the clinical pipeline.
    mem_limit: 1g
    cpus: '1.5'
    networks:
      - converter
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    security_opt:
      - no-new-privileges:true
    command:
      - gotenberg
      - --api-port=3000
      # Belt on top of the internal network: refuse any conversion that would
      # dereference a remote resource.
      - --chromium-deny-list=.*
      - --api-timeout=25s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
  postgres:
    image: pgvector/pgvector:pg16
    restart: "no"
    mem_limit: 512m
    cpus: '1.0'
    environment:
      POSTGRES_DB: meddoc_qa_test        # qa/test marker → db-guard allows mutation
      POSTGRES_USER: meddoc
      POSTGRES_PASSWORD: qa_test_pw
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - qa_pgdata:/var/lib/postgresql/data   # FRESH isolated volume (NOT prod)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meddoc"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: "no"
    mem_limit: 128m
    cpus: '0.5'
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: "no"
    mem_limit: 256m
    cpus: '0.5'
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: qa_minio
      MINIO_ROOT_PASSWORD: qa_minio_pw
    volumes:
      - qa_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot schema apply (cached builder image — has the prisma CLI; no build).
  # Invoke: docker compose -f docker-compose.qa.yml run --rm db-migrate
  # ⚠️ NO `build:` SECTION HERE, AND THAT IS DELIBERATE — but it has a sharp
  # edge worth knowing before it bites you.
  #
  # This stack CONSUMES images by name; it never builds them. That is the whole
  # point: QA must run a build byte-identical to the promoted one. Images are
  # built from the PROD compose file, exactly as CI does it:
  #
  #     docker compose -p meddoc-pro -f docker-compose.yml build transcribe-md
  #     docker compose -p meddoc-pro -f docker-compose.yml --profile migrations build db-migrate
  #
  # THE EDGE: because there is no build section, running
  # `docker compose -f docker-compose.qa.yml build db-migrate` is a SILENT
  # NO-OP. Compose has nothing to build, prints nothing, exits 0 — and the next
  # `run --rm db-migrate` quietly uses a stale image. That is how new migrations
  # went unapplied here on 2026-07-28 while the log read "No pending migrations
  # to apply". Always follow with
  # `bash scripts/assert-migrations-applied.sh meddoc-qa-postgres-1 meddoc_qa_test`,
  # which caught exactly this on its first real use.
  db-migrate:
    image: meddoc-pro-db-migrate:latest
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: *qa-db-url
    working_dir: /app/packages/db
    entrypoint: ["npx", "--no-install", "prisma"]
    command: ["migrate", "deploy"]

  transcribe-md:
    image: meddoc-pro-transcribe-md:latest
    restart: "no"
    mem_limit: 512m
    cpus: '1.0'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: *qa-db-url
      REDIS_URL: redis://redis:6379
      AUTH_URL: http://localhost:9020
      NEXTAUTH_URL: http://localhost:9020
      AUTH_TRUST_HOST: "true"
      AUTH_SECRET: *qa-secret
      NEXTAUTH_SECRET: *qa-secret
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: qa_minio
      MINIO_SECRET_KEY: qa_minio_pw
      TRANSCRIBE_MD_MINIO_BUCKET: transcribe-md-audio
      MINIO_USE_SSL: "false"
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      # E2E signups use @test.dev; auto-confirm needs BOTH the allowlist and
      # the prod-gate flag (the image runs NODE_ENV=production). SAFE ONLY in
      # this throwaway :9020 stack — these two vars must NEVER appear in the
      # real production compose env (they would bypass email verification).
      EMAIL_AUTO_CONFIRM_DOMAINS: "test.dev,quillmd-test.local"
      EMAIL_AUTO_CONFIRM_ALLOW_IN_PROD: "true"
      # TEST-ONLY: the E2E suite drives ~6 signups from one runner IP and would
      # trip the per-IP SIGNUP limit (5/hour), making the gate flaky. Disable
      # rate limiting in this throwaway stack only. TWO flags are required in
      # production (this image runs NODE_ENV=production) so a single stray var
      # can never disable prod rate-limiting — same posture as the
      # EMAIL_AUTO_CONFIRM flags above. Both MUST NEVER appear in the real
      # production compose env.
      RATE_LIMIT_DISABLED: "true"
      RATE_LIMIT_DISABLE_ALLOW_IN_PROD: "true"
      # Invite-only signup (2026-07-28). The suite drives real signups, so it
      # needs a real code. NOTE THE POSTURE: the gate is NOT disabled for tests
      # — there is no off switch, deliberately. The E2E stack is simply an
      # invited tenant, so every scenario exercises the same code path a pilot
      # doctor will. A suite that ran against a switched-off gate would prove
      # nothing about the gate.
      SIGNUP_INVITE_CODES: "E2E-PILOT-CODE"
      # ⚠️ NO REAL API CALLS ANYWHERE IN THIS STACK — and this line is how that
      # promise is actually kept, after it was broken for weeks.
      #
      # This used to read `${MOCK_AI_CALLS:-true}`. The `:-true` looks like a
      # safe default and is not one: it applies only when the variable is
      # UNSET, and `.env` sets `MOCK_AI_CALLS=false` because PRODUCTION must
      # make real calls. Compose reads that same `.env`, so the QA stack
      # silently inherited prod's setting and made REAL calls — 298 recorded
      # Anthropic calls and real Deepgram requests, on a stack whose entire
      # purpose is to make none. It also burns the shared Anthropic balance
      # that production depends on.
      #
      # HARD-CODED, not interpolated. No `${...}` here at all: an expression
      # clever enough to express "default true unless opted out" is an
      # expression clever enough to be wrong, which is precisely how this broke.
      # If you genuinely need live models here, write an override compose file
      # — the same pattern docker-compose.qa.reviewdoc.yml already uses — so the
      # decision is a visible, reviewable file rather than an ambient variable.
      MOCK_AI_CALLS: "true"
      # Note-format PHI-gate reject path (E2E scenario 23). Default empty (off)
      # so the normal suite's parses succeed; the e2e workflow recreates this
      # app with MOCK_TEMPLATE_PHI_FLAG=true for the dedicated phi-reject pass,
      # which flips the mocked PHI scan to its FLAGGED variant so every parse
      # rejects. Only honored under MOCK_AI_CALLS — never touches a real call.
      MOCK_TEMPLATE_PHI_FLAG: "${MOCK_TEMPLATE_PHI_FLAG:-}"
      # Rx clinical-safety (E2E scenario 24). Default empty (off) so signing
      # isn't blocked elsewhere; the e2e workflow recreates the worker with
      # MOCK_RX_WARNINGS=true for the dedicated rx-safety pass, which returns the
      # populated tm_rx_drafting fixture (a critical + major + minor warning).
      # L7c runs in the WORKER; set here on the app too for symmetry (harmless —
      # the app never calls tm_rx_drafting). Only honored under MOCK_AI_CALLS.
      MOCK_RX_WARNINGS: "${MOCK_RX_WARNINGS:-}"
      # Real keys are injected via shell env ONLY for model evals (never committed);
      # default mock-key-qa keeps the standard MOCK qa/CI flow self-contained.
      # ⚠️ CREDENTIALS ARE SEVERED, NOT DEFAULTED — the second half of the
      # 2026-07-28 fix, and the half that survives a code regression.
      #
      # These used to read `${ANTHROPIC_API_KEY:-mock-key-qa}`. Identical trap
      # to MOCK_AI_CALLS: `:-` applies only when the variable is UNSET, and
      # /opt/meddoc-pro/.env sets both because production needs them. Compose
      # reads that same .env, so the "isolated" stack was holding a live
      # `sk-ant-api03-…` and a live Deepgram key. Verified in the running
      # container, not inferred from the file.
      #
      # MOCK_AI_CALLS=true stops the calls only while every code path honours
      # the flag. One missed branch — a new layer, a retry helper, a script —
      # and a real key is right there. Hard-coded dummies mean a mock
      # regression FAILS AUTH instead of billing a vendor and leaking a
      # synthetic transcript out of a stack that promised to hold nothing.
      #
      # Every vendor credential the codebase reads is listed, INCLUDING the
      # ones prod leaves unset today: an unset key is one .env line away from
      # being a real one, and this list is the thing that keeps that from
      # mattering.
      ANTHROPIC_API_KEY: "qa-dummy-anthropic-key-never-valid"
      DEEPGRAM_API_KEY: "qa-dummy-deepgram-key-never-valid"
      OPENAI_API_KEY: "qa-dummy-openai-key-never-valid"
      RESEND_API_KEY: "qa-dummy-resend-key-never-valid"
      # Sentry: empty string, not a dummy. The SDK no-ops on an empty DSN and
      # would spend every event retrying a malformed one.
      SENTRY_DSN: ""
      SENTRY_DSN_TRANSCRIBE_MD: ""
      # Clinical-model override for evals (feat/fable5-eval). Empty default →
      # the app/worker keep their hardcoded per-layer models (prod behaviour).
      TRANSCRIBE_MD_CLINICAL_MODEL: "${TRANSCRIBE_MD_CLINICAL_MODEL:-}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--spider", "http://127.0.0.1:3011/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    ports:
      - "127.0.0.1:9020:3011"
    networks:
      - default
      - converter


  transcribe-md-worker:
    image: meddoc-pro-transcribe-md-worker:latest
    restart: "no"
    mem_limit: 1g
    cpus: '1.0'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: *qa-db-url
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: *qa-secret
      NEXTAUTH_SECRET: *qa-secret
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: qa_minio
      MINIO_SECRET_KEY: qa_minio_pw
      TRANSCRIBE_MD_MINIO_BUCKET: transcribe-md-audio
      MINIO_USE_SSL: "false"
      TRANSCRIBE_MD_WORKER_CONCURRENCY: "2"
      # HARD-CODED — see the long note on the app service above. The worker is
      # the one that actually calls Deepgram and Anthropic, so this line is the
      # one that was costing money.
      MOCK_AI_CALLS: "true"
      # Rx clinical-safety (E2E scenario 24): L7c rx-drafting runs HERE. Default
      # empty (off); the e2e workflow recreates this worker with
      # MOCK_RX_WARNINGS=true for the rx-safety pass so new visits get the
      # populated tm_rx_drafting fixture (critical + major + minor warnings).
      MOCK_RX_WARNINGS: "${MOCK_RX_WARNINGS:-}"
      # Real keys are injected via shell env ONLY for model evals (never committed);
      # default mock-key-qa keeps the standard MOCK qa/CI flow self-contained.
      # ⚠️ CREDENTIALS ARE SEVERED, NOT DEFAULTED — the second half of the
      # 2026-07-28 fix, and the half that survives a code regression.
      #
      # These used to read `${ANTHROPIC_API_KEY:-mock-key-qa}`. Identical trap
      # to MOCK_AI_CALLS: `:-` applies only when the variable is UNSET, and
      # /opt/meddoc-pro/.env sets both because production needs them. Compose
      # reads that same .env, so the "isolated" stack was holding a live
      # `sk-ant-api03-…` and a live Deepgram key. Verified in the running
      # container, not inferred from the file.
      #
      # MOCK_AI_CALLS=true stops the calls only while every code path honours
      # the flag. One missed branch — a new layer, a retry helper, a script —
      # and a real key is right there. Hard-coded dummies mean a mock
      # regression FAILS AUTH instead of billing a vendor and leaking a
      # synthetic transcript out of a stack that promised to hold nothing.
      #
      # Every vendor credential the codebase reads is listed, INCLUDING the
      # ones prod leaves unset today: an unset key is one .env line away from
      # being a real one, and this list is the thing that keeps that from
      # mattering.
      ANTHROPIC_API_KEY: "qa-dummy-anthropic-key-never-valid"
      DEEPGRAM_API_KEY: "qa-dummy-deepgram-key-never-valid"
      OPENAI_API_KEY: "qa-dummy-openai-key-never-valid"
      RESEND_API_KEY: "qa-dummy-resend-key-never-valid"
      # Sentry: empty string, not a dummy. The SDK no-ops on an empty DSN and
      # would spend every event retrying a malformed one.
      SENTRY_DSN: ""
      SENTRY_DSN_TRANSCRIBE_MD: ""
      # Clinical-model override for evals (feat/fable5-eval). Empty default →
      # the app/worker keep their hardcoded per-layer models (prod behaviour).
      TRANSCRIBE_MD_CLINICAL_MODEL: "${TRANSCRIBE_MD_CLINICAL_MODEL:-}"

  # Marketing site (apps/marketing) — static Next, no backend. Opt-in via the
  # `marketing` profile so the default qa flow (transcribe-md E2E) never starts
  # it. Used by the `--project=marketing` smoke (scenario 28); the signup-CTA
  # URL is BAKED at image-build time (NEXT_PUBLIC_TRANSCRIBE_MD_APP_URL), so
  # build with TRANSCRIBE_MD_AUTH_URL=http://localhost:9020 for the funnel
  # assertion. NOT wired into the required e2e CI gate (see scenario 28 header).
  marketing:
    image: meddoc-pro-marketing:latest
    profiles: ["marketing"]
    restart: "no"
    mem_limit: 256m
    cpus: '0.5'
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--spider", "http://127.0.0.1:3010/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    ports:
      - "127.0.0.1:9010:3010"

networks:
  default:
  # Same isolation as prod: no gateway, so the converter has no route out.
  converter:
    internal: true

volumes:
  qa_pgdata:
  qa_minio:
