# ============================================================================
# The ON contract for the document-first surfaces.
#
# Sibling of docker-compose.qa.flagoff.yml. That file proves what a ROLLBACK
# renders; this one proves what a PROMOTION renders. Both are needed, because
# all four gates are build-time inlined — reading the source tells you nothing
# about which branch the compiler shipped.
#
#   docker build -f apps/transcribe-md/Dockerfile \
#     --build-arg NEXT_PUBLIC_VISIT_DOC_PAGE=true \
#     --build-arg NEXT_PUBLIC_REVIEW_DOC_VIEW=true \
#     --build-arg NEXT_PUBLIC_CHAT_EDITOR=true \
#     --build-arg NEXT_PUBLIC_DOC_PREVIEW=true \
#     --build-arg NEXT_PUBLIC_SETTINGS_SIMPLE_ROW=true \
#     --build-arg NEXT_PUBLIC_TEMPLATE_NATIVE_DOCX=true \
#     --build-arg NEXT_PUBLIC_ULTRASOUND_SPECIALTY=true \
#     --build-arg NEXT_PUBLIC_UX_SIMPLIFY=true \
#     --build-arg NEXT_PUBLIC_SKIN_BETA=true \
#     -t meddoc-pro-transcribe-md:docuniversal .
#
#   docker compose -f docker-compose.qa.yml -f docker-compose.qa.docuniversal.yml \
#     up -d --wait transcribe-md
#
# Deliberately NOT :latest — production's compose resolves
# `meddoc-pro-transcribe-md:latest`, so retagging here would repoint prod on
# its next recreate.
# ============================================================================
services:
  transcribe-md:
    image: meddoc-pro-transcribe-md:docuniversal
