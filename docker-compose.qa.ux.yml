# ============================================================================
# UX simplification pack STAGING override — runs the isolated QA stack
# (docker-compose.qa.yml, project meddoc-qa, :9020, synthetic DB, MOCK_AI) with
# the FLAG-ON image so both simplified surfaces can be walked end-to-end before
# promotion.
#
# Usage:
#   docker build -f apps/transcribe-md/Dockerfile \
#     --build-arg NEXT_PUBLIC_SKIN_BETA=true \
#     --build-arg NEXT_PUBLIC_ULTRASOUND_SPECIALTY=true \
#     --build-arg NEXT_PUBLIC_UX_SIMPLIFY=true \
#     --build-arg NEXT_PUBLIC_TRANSCRIBE_MD_APP_URL=http://localhost:9020 \
#     --build-arg NEXT_PUBLIC_MARKETING_URL=https://quillmd.com \
#     -t meddoc-pro-transcribe-md:ux-simplify .
#
#   docker compose -f docker-compose.qa.yml -f docker-compose.qa.ux.yml \
#     up -d --wait transcribe-md
#
# Production is untouched: separate project / network / volumes, and this only
# swaps the app image to the separately-tagged :ux-simplify build (prod :latest
# is never referenced here). Bound to 127.0.0.1:9020.
#
# NOTE on the flag: NEXT_PUBLIC_UX_SIMPLIFY is read by CLIENT components, so it
# is inlined at BUILD time. Setting it as a runtime container env here would do
# nothing — hence the separately-tagged image rather than an env override. Same
# reason docker-compose.qa.skin.yml swaps an image instead of setting a var.
# ============================================================================
services:
  transcribe-md:
    image: meddoc-pro-transcribe-md:ux-simplify
    environment:
      # Server-read flags (NOT inlined into the client bundle) still come from
      # the runtime env, matching production, so the native-PDF certify + export
      # path the confirm card exercises behaves exactly as it does in prod.
      NEXT_PUBLIC_TEMPLATE_NATIVE_PDF: "true"

  transcribe-md-worker:
    image: meddoc-pro-transcribe-md:ux-simplify
    environment:
      NEXT_PUBLIC_TEMPLATE_NATIVE_PDF: "true"
