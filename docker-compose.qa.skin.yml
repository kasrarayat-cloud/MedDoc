# ============================================================================
# C3 redesign STAGING override — runs the isolated QA stack (docker-compose.qa.yml,
# project meddoc-qa, :9020, synthetic DB, MOCK_AI) with the FLAG-ON image so the
# real redesigned app can be walked end-to-end before promotion.
#
# Usage:
#   docker compose -f docker-compose.qa.yml -f docker-compose.qa.skin.yml \
#     up -d --wait transcribe-md
#
# Production is untouched: separate project / network / volumes, and this only
# swaps the app image to the separately-tagged :skin-beta build (prod :latest is
# never referenced here). Bound to 127.0.0.1:9020 — reach it via an SSH tunnel.
# ============================================================================
services:
  transcribe-md:
    image: meddoc-pro-transcribe-md:skin-beta
