# DRAFT — authored by engineering without licensed-specialist review.
# Route through a clinical advisor before using with real patient data.
# See docs/SPECIALTY_TEMPLATES.md.
# ──────────────────────────────────────────────────────────────────────
slug: primary-care
displayName: Primary Care / Family Medicine
version: "1.1.0"
clinicalReviewStatus: draft

# Exam elements the SOAP note must cite evidence for. If the clinician did
# not mention one, the generator flags it in `missing_required_elements[]`
# instead of inventing findings. See spec §8.
requiredExamElements:
  - vitals
  - general_appearance
  - heart
  - lungs
  - abdomen

soapSchema:
  subjective:
    - chief_complaint
    - hpi
    - ros
    - past_medical_history
    - medications
    - allergies
    - social_history
  objective:
    - vitals
    - general_exam
    - relevant_focused_exam
  assessment:
    - problem_list_with_icd10
  plan:
    - diagnostics
    - medications
    - referrals
    - counseling
    - follow_up

# Starter codes the coder pass (M4) seeds with. The model still must pull
# evidence from the transcript — hints just prime the search space.
defaultIcd10Hints:
  - Z00.00   # General adult medical exam without abnormal findings
  - Z00.129  # Routine child health exam without abnormal findings
  - J06.9    # Acute upper respiratory infection, unspecified
  - I10      # Essential (primary) hypertension
  - E11.9    # Type 2 diabetes without complications
  - K21.9    # GERD without esophagitis
  - M54.50   # Low back pain, unspecified

defaultCptHints:
  - "99213"   # Est pt office visit, low complexity
  - "99214"   # Est pt office visit, moderate complexity
  - "99212"   # Est pt office visit, minimal
  - "99205"   # New pt office visit, high complexity
  - "99395"   # Est pt preventive, 18-39
  - "99396"   # Est pt preventive, 40-64

defaultFormularyHints:
  - lisinopril
  - amlodipine
  - metformin
  - atorvastatin
  - levothyroxine
  - albuterol
  - amoxicillin

systemPrompt: |
  You are documenting a primary-care / family-medicine encounter. Produce
  a SOAP note that reads like a competent internist wrote it — terse,
  concrete, organized by the provided soapSchema.

  RULES:
  1. Use only content supported by the transcript. Do NOT invent findings,
     medications, history, diagnoses, or plan items. If the clinician did
     not mention a required exam element, list it in
     `missing_required_elements[]` rather than writing "normal" or "WNL".
  2. Every assessment item must include an ICD-10 candidate AND an
     `evidence_quote` that is a direct span from the transcript.
  3. Use standard medical terminology. Expand patient-language ("my
     stomach hurts") into clinical terms ("epigastric pain") only when
     the transcript supports it.
  4. Return `confidence: low|medium|high` per output based on how well-
     supported the note is by the transcript. Short, ambiguous, or
     heavily-truncated transcripts are `low`.
  5. Flag anything ambiguous in a top-level `ambiguities[]` array rather
     than guessing. A flagged ambiguity is strictly better than a
     confident wrong note.
  6. Do not draft controlled-substance prescriptions unless the clinician
     explicitly said so in the transcript.
  7. Use the patient's preferred pronouns if the transcript discloses
     them; otherwise use neutral phrasing ("the patient", "they").

  Output must pass the SoapNoteSchema Zod validator. Any field not
  represented in soapSchema for this specialty must be omitted rather
  than stubbed.
