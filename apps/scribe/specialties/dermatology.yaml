  - L81.4      # Other melanin hyperpigmentation
  - L57.0      # Actinic keratosis
  - C44.9      # Malignant neoplasm of skin, unspecified
  - D23.9      # Benign neoplasm of skin, unspecified
  - L82.1      # Seborrheic keratosis
  - B07.9      # Viral wart, unspecified

defaultCptHints:
  - "99213"
  - "99214"
  - "11102"    # Tangential biopsy of skin, single
  - "11104"    # Punch biopsy, single
  - "17000"    # Destruction (e.g., actinic keratosis), first lesion
  - "17003"    # Destruction, additional lesions 2-14
  - "17110"    # Destruction of benign lesions, up to 14
  - "96567"    # Photodynamic therapy, body

defaultFormularyHints:
