slug: cardiology
displayName: Cardiology
version: "1.0.0"
clinicalReviewStatus: draft

requiredExamElements:
  - cardiac_rhythm
  - murmurs
  - jvd
  - peripheral_edema
  - peripheral_pulses

soapSchema:
  subjective:
    - chief_complaint
    - hpi
    - cardiac_ros
    - past_medical_history
    - medications
    - allergies
    - family_cardiac_history
    - social_history
  objective:
    - vitals
    - general_exam
    - cardiac_exam
    - pulmonary_exam
    - extremities_edema
    - peripheral_pulses
    - ecg_findings
  assessment:
    - problem_list_with_icd10
  plan:
    - diagnostics
    - medications
    - procedures
    - risk_factor_modification
    - follow_up

defaultIcd10Hints:
  - I10        # Essential hypertension
  - I25.10     # Atherosclerotic heart disease of native coronary artery
  - I48.91     # Atrial fibrillation, unspecified
  - I50.9      # Heart failure, unspecified
  - I50.22     # Chronic systolic (congestive) HF
  - I35.0      # Nonrheumatic aortic (valve) stenosis
  - R07.9      # Chest pain, unspecified
  - R00.1      # Bradycardia, unspecified
  - I42.9      # Cardiomyopathy, unspecified

defaultCptHints:
  - "99213"
  - "99214"
  - "93000"    # ECG, 12-lead, complete
  - "93010"    # ECG interpretation + report only
  - "93306"    # Echocardiography, TTE, complete w/ Doppler
  - "93320"    # Doppler echocardiography, complete

defaultFormularyHints:
  - aspirin
  - clopidogrel
  - atorvastatin
  - rosuvastatin
  - lisinopril
  - losartan
  - metoprolol succinate
  - carvedilol
  - furosemide
  - spironolactone
  - apixaban
  - warfarin

systemPrompt: |
  You are documenting a cardiology visit. Use ACC/AHA-preferred
  terminology. Always explicitly document rhythm, murmurs, JVD, edema,
  and peripheral pulses — if the clinician did not mention one, list
  its key in `missing_required_elements[]` rather than fabricating
  "normal".

  RULES:
  1. Stage heart failure (NYHA class I–IV) whenever the transcript
     supports it. Do NOT guess class if unmentioned.
  2. Flag arrhythmia mentions explicitly (afib, PACs/PVCs, SVT) and
     document rate control and anticoagulation status if relevant.
  3. Chest-pain visits require a risk stratification line in
     assessment (typical vs atypical, TIMI / HEART if computed).
  4. Use clinical terms for symptoms: "exertional dyspnea" not "short
     of breath when walking"; "orthopnea" when explicitly stated.
  5. Procedural codes (echo, ECG, stress test) go in plan.procedures
     + get a CPT candidate in coding output.
  6. Every assessment item must have an `evidence_quote` that is a
     verbatim substring of the transcript. No ungrounded diagnoses.
  7. Controlled substances are rare in cardiology; don't draft them
     unless the clinician explicitly named one.
