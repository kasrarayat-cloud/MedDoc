{% load static %}
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow"><title>Private preview access · QuillMD</title><link rel="stylesheet" href="{% static 'app.css' %}"></head>
<body><main class="auth-main" id="main"><div class="auth-form"><a class="brand" href="{% url 'preview_sign_in' %}"><span class="brand-mark" aria-hidden="true">Q</span>QuillMD</a><div class="eyebrow">Private preview</div><h1>{{ heading }}</h1><p role="alert">{{ message }}</p><p><a class="button" href="{% if continue_url %}{{ continue_url }}{% else %}{% url 'preview_sign_in' %}{% endif %}">{{ continue_label|default:'Return to preview sign-in' }}</a></p><p class="small">Use synthetic information only.</p></div></main></body></html>
