# Dedicated owner email verification. Public :443 hosts and marketing unchanged.
# The existing certificate covers app.quillmd.com. This listener is not release
# approval and must retain its independent HTTP Basic access gate.
server {
    listen 9443 ssl;
    listen [::]:9443 ssl;
    server_name app.quillmd.com;
    if ($host != app.quillmd.com) { return 444; }

    ssl_certificate /etc/letsencrypt/live/quillmd.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quillmd.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    auth_basic "QuillMD private email verification";
    auth_basic_user_file /etc/nginx/sites-available/quillmd-email-preview.htpasswd;

    # Account capability URLs and Basic credentials must not enter request logs.
    access_log off;
    error_log /dev/null crit;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store" always;
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:9130;
        proxy_http_version 1.1;
        proxy_set_header Host app.quillmd.com:9443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization "";
        proxy_set_header Connection "";
        proxy_cookie_flags ~ secure httponly samesite=strict;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }
}
