# Retired preview origin: no upstream, shared credentials or grants.
# Drop legacy paths and capability queries; all users sign in on normal HTTPS.
server {
    listen 9443 ssl;
    listen [::]:9443 ssl;
    server_name app.quillmd.com;
    if ($host != app.quillmd.com) { return 444; }

    ssl_certificate /etc/letsencrypt/live/quillmd.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quillmd.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Legacy account capability URLs must not enter request logs.
    access_log off;
    error_log /dev/null crit;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Referrer-Policy "strict-origin" always;
    add_header Cache-Control "no-store" always;
    location / {
        return 303 https://app.quillmd.com/login/;
    }
}
