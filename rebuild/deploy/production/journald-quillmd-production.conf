# /etc/systemd/journald.conf.d/quillmd-production.conf, installed by bootstrap-host.sh.
# The journal stays on this host (KMS-encrypted root volume); application logs are NOT shipped
# off-host in V1 because they are not proven free of capability tokens. Bounded size and age.
[Journal]
Storage=persistent
Compress=yes
SystemMaxUse=2G
SystemKeepFree=4G
MaxRetentionSec=30day
ForwardToSyslog=no
