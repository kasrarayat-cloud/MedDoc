# QuillMD PRODUCTION host proxy. Public TLS terminates at the Application Load Balancer (ACM
# certificate); the ALB reaches this host on 8443 over TLS with the self-signed certificate that
# bootstrap-host.sh creates (the ALB does not validate target certificates, so this hop is encryption
# in transit inside the VPC, not identity). The security group admits 8443 from the ALB only.
#
# The loopback ports come from rebuild/ops/production_profile.json (9140 doctor, 9141 admin) and are
# checked against it by ops/test_production_deploy.py.
#
# No request logs anywhere: URLs carry verification, invitation and recovery capability tokens.

# The ALB's nodes live in the VPC (10.40.0.0/16, production-hosting.md). The client address is the
# right-most X-Forwarded-For entry the ALB appended; addresses a client supplied further left are
# ignored. The application's per-client rate limits read X-Real-IP set below.
set_real_ip_from 10.40.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
    listen 8443 ssl default_server;
    ssl_certificate /etc/quillmd-production/ingress/target.crt;
    ssl_certificate_key /etc/quillmd-production/ingress/target.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /var/log/nginx/quillmd-production-error.log crit;
    # The ALB target-group health check arrives with the target address as Host. It reaches the
    # doctor surface's /health/ only, so a healthy target means the application answers, not just nginx.
    location = /health/ {
        proxy_pass http://127.0.0.1:9140;
        proxy_http_version 1.1;
        proxy_set_header Host app.quillmd.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 10s;
    }
    # Any other unknown-Host request: close without a response.
    location / {
        return 444;
    }
}

server {
    listen 8443 ssl;
    server_name app.quillmd.com;
    ssl_certificate /etc/quillmd-production/ingress/target.crt;
    ssl_certificate_key /etc/quillmd-production/ingress/target.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /var/log/nginx/quillmd-production-error.log crit;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Cache-Control "no-store" always;
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:9140;
        proxy_http_version 1.1;
        proxy_set_header Host app.quillmd.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization "";
        proxy_set_header Connection "";
        proxy_redirect off;
        proxy_read_timeout 120s;
    }
}

server {
    listen 8443 ssl;
    server_name admin.quillmd.com;
    ssl_certificate /etc/quillmd-production/ingress/target.crt;
    ssl_certificate_key /etc/quillmd-production/ingress/target.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /var/log/nginx/quillmd-production-error.log crit;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Cache-Control "no-store" always;
    client_max_body_size 2m;

    # Operator source addresses only. bootstrap-host.sh writes this file as "deny all;" so the
    # administration surface is closed until an operator adds reviewed "allow <address>;" lines.
    # The ALB listener rule applies the same allowlist in front of this host.
    include /etc/quillmd-production/ingress/admin-allow.conf;

    location / {
        proxy_pass http://127.0.0.1:9141;
        proxy_http_version 1.1;
        proxy_set_header Host admin.quillmd.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization "";
        proxy_set_header Connection "";
        proxy_redirect off;
        proxy_read_timeout 120s;
    }
}
