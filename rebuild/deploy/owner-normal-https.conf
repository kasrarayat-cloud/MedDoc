# Restricted normal-origin route. Existing private grants are checked by Django.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.quillmd.com;
    if ($host != app.quillmd.com) { return 444; }
    if ($ssl_server_name != app.quillmd.com) { return 444; }

    ssl_certificate /etc/letsencrypt/live/quillmd.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quillmd.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /dev/null crit;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Referrer-Policy "strict-origin" always;
    add_header Cache-Control "no-store" always;
    add_header Retry-After "3600" always;
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:9130;
        proxy_http_version 1.1;
        proxy_set_header Host app.quillmd.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-QuillMD-Preview "1";
        proxy_set_header Authorization "";
        proxy_set_header Connection "";
        proxy_cookie_flags __Host-quillmd_preview secure httponly samesite=lax;
        proxy_cookie_flags ~ secure httponly samesite=strict;
        proxy_redirect off;
        proxy_read_timeout 60s;
        proxy_intercept_errors on;
        error_page 502 504 =503 @owner_maintenance;
    }
    location @owner_maintenance {
        default_type text/plain;
        return 503 "QuillMD is being rebuilt. The doctor application is temporarily unavailable. Please contact your organization administrator.";
    }
}
