# ============================================================================
# ROUNDS staging override — runs the isolated QA stack with the FLAG-ON image.
#
#   docker build -f apps/transcribe-md/Dockerfile \
#     --build-arg NEXT_PUBLIC_SKIN_BETA=true \
#     --build-arg NEXT_PUBLIC_ULTRASOUND_SPECIALTY=true \
#     --build-arg NEXT_PUBLIC_REVIEW_DOC_VIEW=true \
#     --build-arg NEXT_PUBLIC_CHAT_EDITOR=true \
#     --build-arg NEXT_PUBLIC_UX_SIMPLIFY=true \
#     --build-arg NEXT_PUBLIC_SETTINGS_SIMPLE_ROW=true \
#     --build-arg NEXT_PUBLIC_DOC_PREVIEW=true \
#     --build-arg NEXT_PUBLIC_VISIT_DOC_PAGE=true \
#     --build-arg NEXT_PUBLIC_TEMPLATE_NATIVE_DOCX=true \
#     --build-arg NEXT_PUBLIC_DEV_STATES=true \
#     -t meddoc-pro-transcribe-md:rounds .
#   docker compose -f docker-compose.qa.yml -f docker-compose.qa.rounds.yml \
#     up -d --wait transcribe-md
#
# Production is untouched: separate project / network / volumes, and this only
# swaps the app image to the separately-tagged :rounds build. Prod's :latest is
# never referenced here and never rebuilt by this file.
#
# ⚠️ THESE ARE BUILD-TIME FLAGS. Setting one in an environment block does
# nothing — it has to be a --build-arg, and the Dockerfile has to DECLARE the
# ARG or docker discards it silently ("were not consumed"). Verify with the
# inlining grep, never by reading env.
#
# ⚠️ AND THIS RECIPE PROVED THAT ON ITSELF — ruling #295, 2026-09-08. It listed
# `--build-arg NEXT_PUBLIC_SKIN_ROUNDS=true`, and that flag and its reader were
# DELETED on 2026-08-05 (F-ret.3, when Rounds became unconditional). The
# Dockerfile therefore never declared the ARG, and following this recipe printed
#
#     [Warning] One or more build-args [NEXT_PUBLIC_SKIN_ROUNDS] were not consumed
#
# — the exact alarm the paragraph above teaches you to read as "the flag never
# inlined". Harmless here because nothing reads it any more, and that is the
# problem: a stale instruction that raises a real alarm for a false reason
# trains the reader to discount the alarm. `gate-flag-coverage` dropped the flag
# on the same day; this file did not. The line is gone.
#
# CHAT_EDITOR joined the list with Gate B (Screen 2). The stage's chat DRAWER
# only mounts when the view is given a chat node, and the view only builds one
# behind isChatEditor() — so without this arg the drawer is absent and every
# drawer test burns its full timeout on a missing trigger, reading as "the
# drawer is broken" rather than "the image is missing a flag".
# `gate-flag-coverage.test.ts` pins the whole list.
# ============================================================================
services:
  transcribe-md:
    image: meddoc-pro-transcribe-md:rounds
